[build]
  publish = "."
  command = "echo 'Static site build complete'"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20.18.0"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/case-study-free-to-be-free"
  to = "/case-study-free-to-be-free.html"
  status = 200

[[redirects]]
  from = "/case-study-fsa"
  to = "/case-study-fsa.html"
  status = 200

[[redirects]]
  from = "/case-study-teams-final-dm"
  to = "/case-study-teams-final-dm.html"
  status = 200

[[redirects]]
  from = "/case-study-ai-browsing"
  to = "/case-study-ai-browsing.html"
  status = 200

[[redirects]]
  from = "/case-study-edge-ucational"
  to = "/case-study-edge-ucational.html"
  status = 200

[[redirects]]
  from = "/case-study-edge-mobile"
  to = "/caseStudy_edge_mobile.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/cv"
  to = "/cv.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/timeline"
  to = "/timeline.html"
  status = 200

[[redirects]]
  from = "/experience"
  to = "/myexperience.html"
  status = 200

[[redirects]]
  from = "/thoughts"
  to = "/thoughts/index.html"
  status = 200

[[redirects]]
  from = "/insights"
  to = "/insights/index.html"
  status = 200

[[redirects]]
  from = "/experimental"
  to = "/Experimental-HP.html"
  status = 200

# Allow form submissions to the directory path
[[redirects]]
  from = "/insights/move-at-speed-of-what-matters"
  to = "/insights/move-at-speed-of-what-matters/index.html"
  status = 200
  conditions = {Method = ["GET"]}

# Handle form submissions directly to the index.html file
[[redirects]]
  from = "/insights/move-at-speed-of-what-matters"
  to = "/insights/move-at-speed-of-what-matters/index.html"
  status = 200
  conditions = {Method = ["POST"]}

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"

[[redirects]]
  from = "/workwithme"
  to = "/TheHub/IMCServices/"
  status = 301
  force = true

# TheHub redirects - CRITICAL: Must be before catch-all 404 rule
[[redirects]]
  from = "/thehub"
  to = "/TheHub/"
  status = 301

[[redirects]]
  from = "/thehub/*"
  to = "/TheHub/:splat"
  status = 301

[[redirects]]
  from = "/TheHub"
  to = "/TheHub/"
  status = 301

[[redirects]]
  from = "/TheHub/"
  to = "/TheHub/index.html"
  status = 200

[[redirects]]
  from = "/TheHub/*"
  to = "/TheHub/:splat"
  status = 200

# Legacy path redirections to TheHub
[[redirects]]
  from = "/partnerships"
  to = "/TheHub/IMCServices/"
  status = 301

[[redirects]]
  from = "/partnerships/*"
  to = "/TheHub/IMCServices/"
  status = 301

[[redirects]]
  from = "/planning-hub"
  to = "/TheHub/strategyiq/"
  status = 301

[[redirects]]
  from = "/planning-hub/*"
  to = "/TheHub/strategyiq/"
  status = 301

[[redirects]]
  from = "/IMCServices"
  to = "/TheHub/IMCServices/"
  status = 301

[[redirects]]
  from = "/IMCServices/*"
  to = "/TheHub/IMCServices/:splat"
  status = 301

[[redirects]]
  from = "/scope-intelligence"
  to = "/TheHub/strategyiq/"
  status = 301

[[redirects]]
  from = "/scope-intelligence/*"
  to = "/TheHub/strategyiq/:splat"
  status = 301

[[redirects]]
  from = "/advisory"
  to = "/TheHub/advisory/"
  status = 301

[[redirects]]
  from = "/advisory/*"
  to = "/TheHub/advisory/:splat"
  status = 301

[[redirects]]
  from = "/strategyiq"
  to = "/TheHub/strategyiq/"
  status = 301

[[redirects]]
  from = "/strategyiq/*"
  to = "/TheHub/strategyiq/:splat"
  status = 301

# Scope Intelligence redirects - now handled by _redirects file Comment form success redirect - handled by Netlify form submission
# This will be used when the form is submitted successfully

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
