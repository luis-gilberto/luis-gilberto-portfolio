<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Hub - Built for what's next | Luis Gilberto</title>
    <meta name="title" content="The Hub - Built for what's next | Luis Gilberto">

    <meta property="og:url" content="https://luis-gilberto.com/thehub">
    <meta property="og:title" content="The Hub - Built for what's next">
    <meta property="og:description" content="Your central intelligence for strategic marketing, creative solutions, and business transformation. Experience the future of integrated marketing leadership.">
    <meta property="og:image" content="https://luis-gilberto.com/assets/images/the-hub-social-preview.jpg">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://luis-gilberto.com/thehub">
    <meta property="twitter:title" content="The Hub - Built for what's next">
    <meta property="twitter:description" content="Your central intelligence for strategic marketing, creative solutions, and business transformation. Experience the future of integrated marketing leadership.">
    <meta property="twitter:image" content="https://luis-gilberto.com/assets/images/the-hub-social-preview.jpg">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon-180x180.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --coral: #FF6B6B;
            --coral-light: #FF8E8E;
            --coral-dark: #E74C3C;
            --dark-bg: #0a0a0a;
            --dark-secondary: #1a1a1a;
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--dark-bg);
            color: var(--text-light);
            overflow: hidden;
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Animation Container */
        .animation-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 1;
            transition: opacity 1s ease-out;
        }

        .animation-container.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* Logo Animation Elements */
        .logo-animation {
            text-align: center;
            position: relative;
        }

        /* Coral Line Animation */
        .coral-line {
            width: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--coral), var(--coral-light));
            margin: 0 auto 3rem;
            border-radius: 2px;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.4);
            animation: lineExpand 1.5s ease-out 0.5s forwards;
        }

        @keyframes lineExpand {
            0% {
                width: 0;
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                width: 200px;
                opacity: 1;
            }
        }

        /* Hub Title Animation */
        .hub-title {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 800;
            color: var(--coral);
            margin-bottom: 1rem;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
            letter-spacing: -0.02em;
            line-height: 0.9;
            opacity: 0;
            transform: translateY(30px);
            animation: titleReveal 1s ease-out 1.5s forwards;
        }

        @keyframes titleReveal {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Tagline Animation */
        .hub-tagline {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.5px;
            opacity: 0;
            transform: translateY(20px);
            animation: taglineReveal 0.8s ease-out 2.2s forwards;
        }

        @keyframes taglineReveal {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Pulsing Effect After Animation */
        .logo-animation.complete .coral-line {
            animation: linePulse 2s ease-in-out 3.5s infinite;
        }

        .logo-animation.complete .hub-title {
            animation: titlePulse 2s ease-in-out 3.5s infinite;
        }

        @keyframes linePulse {
            0%, 100% {
                box-shadow: 0 0 20px rgba(255, 107, 107, 0.4);
                transform: scaleX(1);
            }
            50% {
                box-shadow: 0 0 40px rgba(255, 107, 107, 0.6);
                transform: scaleX(1.05);
            }
        }

        @keyframes titlePulse {
            0%, 100% {
                text-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
            }
            50% {
                text-shadow: 0 0 50px rgba(255, 107, 107, 0.5);
            }
        }

        /* Background Effects */
        .bg-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(255, 107, 107, 0.05) 0%, var(--dark-bg) 70%);
            z-index: -1;
        }

        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .floating-dot {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--coral);
            border-radius: 50%;
            opacity: 0;
            animation: dotFloat 8s ease-in-out infinite;
        }

        .floating-dot:nth-child(1) {
            top: 20%;
            left: 15%;
            animation-delay: 2s;
        }

        .floating-dot:nth-child(2) {
            top: 60%;
            left: 80%;
            animation-delay: 2.5s;
        }

        .floating-dot:nth-child(3) {
            top: 80%;
            left: 25%;
            animation-delay: 3s;
        }

        .floating-dot:nth-child(4) {
            top: 30%;
            left: 75%;
            animation-delay: 3.5s;
        }

        @keyframes dotFloat {
            0%, 15%, 85%, 100% {
                opacity: 0;
                transform: translateY(0px) scale(1);
            }
            20%, 80% {
                opacity: 0.4;
            }
            50% {
                opacity: 0.6;
                transform: translateY(-20px) scale(1.2);
            }
        }

        /* Skip Button */
        .skip-button {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: var(--text-muted);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            opacity: 0;
            animation: skipButtonShow 0.5s ease-out 1s forwards;
        }

        .skip-button:hover {
            background: rgba(255, 107, 107, 0.1);
            border-color: var(--coral);
            color: var(--text-light);
            transform: translateY(-2px);
        }

        @keyframes skipButtonShow {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Main Content (Hidden Initially) */
        .main-content {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: opacity 1s ease-out;
        }

        .main-content.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* Progress Indicator */
        .progress-line {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--coral), var(--coral-light));
            z-index: 10001;
            animation: progressBar 4.5s ease-out forwards;
        }

        @keyframes progressBar {
            0% {
                width: 0%;
            }
            100% {
                width: 100%;
            }
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            .coral-line {
                margin-bottom: 2rem;
            }

            .skip-button {
                bottom: 1rem;
                right: 1rem;
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .coral-line {
                margin-bottom: 1.5rem;
            }
        }

        /* Reduced Motion Support */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.5s !important;
                animation-iteration-count: 1 !important;
            }
            
            .skip-button {
                opacity: 1;
                animation: none;
            }
        }
    </style>
</head>
<body>
    <!-- Progress Line -->
    <div class="progress-line"></div>

    <!-- Animation Container -->
    <div class="animation-container" id="animationContainer">
        <!-- Background Effects -->
        <div class="bg-gradient"></div>
        <div class="floating-elements">
            <div class="floating-dot"></div>
            <div class="floating-dot"></div>
            <div class="floating-dot"></div>
            <div class="floating-dot"></div>
        </div>

        <!-- Logo Animation -->
        <div class="logo-animation" id="logoAnimation">
            <div class="coral-line"></div>
            <h1 class="hub-title">The Hub.</h1>
            <p class="hub-tagline">Built for what's next</p>
        </div>

        <!-- Skip Button -->
        <button class="skip-button" onclick="skipAnimation()">
            Skip Introduction →
        </button>
    </div>

    <!-- Main Content (Your Splash Page Content Goes Here) -->
    <div class="main-content" id="mainContent">
        <!-- This will load your main Hub splash page content -->
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;">
            <div>
                <h2 style="font-size: 2.5rem; color: var(--coral); margin-bottom: 2rem;">Welcome to The Hub</h2>
                <p style="font-size: 1.2rem; color: var(--text-muted); margin-bottom: 3rem;">
                    Your central intelligence for strategic marketing and business transformation
                </p>
                
                <!-- Navigation Options -->
                <div style="display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap;">
                    <a href="https://luis-gilberto.com/IMCServices/index.html" style="display: inline-flex; align-items: center; gap: 0.75rem; padding: 1rem 2rem; background: linear-gradient(135deg, var(--coral), var(--coral-light)); color: white; text-decoration: none; border-radius: 12px; font-weight: 600; transition: transform 0.3s ease; box-shadow: 0 10px 30px rgba(255, 107, 107, 0.3);">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>

                    </a>
                    
                    <a href="https://luis-gilberto.com/advisory/index.html" style="display: inline-flex; align-items: center; gap: 0.75rem; padding: 1rem 2rem; background: transparent; color: var(--text-light); text-decoration: none; border: 2px solid rgba(255, 107, 107, 0.3); border-radius: 12px; font-weight: 600; transition: all 0.3s ease; backdrop-filter: blur(10px);">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                        Advisory
                    </a>
                    
                    <a href="https://luis-gilberto.com/IMCServices/scopeiq-wizard/index.html" style="display: inline-flex; align-items: center; gap: 0.75rem; padding: 1rem 2rem; background: transparent; color: var(--text-light); text-decoration: none; border: 2px solid rgba(255, 107, 107, 0.3); border-radius: 12px; font-weight: 600; transition: all 0.3s ease; backdrop-filter: blur(10px);">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M9.5 3A6.5 6.5 0 0 1 16 9.5c0 1.61-.59 3.09-1.56 4.23l.27.27h.79l5 5-1.5 1.5-5-5v-.79l-.27-.27A6.516 6.516 0 0 1 9.5 16 6.5 6.5 0 0 1 3 9.5 6.5 6.5 0 0 1 9.5 3m0 2C7.01 5 5 7.01 5 9.5S7.01 14 9.5 14 14 11.99 14 9.5 11.99 5 9.5 5z"/>
                        </svg>
                        ScopeIQ
                    </a>
                    
                    <a href="https://luis-gilberto.com/strategyiq/index.html" style="display: inline-flex; align-items: center; gap: 0.75rem; padding: 1rem 2rem; background: transparent; color: var(--text-light); text-decoration: none; border: 2px solid rgba(255, 107, 107, 0.3); border-radius: 12px; font-weight: 600; transition: all 0.3s ease; backdrop-filter: blur(10px);">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
                        </svg>
                        StrategyIQ
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Animation Timeline
        function initializeAnimation() {
            const animationContainer = document.getElementById('animationContainer');
            const logoAnimation = document.getElementById('logoAnimation');
            const mainContent = document.getElementById('mainContent');

            // Mark animation as complete after all elements are revealed
            setTimeout(() => {
                logoAnimation.classList.add('complete');
            }, 3000);

            // Auto-transition to main content after full animation
            setTimeout(() => {
                transitionToMain();
            }, 4500);

            // Analytics tracking
            if (typeof gtag !== 'undefined') {
                gtag('event', 'hub_intro_start', {
                    'event_category': 'engagement',
                    'event_label': 'animation_start'
                });
            }
        }

        // Skip Animation Function
        function skipAnimation() {
            if (typeof gtag !== 'undefined') {
                gtag('event', 'hub_intro_skip', {
                    'event_category': 'engagement',
                    'event_label': 'animation_skip'
                });
            }
            transitionToMain();
        }

        // Transition to Main Content
        function transitionToMain() {
            const animationContainer = document.getElementById('animationContainer');
            const mainContent = document.getElementById('mainContent');

            // Fade out animation
            animationContainer.classList.add('fade-out');
            
            // Show main content
            setTimeout(() => {
                mainContent.classList.add('show');
                document.body.style.overflow = 'auto';
                
                // Analytics tracking
                if (typeof gtag !== 'undefined') {
                    gtag('event', 'hub_intro_complete', {
                        'event_category': 'engagement',
                        'event_label': 'animation_complete'
                    });
                }
            }, 500);
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Small delay to ensure smooth animation start
            setTimeout(initializeAnimation, 100);
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // Skip on Space or Enter
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                skipAnimation();
            }
            
            // Skip on Escape
            if (e.code === 'Escape') {
                skipAnimation();
            }
        });

        // Handle hover effects for navigation buttons
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('a[href^="https://luis-gilberto.com"]');
            buttons.forEach(button => {
                button.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-2px)';
                });
                
                button.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0)';
                });
                
                button.addEventListener('click', function() {
                    if (typeof gtag !== 'undefined') {
                        gtag('event', 'hub_navigation', {
                            'event_category': 'navigation',
                            'event_label': this.getAttribute('href')
                        });
                    }
                });
            });
        });

        // Performance monitoring
        if ('PerformanceObserver' in window) {
            const observer = new PerformanceObserver((list) => {
                for (const entry of list.getEntries()) {
                    if (entry.entryType === 'navigation') {
                        console.log('Hub intro load time:', entry.loadEventEnd - entry.loadEventStart, 'ms');
                    }
                }
            });
            observer.observe({entryTypes: ['navigation']});
        }

        // Preload critical resources
        function preloadResources() {
            // Preload any images or assets you'll need for the main content
            const preloadLinks = [
                '../assets/images/hub-logo.png',
                '../assets/images/favicon-32x32.png'
            ];
            
            preloadLinks.forEach(href => {
                const link = document.createElement('link');
                link.rel = 'preload';
                link.as = 'image';
                link.href = href;
                document.head.appendChild(link);
            });
        }

        // Initialize preloading
        preloadResources();
    </script>

    <!-- Google Analytics (replace with your tracking ID) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=GA_TRACKING_ID"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'GA_TRACKING_ID');
    </script>
</body>
</html>
