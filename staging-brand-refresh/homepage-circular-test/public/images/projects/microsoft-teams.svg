<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="teamsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6264a7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5b5fc7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#464775;stop-opacity:1" />
    </linearGradient>
    <filter id="teamsShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#teamsGrad)" rx="20"/>
  
  <!-- Teams Logo Inspired Design -->
  <rect x="150" y="120" width="100" height="80" fill="white" rx="12" filter="url(#teamsShadow)"/>
  <rect x="160" y="130" width="80" height="60" fill="#6264a7" rx="8"/>
  
  <!-- People Icons -->
  <circle cx="180" cy="150" r="12" fill="white"/>
  <circle cx="220" cy="150" r="12" fill="white"/>
  <rect x="168" y="165" width="24" height="20" fill="white" rx="4"/>
  <rect x="208" y="165" width="24" height="20" fill="white" rx="4"/>
  
  <!-- Connection Lines -->
  <line x1="100" y1="160" x2="150" y2="160" stroke="white" stroke-width="3" opacity="0.7"/>
  <line x1="250" y1="160" x2="300" y2="160" stroke="white" stroke-width="3" opacity="0.7"/>
  <circle cx="90" cy="160" r="8" fill="white" opacity="0.8"/>
  <circle cx="310" cy="160" r="8" fill="white" opacity="0.8"/>
  
  <!-- Chat Bubbles -->
  <ellipse cx="160" cy="240" rx="25" ry="15" fill="rgba(255,255,255,0.3)"/>
  <ellipse cx="240" cy="260" rx="30" ry="18" fill="rgba(255,255,255,0.4)"/>
  
  <text x="200" y="330" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">MICROSOFT TEAMS</text>
  <text x="200" y="355" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="14">Collaboration Platform</text>
</svg>