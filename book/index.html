  <style>
    :root {
      --coral: #F96F6E;
      --bg: #0E0C0A;
      --ink: #FAF7F4;
      --ink-soft: rgba(250,247,244,0.6);
      --rule: rgba(250,247,244,0.08);
    }
    [data-theme="light"] {
      --bg: #F5F0EB;
      --ink: #0A0A0A;
      --ink-soft: rgba(10,10,10,0.6);
      --rule: rgba(10,10,10,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    .book-card {
      max-width: 480px;
      width: 100%;
      text-align: center;
      padding: 56px 40px;
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: rgba(255,255,255,0.02);
    }
    [data-theme="light"] .book-card { background: rgba(255,255,255,0.72); }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(32px, 5vw, 44px);
      font-weight: 300;
      line-height: 1.1;
      margin-bottom: 16px;
    }
    p {
      font-size: 16px;
      line-height: 1.65;
      color: var(--ink-soft);
      margin-bottom: 32px;
    }
    .book-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      background: var(--coral);
      color: #050505;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 2px;
      transition: opacity 0.2s;
    }
    .book-btn:hover { opacity: 0.88; }
    .book-note {
      margin-top: 24px;
      font-size: 12px;
      color: var(--ink-soft);
      opacity: 0.7;
    }
  </style>
</head>
<body>
