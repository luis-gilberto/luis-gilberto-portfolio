<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting…</title>
    <meta http-equiv="refresh" content="0; url=/TheHub/">
    <link rel="canonical" href="/TheHub/">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body { display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background:#0b0b0b; color:#fff; }
      a { color:#7fd0ff; }
      .box { text-align:center; padding:24px; }
    </style>
    <script>
      (function() {
        var target = '/TheHub/';
        var q = window.location.search || '';
        var h = window.location.hash || '';
        // Use replace to avoid creating a back button loop
        window.location.replace(target + q + h);
      })();
    </script>
  </head>
  <body>
    <div class="box">
      <h1>Redirecting…</h1>
      <p>If you are not redirected automatically, <a href="/TheHub/">go to The Hub</a>.</p>
    </div>
  </body>
</html>
