<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Work With Luis — Loading…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- SEO & Social Preview -->
    <meta name="description" content="IMC Services Hub — Integrated marketing, creative systems, and growth orchestration.">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.luis-gilberto.com/workwithme">
    <meta property="og:title" content="Entering the Hub — Luis Gilberto">
    <meta property="og:description" content="IMC Services Hub — Integrated marketing, creative systems, and growth orchestration.">
    <meta property="og:image" content="https://www.luis-gilberto.com/TheHub/IMCServices/assets/images/og-workwithme.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Entering the Hub — Luis Gilberto">
    <meta name="twitter:description" content="IMC Services Hub — Integrated marketing, creative systems, and growth orchestration.">
    <meta name="twitter:image" content="https://www.luis-gilberto.com/TheHub/IMCServices/assets/images/og-workwithme.jpg">

    <!-- Hub Loading Animation -->
    <script src="/TheHub/assets/components/hub-animation/hub-loader.min.js"></script>

    <style>
      /* Loading animation styles */
      #main-content { display: none; }
      body { display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background:#0b0b0b; color:#fff; }
      a { color:#7fd0ff; }
      .box { text-align:center; padding:24px; }
    </style>
  </head>
  <body>
    <div id="main-content">
      <div class="box">
        <h1>Work With Luis</h1>
        <p>Redirecting you to The Hub… If this does not happen automatically, <a href="/TheHub/">go to The Hub</a>.</p>
      </div>
    </div>

    <!-- Hub Loading Animation Initialization -->
    <script>
      (function(){
        const referrer = document.referrer;
        const isInternalNavigation = referrer && referrer.includes('luis-gilberto.com');
        const hasInternalNavigationFlag = sessionStorage.getItem('hubNavigated') === 'true';
        const shouldShowAnimation = !isInternalNavigation && !hasInternalNavigationFlag;

        if (shouldShowAnimation) {
          sessionStorage.removeItem('hubNavigated');
          const loader = HubLoader.create({
            videoUrl: '/TheHub/assets/components/hub-animation/coral_laser_line.mp4',
            duration: 12000,
            autoStart: true,
            showProgress: false,
            skipOnClick: true,
            onComplete: function() {
              // After animation finishes, redirect to The Hub
              window.location.replace('/TheHub/');
            }
          });
        } else {
          // Internal navigation - skip animation and redirect immediately
          sessionStorage.setItem('hubNavigated', 'true');
          var target = '/TheHub/';
          var q = window.location.search || '';
          var h = window.location.hash || '';
          window.location.replace(target + q + h);
        }

        // Track internal link clicks in this page as well
        document.addEventListener('click', function(e) {
          const link = e.target.closest('a');
          if (link && link.href && link.href.includes('luis-gilberto.com')) {
            sessionStorage.setItem('hubNavigated', 'true');
          }
        });
      })();
    </script>
  </body>
</html>
