<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paletteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f96f6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8a80;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brushGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0522d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Palette base -->
  <path d="M20 35 C20 25, 30 15, 45 15 C65 15, 80 25, 80 40 C80 50, 75 60, 65 65 C60 67, 55 68, 50 68 C45 68, 42 65, 42 60 C42 55, 45 52, 50 52 C52 52, 54 53, 55 55 C56 57, 55 59, 53 60 C52 61, 50 61, 49 60 C48 59, 48 58, 49 57" 
        fill="url(#paletteGradient)" 
        stroke="#333" 
        stroke-width="2"/>
  
  <!-- Paint dots on palette -->
  <circle cx="35" cy="30" r="4" fill="#ff4444"/>
  <circle cx="50" cy="25" r="4" fill="#44ff44"/>
  <circle cx="65" cy="30" r="4" fill="#4444ff"/>
  <circle cx="30" cy="45" r="4" fill="#ffff44"/>
  <circle cx="60" cy="45" r="4" fill="#ff44ff"/>
  <circle cx="45" cy="40" r="4" fill="#44ffff"/>
  
  <!-- Paintbrush -->
  <path d="M65 60 L75 70 L77 68 L67 58 Z" 
        fill="url(#brushGradient)" 
        stroke="#333" 
        stroke-width="1"/>
  
  <!-- Brush ferrule (metal part) -->
  <rect x="64" y="58" width="8" height="4" 
        fill="#c0c0c0" 
        stroke="#999" 
        stroke-width="0.5"/>
  
  <!-- Brush bristles -->
  <path d="M75 70 L78 73 L80 71 L77 68 Z" 
        fill="#2c2c2c" 
        stroke="#1a1a1a" 
        stroke-width="0.5"/>
  
  <!-- Paint stroke accent -->
  <path d="M25 70 Q35 75, 45 70 Q55 65, 65 70" 
        fill="none" 
        stroke="url(#paletteGradient)" 
        stroke-width="3" 
        stroke-linecap="round" 
        opacity="0.7"/>
</svg>