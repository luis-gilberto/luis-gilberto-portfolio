<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrategyIQ™ Certification Moment | Stage 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #050505;
            --coral: #F96F6E;
            --teal: #2ED3C6;
            --text-ghost: rgba(46, 211, 198, 0.15);
            --text-muted: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            cursor: none;
        }

        .split-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* LEFT COLUMN: GHOST BRIEF */
        .left-col {
            width: 60%;
            height: 100%;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 60px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .ghost-header {
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            color: var(--text-ghost);
            margin-bottom: 40px;
            z-index: 10;
        }

        .ghost-content {
            position: absolute;
            top: 120px;
            left: 60px;
            right: 60px;
            animation: scroll-up 60s linear infinite;
        }

        .ghost-line {
            height: 2px;
            background-color: var(--text-ghost);
            margin-bottom: 20px;
            width: 100%;
        }

        .ghost-line.short { width: 60%; }
        .ghost-line.medium { width: 85%; }

        @keyframes scroll-up {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100%); }
        }

        /* RIGHT COLUMN: ACTION ZONE */
        .right-col {
            width: 40%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
        }

        .signature-area {
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        .signature {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* BUTTON */
        .cert-button {
            padding: 30px 60px;
            background-color: var(--coral);
            color: #000;
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.5s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none;
        }

        .cert-button.visible {
            opacity: 1;
            transform: scale(1);
            display: block;
        }

        .cert-button.clicked {
            transform: scale(0.9);
        }

        /* PULSE / SHOCKWAVE */
        .shockwave {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background-color: transparent;
            border: 2px solid var(--teal);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            z-index: 100;
            opacity: 0;
        }

        .shockwave.active {
            animation: pulse-wave 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) forwards;
        }

        @keyframes pulse-wave {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; border-width: 20px; }
            100% { transform: translate(-50%, -50%) scale(500); opacity: 0; border-width: 1px; }
        }

        /* FINAL STATE */
        .lock-result {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s ease;
        }

        .lock-result.visible {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        .shield-icon {
            font-size: 8rem;
            color: var(--teal);
            filter: drop-shadow(0 0 20px rgba(46, 211, 198, 0.3));
        }

        .lock-text {
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 3rem;
            color: var(--teal);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

    </style>
</head>
<body>

    <div class="shockwave" id="shockwave"></div>

    <div class="split-container">
        <!-- LEFT: GHOST BRIEF -->
        <div class="left-col">
            <div class="ghost-header">GTM ARTIFACT // DRAFT</div>
            <div class="ghost-content" id="ghostContent">
                <!-- Lines generated by JS -->
            </div>
        </div>

        <!-- RIGHT: ACTION ZONE -->
        <div class="right-col">
            <div class="signature-area">
                <div class="signature" id="signature"></div>
            </div>

            <button class="cert-button" id="certBtn">CERTIFY & DEADBOLT</button>

            <div class="lock-result" id="lockResult">
                <i class="fas fa-shield-halved shield-icon"></i>
                <div class="lock-text">LOCKED & CERTIFIED</div>
            </div>
        </div>
    </div>

    <script>
        const signatureText = "CERTIFIED BY: LUIS GILBERTO";
        const sigEl = document.getElementById('signature');
        const certBtn = document.getElementById('certBtn');
        const shockwave = document.getElementById('shockwave');
        const lockResult = document.getElementById('lockResult');
        const ghostContent = document.getElementById('ghostContent');

        // Generate ghost lines
        for (let i = 0; i < 100; i++) {
            const line = document.createElement('div');
            line.className = 'ghost-line ' + (['short', 'medium', 'full'][Math.floor(Math.random() * 3)]);
            ghostContent.appendChild(line);
        }

        async function typeText(text, element) {
            for (let i = 0; i < text.length; i++) {
                element.textContent += text.charAt(i);
                await new Promise(resolve => setTimeout(resolve, 120)); // Slow premium typing
            }
        }

        async function runSequence() {
            // 1. Initial wait
            await new Promise(resolve => setTimeout(resolve, 2000));

            // 2. Typing signature
            await typeText(signatureText, sigEl);

            // 3. Show button
            await new Promise(resolve => setTimeout(resolve, 500));
            certBtn.classList.add('visible');

            // 4. Deadbolt Action (Simulated Click)
            await new Promise(resolve => setTimeout(resolve, 1500));
            certBtn.classList.add('clicked');
            
            await new Promise(resolve => setTimeout(resolve, 200));
            certBtn.classList.remove('clicked');

            // 5. Shockwave
            shockwave.classList.add('active');

            // 6. Transition to Lock
            await new Promise(resolve => setTimeout(resolve, 300));
            certBtn.style.display = 'none';
            sigEl.style.opacity = '0.3';
            
            await new Promise(resolve => setTimeout(resolve, 200));
            lockResult.classList.add('visible');
        }

        window.onload = runSequence;
    </script>
</body>
</html>
