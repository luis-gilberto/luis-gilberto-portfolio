<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Microsoft Copilot Logo -->
  <defs>
    <linearGradient id="copilotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f7931e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffcd3c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="80" height="80" fill="url(#copilotGradient)" rx="16"/>
  
  <!-- AI Brain/Circuit Pattern -->
  <circle cx="40" cy="35" r="18" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
  
  <!-- Neural nodes -->
  <circle cx="40" cy="25" r="3" fill="#ffffff"/>
  <circle cx="30" cy="35" r="3" fill="#ffffff"/>
  <circle cx="50" cy="35" r="3" fill="#ffffff"/>
  <circle cx="35" cy="45" r="3" fill="#ffffff"/>
  <circle cx="45" cy="45" r="3" fill="#ffffff"/>
  
  <!-- Connection lines -->
  <line x1="40" y1="28" x2="33" y2="32" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <line x1="40" y1="28" x2="47" y2="32" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <line x1="33" y1="38" x2="38" y2="42" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <line x1="47" y1="38" x2="42" y2="42" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  
  <!-- Copilot text -->
  <text x="40" y="65" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600">AI</text>
</svg>