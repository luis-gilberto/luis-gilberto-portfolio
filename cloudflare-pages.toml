[build]
command = "mkdir -p _static_deploy && cp -r *.html assets TheHub portal insights legal docs studio _redirects _headers _static_deploy 2>/dev/null || true"
publish = "_static_deploy"

[build.environment]
NODE_VERSION = "20"

[[redirects]]
from = "/nari"
to = "/TheHub/clients/nari/dashboard.html"
status = 200

[[redirects]]
from = "/nari/files/*"
to = "/TheHub/clients/nari/files/:splat"
status = 200

[[redirects]]
from = "/intake/*"
to = "/TheHub/clients/nari/:splat"
status = 301

[[redirects]]
from = "/clients/*"
to = "/TheHub/clients/:splat"
status = 301

[[redirects]]
from = "/thehub"
to = "/TheHub/"
status = 301

[[redirects]]
from = "/thehub/*"
to = "/TheHub/:splat"
status = 301

[[redirects]]
from = "/TheHub"
to = "/TheHub/"
status = 200

[[redirects]]
from = "/TheHub/"
to = "/TheHub/index.html"
status = 200

[[redirects]]
from = "/thanks"
to = "/TheHub/thank-you-qualified.html"
status = 301


