<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Hub · Explorers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">
  <div id="boot">Loading…</div>
  <script>
  (async () => {
    try {
      const res = await fetch('../index.html', { credentials: 'same-origin' });
      let html = await res.text();
      html = html.replace('data-base="../"', 'data-base="../../"');

      // Hero headline & subhead
      html = html.replace('>STRATEGY. OPERATIONALIZED.<', '>The architecture behind how strategy becomes real.<');
      html = html.replace('The strategic framework behind the system.', 'Four capabilities. One integrated system for diagnosing, aligning, building, and managing ideas.');
      // Primary CTA text
      html = html.replace('>See the Flow<', '>See how the system works<');

      // Architecture descriptions
      html = html.replace(
        'A structured diagnosis layer that clarifies the real problem before strategy begins. StrategyIQ surfaces patterns, constraints, and opportunities that teams often overlook.',
        'The intelligence layer that diagnoses complexity.'
      );
      html = html.replace(
        'Strategic guidance that helps organizations translate analysis into clear decisions. Advisory sessions transform insights into priorities, positioning, and direction.',
        'The human layer where strategy becomes alignment.'
      );
      html = html.replace(
        'Execution environments where strategy becomes tangible. Campaigns, digital experiences, brand systems, and creative work are produced with precision and clarity.',
        'The craft layer where ideas become real artifacts.'
      );
      html = html.replace(
        'The environment where the framework operates. The Portal connects diagnosis, alignment, and execution into a continuous workflow where decisions translate directly into progress.',
        'The orchestration layer where the system runs.'
      );

      // Process title
      html = html.replace('The System,', 'How the');
      html = html.replace('Explained.', 'system works');

      // Final CTA
      html = html.replace('The Portal is where it becomes real.', 'Take a guided tour of the ecosystem.');
      html = html.replace('>Explore The Portal <', '>Explore the system <');

      // Footer tagline add (neutral)
      html = html.replace('Making technology feel human through clarity, beautiful execution, and systems that scale.', 'Making technology feel human through clarity, beautiful execution, and systems that scale.\n            <br>A laboratory for ideas about strategy, technology, and craft.');

      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      document.getElementById('boot').textContent = 'Failed to load page.';
      console.error(e);
    }
  })();
  </script>
</body>
</html>
