<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Hub · Hiring Managers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">
  <div id="boot">Loading…</div>
  <script>
  (async () => {
    try {
      const res = await fetch('../index.html', { credentials: 'same-origin' });
      let html = await res.text();
      html = html.replace('data-base="../"', 'data-base="../../"');

      // Hero headline
      html = html.replace('>STRATEGY. OPERATIONALIZED.<', '>A strategic operating system for modern marketing<');
      // Hero subhead
      html = html.replace('The strategic framework behind the system.', 'StrategyIQ, advisory frameworks, and execution models developed from fifteen years of building integrated campaigns at Microsoft.');
      // Primary CTA text
      html = html.replace('>See the Flow<', '>Explore the system<');

      // Architecture descriptions
      html = html.replace(
        'A structured diagnosis layer that clarifies the real problem before strategy begins. StrategyIQ surfaces patterns, constraints, and opportunities that teams often overlook.',
        'Strategic diagnostic framework designed to benchmark marketing maturity and identify growth constraints.'
      );
      html = html.replace(
        'Strategic guidance that helps organizations translate analysis into clear decisions. Advisory sessions transform insights into priorities, positioning, and direction.',
        'Executive-level strategic guidance for leadership teams navigating ambiguity and transformation.'
      );
      html = html.replace(
        'Execution environments where strategy becomes tangible. Campaigns, digital experiences, brand systems, and creative work are produced with precision and clarity.',
        'Creative direction and production systems that translate strategy into market-ready experiences.'
      );
      html = html.replace(
        'The environment where the framework operates. The Portal connects diagnosis, alignment, and execution into a continuous workflow where decisions translate directly into progress.',
        'A command environment that connects decisions, execution, and collaboration in one place.'
      );

      // Process title swap (section header)
      html = html.replace('The System,', 'How I structure');
      html = html.replace('Explained.', 'complex marketing programs');

      // Final CTA
      html = html.replace('The Portal is where it becomes real.', 'Explore the operating system behind my work.');
      html = html.replace('>Explore The Portal <', '>View the architecture <');

      // Footer tagline add
      html = html.replace('Making technology feel human through clarity, beautiful execution, and systems that scale.', 'Making technology feel human through clarity, beautiful execution, and systems that scale.\n            <br>A strategist who builds systems, not just campaigns.');

      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      document.getElementById('boot').textContent = 'Failed to load page.';
      console.error(e);
    }
  })();
  </script>
</body>
</html>
