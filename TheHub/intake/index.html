<!DOCTYPE html> 
<html lang="en" data-theme="dark"> 
<head> 
  <meta charset="UTF-8" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
  <title>The Hub Intake — Luis Gilberto</title> 
 
  <link rel="preconnect" href="https://fonts.googleapis.com" /> 
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> 
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" /> 
 
  <style> 
    :root { 
      --coral:        #F96F6E; 
      --teal:         #4BADA8; 
      --obsidian:     #0E0C0A; 
      --obsidian-2:   #141210; 
      --obsidian-3:   #1A1816; 
      --cloud:        #F5F0EB; 
      --text-primary: #F0EBE5; 
      --text-muted:   rgba(240,235,229,0.55); 
      --border:       rgba(240,235,229,0.08); 
      --font-display: 'Big Shoulders Display', sans-serif; 
      --font-serif:   'Cormorant Garamond', Georgia, serif; 
      --font-ui:      'Inter', sans-serif; 
    } 
 
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; } 
    html, body { height: 100%; overflow: hidden; } 
 
    body { 
      background: var(--obsidian); 
      color: var(--text-primary); 
      font-family: var(--font-ui); 
      -webkit-font-smoothing: antialiased; 
    } 
 
    /* ── TOP BAR ── */ 
    .intake-topbar { 
      position: fixed; 
      top: 0; 
      left: 0; 
      right: 0; 
      height: 52px; 
      background: var(--obsidian-2); 
      border-bottom: 1px solid var(--border); 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 0 28px; 
      z-index: 100; 
    } 
 
    .intake-topbar-left { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
    } 
 
    .intake-topbar-eyebrow { 
      font-family: var(--font-ui); 
      font-size: 10px; 
      font-weight: 700; 
      letter-spacing: 0.18em; 
      text-transform: uppercase; 
      color: var(--teal); 
    } 
 
    .intake-topbar-sep { 
      width: 1px; 
      height: 14px; 
      background: var(--border); 
    } 
 
    .intake-topbar-title { 
      font-family: var(--font-ui); 
      font-size: 11px; 
      font-weight: 500; 
      letter-spacing: 0.06em; 
      color: var(--text-muted); 
      text-transform: uppercase; 
    } 
 
    .intake-topbar-back { 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
      font-family: var(--font-ui); 
      font-size: 11px; 
      font-weight: 400; 
      color: var(--text-muted); 
      text-decoration: none; 
      letter-spacing: 0.04em; 
      transition: color 0.2s; 
    } 
 
    .intake-topbar-back:hover { color: var(--text-primary); } 
 
    /* ── FORM CONTAINER ── */ 
    .intake-embed-wrap { 
      position: fixed; 
      top: 52px; 
      left: 0; 
      right: 0; 
      bottom: 0; 
    } 
 
    .intake-embed-wrap > div { 
      width: 100% !important; 
      height: 100% !important; 
    } 
  </style> 
</head> 
<body> 
 
  <!-- Top bar — branding + back link --> 
  <div class="intake-topbar"> 
    <div class="intake-topbar-left"> 
      <span class="intake-topbar-eyebrow">The Hub</span> 
      <div class="intake-topbar-sep"></div> 
      <span class="intake-topbar-title">Strategy Intake</span> 
    </div> 
    <a href="/TheHub/" class="intake-topbar-back"> 
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"> 
        <path d="M13 8H3M3 8L7 4M3 8L7 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> 
      </svg> 
      Back to The Hub 
    </a> 
  </div> 
 
  <!-- Zite form fullscreen embed --> 
  <div class="intake-embed-wrap"> 
    <div style="position:fixed;top:52px;left:0px;right:0px;bottom:0px;"> 
      <div data-zite-id="xwludkptld" data-zite-embed-type="fullscreen" style="width:100%;height:100%;" data-zite-inherit-parameters></div> 
      <script src="https://server.fillout.com/embed/v2-zite/"></script> 
    </div> 
  </div> 
 
</body> 
</html>
