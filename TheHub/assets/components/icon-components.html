                     aria-hidden="true"
                     width="110"
                     height="110">
            </div>
            
            <!-- Advisory - Left -->
            <div class="shape-satellite shape-compass coral">
                <img src="/TheHub/assets/icons/arms/advisory/compass_rose_coral.png" 
                     alt=""
                     aria-hidden="true"
                     width="90"
                     height="90">
            </div>
            
            <!-- Studio - Right -->
            <div class="shape-satellite shape-atom teal">
                <img src="/TheHub/assets/icons/arms/studio/atom_model_teal.png" 
                     alt=""
                     aria-hidden="true"
                     width="100"
                     height="100">
            </div>
            
            <!-- Portal - Bottom -->
            <div class="shape-satellite shape-queen teal">
                <img src="/TheHub/assets/icons/arms/portal/chess_queen_teal.png" 
                     alt=""
                     aria-hidden="true"
                     width="85"
                     height="85">
            </div>
        </div>
    </div>
</div>
