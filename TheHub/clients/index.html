<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Hub · Clients</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">
  <div id="boot">Loading…</div>
  <script>
  (async () => {
    try {
      const res = await fetch('../index.html', { credentials: 'same-origin' });
      let html = await res.text();
      html = html.replace('data-base="../"', 'data-base="../../"');

      // Hero headline & subhead
      html = html.replace('>STRATEGY. OPERATIONALIZED.<', '>Stop guessing. Start building with a system.<');
      html = html.replace('The strategic framework behind the system.', 'StrategyIQ diagnoses the real problem. Advisory aligns leadership. Studio executes the solution.');
      // Primary CTA to assessment
      html = html.replace('href="#how-it-works"', 'href="#the-strategic-architecture"');
      html = html.replace('href="#pillars"', 'href="#the-system-explained"');
      html = html.replace('>See the Flow<', '>Start your strategy assessment<');
      // Audience badge: replace eyebrow text with Luxe Pill (Partnering)
      html = html.replace('THE FRAMEWORK', '<div class="audience-badge badge-partner"><span class="badge-dot"></span>PARTNERING</div>');
      html = html.replace('The Framework', '<div class="audience-badge badge-partner"><span class="badge-dot"></span>PARTNERING</div>');

      // Architecture descriptions
      html = html.replace(
        'A structured diagnosis layer that clarifies the real problem before strategy begins. StrategyIQ surfaces patterns, constraints, and opportunities that teams often overlook.',
        'Find the real problem before investing in tactics.'
      );
      html = html.replace(
        'Strategic guidance that helps organizations translate analysis into clear decisions. Advisory sessions transform insights into priorities, positioning, and direction.',
        'Align leadership around a clear strategy and roadmap.'
      );
      html = html.replace(
        'Execution environments where strategy becomes tangible. Campaigns, digital experiences, brand systems, and creative work are produced with precision and clarity.',
        'Execute the work without losing the strategy.'
      );
      html = html.replace(
        'The environment where the framework operates. The Portal connects diagnosis, alignment, and execution into a continuous workflow where decisions translate directly into progress.',
        'Track progress and decisions in one shared environment.'
      );

      // Process title
      html = html.replace('The System,', 'How we solve');
      html = html.replace('Explained.', 'strategic business problems');

      // Final CTA
      html = html.replace('The Portal is where it becomes real.', 'Start with a StrategyIQ assessment.');
      html = html.replace('>Explore The Portal <', '>Begin the assessment <');

      // Footer tagline add
      html = html.replace('Making technology feel human through clarity, beautiful execution, and systems that scale.', 'Making technology feel human through clarity, beautiful execution, and systems that scale.\n            <br>A partner for leaders who want clarity and momentum.');

      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      document.getElementById('boot').textContent = 'Failed to load page.';
      console.error(e);
    }
  })();
  </script>
</body>
</html>
