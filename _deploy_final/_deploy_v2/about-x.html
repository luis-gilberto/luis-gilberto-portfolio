<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Preview – Craftsman Image Swap</title>
  <style>
    html, body { height: 100%; margin: 0; }
    .frame { width: 100%; height: 100%; border: 0; }
    .banner { position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); color: #fff; font: 14px/1.4 system-ui, sans-serif; padding: 8px 12px; z-index: 9999; }
    .banner strong { color: #FF6B6B; }
    .spacer { height: 36px; }
  </style>
  <script>
    const NEW_SRC = 'assets/images/fullcolor.jpg';
    function swapImage() {
      const iframe = document.getElementById('page');
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      if (!doc) return;
      const craftsmanSection = doc.querySelector('.lens.lens-2');
      const portraitImg = craftsmanSection && craftsmanSection.querySelector('.portrait-image');
      const picture = portraitImg && portraitImg.closest('picture');
      if (portraitImg) { portraitImg.src = NEW_SRC; }
      const srcEl = picture && picture.querySelector('source');
      if (srcEl) { srcEl.srcset = NEW_SRC; srcEl.type = 'image/jpeg'; }
    }
    function onLoad() { swapImage(); }
  </script>
</head>
<body>
  <div class="banner">Preview mode: replacing <strong>The Craftsman</strong> portrait with <code>assets/images/fullcolor.jpg</code>. No permanent changes are made.</div>
  <div class="spacer"></div>
  <iframe id="page" class="frame" src="about.html" onload="onLoad()" title="About Preview"></iframe>
</body>
</html>
