<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Link Tests</title>
  <style>
    body { font-family: Inter, sans-serif; background:#0a0a0a; color:#fff; padding:20px; }
    .result { padding:8px 12px; border-radius:6px; margin:6px 0; }
    .pass { background: rgba(46,211,198,0.12); border:1px solid rgba(46,211,198,0.4); }
    .fail { background: rgba(249,111,110,0.12); border:1px solid rgba(249,111,110,0.4); }
    iframe { width: 100%; height: 120px; border:1px solid #333; border-radius:6px; margin:12px 0; }
    .summary { margin-top:16px; padding:10px; border-top:1px solid #333; }
  </style>
</head>
<body>
  <h1>About Link Tests</h1>
  <p>Verifies that all About/About Me links navigate to the canonical URL.</p>
  <div id="results"></div>
  <div class="summary" id="summary"></div>

  <script>
    const CANON = 'http://127.0.0.1:5500/about.html';
    const pages = [
      '/index.html',
      '/_deploy_v2/index.html',
      '/_deploy_v2/timeline.html?v=20260220',
      '/myexperience.html',
      '/_deploy_v2/about.html',
      '/about.html',
      '/_deploy_v2/brand.html',
      '/_deploy_v2/journey-preview.html'
    ];

    const resultsEl = document.getElementById('results');
    let passCount = 0, failCount = 0;

    function report(ok, msg) {
      const div = document.createElement('div');
      div.className = 'result ' + (ok ? 'pass' : 'fail');
      div.textContent = (ok ? 'PASS: ' : 'FAIL: ') + msg;
      resultsEl.appendChild(div);
      ok ? passCount++ : failCount++;
    }

    async function testPage(url) {
      return new Promise(resolve => {
        const iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.onload = () => {
          try {
            const doc = iframe.contentDocument;
            const links = Array.from(doc.querySelectorAll('a'));
            const aboutLinks = links.filter(a => {
              const txt = (a.textContent || '').trim().toLowerCase();
              const href = a.getAttribute('href') || '';
              return txt.includes('about') || /\/about(\/|index\.html|\.html|$)/i.test(href);
            });
            if (aboutLinks.length === 0) {
              report(true, url + ' — no About links present (ok if not required)');
            } else {
              aboutLinks.forEach(a => {
                const href = a.getAttribute('href');
                report(href === CANON, url + ' — href is ' + href);
              });
            }
          } catch (e) {
            report(false, url + ' — cross-origin or load error: ' + e.message);
          }
          resolve();
        };
        document.body.appendChild(iframe);
      });
    }

    (async function run(){
      for (const p of pages) {
        await testPage(p);
      }
      document.getElementById('summary').textContent = `Completed. Pass: ${passCount}, Fail: ${failCount}`;
    })();
  </script>
</body>
</html>
