        {

            {

                'Professional & authoritative',

            {

            {

            {

              type: 'multi',

            {

              type: 'text',
              placeholder: 'E.g., subscription management, quiz/product finder, ingredient database, event calendar, etc.'
            }
          ]
        },
        {
          id: 'experience',
          title: 'User Experience Preferences',
          subtitle: 'Tell us what you like (and don\'t like)',
          icon: 'fa-palette',
          questions: [
            {
              id: 'design_style',
              question: 'What design style appeals to you?',
              type: 'multi',
              options: [
                'Minimalist & clean',
                'Bold & colorful',
                'Dark & moody',
                'Bright & energetic',
                'Elegant & sophisticated',
                'Playful & fun',
                'Modern & sleek',
                'Natural & organic'
              ]
            },
            {
              id: 'visual_priority',
              question: 'What should the design prioritize?',
              type: 'single',
              options: [
                'Trust & credibility (professional, polished)',
                'Excitement & energy (bold, dynamic)',

            {

            },
            {
              id: 'avoid_sites',
              question: 'Any websites or design elements you want to AVOID?',

              placeholder: 'Examples of what NOT to do, or elements you dislike'
            },
            {
              id: 'mobile_priority',
              question: 'How important is mobile experience?',
              type: 'single',
              options: [
                'Critical - majority of our traffic is mobile',
                'Very important - 50/50 mobile and desktop',
                'Important - mostly desktop but mobile matters',
                'Less critical - primarily desktop users'
              ]

          ]
        },
        {
          id: 'marketing',
          title: 'Marketing & Launch',
          subtitle: 'Help us understand your go-to-market strategy',
          icon: 'fa-bullhorn',
          questions: [
            {
              id: 'marketing_channels',
              question: 'Which marketing channels will you use? (Select all that apply)',
              type: 'multi',
              options: [
                'Instagram',
                'TikTok',
                'Facebook',
                'Email marketing',
                'Paid ads (Google/Meta)',
                'Influencer partnerships',
                'Content marketing/SEO',
                'Events/in-person',
                'PR/media outreach',
                'Affiliate/referral programs'
              ]
            },
            {
              id: 'launch_timeline',
              question: 'When do you need the website live?',
              type: 'single',
              options: [
                'ASAP (within 2 weeks)',
                'Within 1 month',
                '1-2 months',
                '2-3 months',
                '3+ months',
                'Flexible / no hard deadline'
              ]
            },
            {
              id: 'post_launch_support',
              question: 'What kind of post-launch support do you need?',
              type: 'multi',
              options: [
                'Content updates (new products, copy)',
                'Ongoing design tweaks',
                'SEO optimization',
                'Analytics & conversion tracking',
                'A/B testing',
                'Email/SMS marketing setup',
                'Social media integration',
                'Training on how to manage the site',
                'None - we\'ll handle it ourselves'
              ]
            },
            {
              id: 'success_metrics',
              question: 'How will you measure success? (Select your top priorities)',
              type: 'multi',

                'Revenue/sales',
                'Conversion rate',
                'Average order value',
                'Email signups',
                'Traffic volume',
                'Time on site / engagement',
                'Social media followers',
                'Customer lifetime value',
                'Brand awareness'
              ]
            },
            {
              id: 'marketing_elaborate',
              question: 'Anything else about your marketing plans or launch strategy?',
              type: 'text',
              placeholder: 'Upcoming campaigns, partnerships, events, PR opportunities...'
            }
          ]
        },
        {
          id: 'logistics',
          title: 'Logistics & Operations',
          subtitle: 'The practical stuff we need to know',
          icon: 'fa-cog',
          questions: [
            {
              id: 'ecommerce_platform',
              question: 'Which e-commerce platform are you using (or planning to use)?',
              type: 'single',
              options: [
                'Shopify',
                'WooCommerce (WordPress)',
                'BigCommerce',
                'Wix',
                'Squarespace',
                'Custom solution',
                'Not sure yet / need recommendation'
              ]
            },
            {
              id: 'integrations_needed',
              question: 'What integrations do you need? (Select all that apply)',
              type: 'multi',
              options: [
                'Email marketing (Klaviyo, Mailchimp, etc.)',
                'CRM (HubSpot, Salesforce, etc.)',
                'Analytics (Google Analytics, etc.)',
                'Social media',
                'Shipping/fulfillment',
                'Subscription management',
                'Customer reviews platform',
                'Live chat support',
                'Inventory management',
                'Loyalty/rewards program'
              ]
            },
            {
              id: 'team_involvement',
              question: 'Who from your team will be involved in the website project?',
              type: 'multi',
              options: [
                'Founder/CEO',
                'Marketing lead',
                'Designer',
                'Developer',
                'Copywriter',
                'Product manager',
                'Just me',
                'External consultant/agency'
              ]
            },
            {
              id: 'decision_process',
              question: 'How do you prefer to make decisions?',
              type: 'single',
              options: [
                'Quick & iterative (move fast, adjust as we go)',
                'Collaborative (involve team, discuss options)',
                'Data-driven (test & validate before committing)',
                'Trust the experts (show me recommendations, I\'ll approve)'
              ]
            },
            {
              id: 'logistics_elaborate',
              question: 'Any other logistics or constraints we should know about?',
              type: 'text',
              placeholder: 'Budget constraints, technical limitations, legal requirements, accessibility needs...'
            }
          ]
        }
      ];

      const handleResponse = (questionId, value, isMulti = false) => {
        if (isMulti) {
          const currentValues = responses[questionId] || [];
          const newValues = currentValues.includes(value)
            ? currentValues.filter(v => v !== value)
            : [...currentValues, value];
          setResponses({ ...responses, [questionId]: newValues });
        } else {
          setResponses({ ...responses, [questionId]: value });
        }
      };

      const currentSectionData = sections[currentSection];
      const progress = ((currentSection + 1) / sections.length) * 100;
      const isLastSection = currentSection === sections.length - 1;

      const goToNextSection = async () => {
        if (isLastSection) {
          await submitToFormspree();
          setShowSummary(true);
        } else {
          setCurrentSection(currentSection + 1);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      const goToPrevSection = () => {
        if (currentSection > 0) {
          setCurrentSection(currentSection - 1);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };

      const submitToFormspree = async () => {
        setIsSubmitting(true);
        try {
          const formData = new FormData();
          Object.keys(responses).forEach(key => {
            const value = responses[key];
            if (Array.isArray(value)) {
              formData.append(key, value.join(', '));
            } else {
              formData.append(key, value || 'Not answered');
            }
          });
          formData.append('submission_date', new Date().toISOString());
          formData.append('form_name', 'Festival Recovery Brand Discovery');
          const response = await fetch('https://formspree.io/f/mjkdzkad', {
            method: 'POST',
            body: formData,
            headers: {
              Accept: 'application/json'
            }
          });
          if (response.ok) {
            alert("✅ Responses submitted successfully! We'll be in touch soon.");
            return true;
          } else {
            throw new Error('Submission failed');
          }
        } catch (error) {
          console.error('Error submitting to Formspree:', error);
          alert('⚠️ There was an error submitting. Please download your responses and email them to us.');
          return false;
        } finally {
          setIsSubmitting(false);
        }
      };

      const downloadResponses = () => {
        const dataStr = JSON.stringify(responses, null, 2);
        const dataBlob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(dataBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `festival-recovery-brand-discovery-${new Date().toISOString().split('T')[0]}.json`;
        link.click();
      };

      if (showSummary) {
        return (
          <div className="max-w-4xl mx-auto px-4 py-12">
            <div className="section-card bg-white p-8 mb-8">
              <div className="text-center mb-8">
                <div className="w-20 h-20 gradient-bg rounded-full flex items-center justify-center mx-auto mb-4">
                  <i className="fa-solid fa-check text-white text-3xl"></i>
                </div>
                <h1 className="text-4xl font-bold mb-4">
                  <span className="gradient-text">Thank You!</span>
                </h1>
                <p className="text-xl text-gray-600">

                </p>
              </div>

              <div className="bg-gradient-to-r from-blue-50 to-orange-50 rounded-lg p-6 mb-6">
                <h2 className="text-2xl font-bold mb-4">What Happens Next?</h2>
                <div className="space-y-4">
                  <div className="flex items-start gap-3">
                    <div className="w-8 h-8 gradient-bg rounded-full flex items-center justify-center flex-shrink-0">
                      <span className="text-white font-bold">1</span>
                    </div>
                    <div>
                      <h3 className="font-semibold mb-1">✅ Responses Submitted Successfully</h3>
                      <p className="text-gray-600 text-sm">Your responses have been sent to our team. We'll review them and get back to you within 1-2 business days.</p>
                    </div>
                  </div>
                  <div className="flex items-start gap-3">
                    <div className="w-8 h-8 gradient-bg rounded-full flex items-center justify-center flex-shrink-0">
                      <span className="text-white font-bold">2</span>
                    </div>
                    <div>
                      <h3 className="font-semibold mb-1">Creative Brief Development</h3>
                      <p className="text-gray-600 text-sm">We'll create a comprehensive creative brief tailored to your needs (typically within 3-5 business days).</p>
                    </div>
                  </div>
                  <div className="flex items-start gap-3">
                    <div className="w-8 h-8 gradient-bg rounded-full flex items-center justify-center flex-shrink-0">
                      <span className="text-white font-bold">3</span>
                    </div>
                    <div>
                      <h3 className="font-semibold mb-1">Kickoff Call</h3>
                      <p className="text-gray-600 text-sm">We'll schedule a call to discuss the brief, answer questions, and align on the project direction.</p>
                    </div>
                  </div>
                </div>
              </div>

              <div className="flex flex-col sm:flex-row gap-4 justify-center">
                <button
                  onClick={downloadResponses}
                  className="btn-secondary px-8 py-3 rounded-lg font-semibold uppercase tracking-wide flex items-center justify-center gap-2"
                >
                  <i className="fa-solid fa-download"></i>
                  Download Copy
                </button>
                <button
                  onClick={submitToFormspree}
                  disabled={isSubmitting}
                  className={`btn-primary text-white px-8 py-3 rounded-lg font-semibold uppercase tracking-wide flex items-center justify-center gap-2 ${isSubmitting ? 'opacity-50 cursor-not-allowed' : ''}`}
                >
                  <i className={`fa-solid ${isSubmitting ? 'fa-spinner fa-spin' : 'fa-paper-plane'}`}></i>
                  {isSubmitting ? 'Sending...' : 'Resend to Email'}
                </button>
                <a
                  href="index.html"
                  className="btn-secondary px-8 py-3 rounded-lg font-semibold uppercase tracking-wide flex items-center justify-center gap-2"
                >
                  <i className="fa-solid fa-home"></i>
                  Back to Homepage
                </a>
              </div>
            </div>

            <div className="text-center text-gray-500 text-sm">
              <p>Questions? Email us at <a href="mailto:hello@luis-gilberto.com" className="text-orange-500 hover:underline">hello@luis-gilberto.com</a></p>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-4xl mx-auto px-4 py-8">
          {/* Progress Bar */}
          <div className="mb-8">
            <div className="flex justify-between items-center mb-2">
              <span className="text-sm font-semibold text-gray-600">
                Section {currentSection + 1} of {sections.length}
              </span>
              <span className="text-sm font-semibold gradient-text">
                {Math.round(progress)}% Complete
              </span>
            </div>
            <div className="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
              <div
                className="progress-bar h-full transition-all duration-500"
                style={{ width: `${progress}%` }}
              ></div>
            </div>
          </div>

          {/* Section Header */}
          <div className="section-card bg-white p-8 mb-8">
            <div className="flex items-center gap-4 mb-4">
              <div className="w-16 h-16 gradient-bg rounded-lg flex items-center justify-center flex-shrink-0">
                <i className={`fa-solid ${currentSectionData.icon} text-white text-2xl`}></i>
              </div>
              <div>
                <h1 className="text-3xl font-bold gradient-text">{currentSectionData.title}</h1>
                <p className="text-gray-600 mt-1">{currentSectionData.subtitle}</p>
              </div>
            </div>
          </div>

          {/* Questions */}
          <div className="space-y-6 mb-8">
            {currentSectionData.questions.map((question, qIndex) => (
              <div key={question.id} className="section-card bg-white p-6">
                <div className="mb-4">
                  <span className="inline-block w-8 h-8 gradient-bg rounded-full text-white font-bold flex items-center justify-center mb-3">
                    {qIndex + 1}
                  </span>
                  <h3 className="text-lg font-semibold text-gray-800 mb-2">
                    {question.question}
                  </h3>
                </div>

                {question.type === 'single' && (
                  <div className="space-y-2">
                    {question.options.map((option, index) => (
                      <label
                        key={index}
                        className="flex items-center p-4 border-2 rounded-lg cursor-pointer transition hover:border-orange-300"
                      >
                        <input
                          type="radio"
                          name={question.id}
                          value={option}
                          checked={responses[question.id] === option}
                          onChange={(e) => handleResponse(question.id, e.target.value)}
                          className="sr-only"
                        />
                        <div className="flex items-center gap-3 w-full">
                          <div className="w-5 h-5 rounded-full border-2 border-gray-300 flex items-center justify-center flex-shrink-0">
                            {responses[question.id] === option && (
                              <div className="w-3 h-3 rounded-full gradient-bg"></div>
                            )}
                          </div>
                          <span className="text-gray-700">{option}</span>
                        </div>
                      </label>
                    ))}
                  </div>
                )}

                {question.type === 'multi' && (
                  <div className="space-y-2">
                    {question.options.map((option, index) => (
                      <label
                        key={index}
                        className="flex items-center p-4 border-2 rounded-lg cursor-pointer transition hover:border-orange-300"
                      >
                        <input
                          type="checkbox"
                          value={option}
                          checked={(responses[question.id] || []).includes(option)}
                          onChange={() => handleResponse(question.id, option, true)}
                          className="sr-only"
                        />
                        <div className="flex items-center gap-3 w-full">
                          <div className="w-5 h-5 rounded border-2 border-gray-300 flex items-center justify-center flex-shrink-0">
                            {(responses[question.id] || []).includes(option) && (
                              <i className="fa-solid fa-check text-white text-xs" style={{
                                background: 'linear-gradient(135deg, #1B1464 0%, #FF8200 100%)',
                                padding: '2px',
                                borderRadius: '2px'
                              }}></i>
                            )}
                          </div>
                          <span className="text-gray-700">{option}</span>
                        </div>
                      </label>
                    ))}
                  </div>
                )}

                {question.type === 'text' && (
                  <textarea
                    value={responses[question.id] || ''}
                    onChange={(e) => handleResponse(question.id, e.target.value)}
                    placeholder={question.placeholder}
                    rows="4"
                    className="w-full p-4 border-2 border-gray-200 rounded-lg focus:border-orange-500 focus:ring-2 focus:ring-orange-200 transition resize-none"
                  />
                )}
              </div>
            ))}
          </div>

          {/* Navigation */}
          <div className="flex gap-4 justify-between">
            <button
              onClick={goToPrevSection}
              disabled={currentSection === 0}
              className={`px-6 py-3 rounded-lg font-semibold uppercase tracking-wide flex items-center gap-2 transition ${
                currentSection === 0
                  ? 'bg-gray-200 text-gray-400 cursor-not-allowed'
                  : 'btn-secondary'
              }`}
            >
              <i className="fa-solid fa-arrow-left"></i>
              Previous
            </button>
            <button
              onClick={goToNextSection}
              className="btn-primary text-white px-6 py-3 rounded-lg font-semibold uppercase tracking-wide flex items-center gap-2"
            >
              {isLastSection ? 'Complete' : 'Next Section'}
              <i className={`fa-solid ${isLastSection ? 'fa-check' : 'fa-arrow-right'}`}></i>
            </button>
          </div>

          {/* Helper Text */}
          <div className="mt-6 text-center text-gray-500 text-sm">
            <p>Your responses are saved automatically. You can leave and come back anytime.</p>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BrandDiscoveryQuestionnaire />);
  </script>
</body>
</html>
