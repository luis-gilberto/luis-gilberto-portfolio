<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           ECOSYSTEM VARIABLES
           ========================================== */
        :root {
            --coral: #F96F6E;
            --teal: #2ED3C6;
            
            /* Light Mode Palette */
            --bg-primary: #FFFFFF;
            --bg-alt: #F4F5F7; 
            --text-primary: #111111;
            --text-secondary: #555555;
            --text-muted: rgba(0, 0, 0, 0.5);
            --border-subtle: rgba(0, 0, 0, 0.06);
            --border-strong: rgba(0, 0, 0, 0.12);
            --thread-line: rgba(0, 0, 0, 0.06);
            
            /* Fonts */
            --font-sans: 'Inter', sans-serif;
            --font-display: 'Big Shoulders Display', sans-serif;
            
            /* UI */
            --card-bg: #FFFFFF;
            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 12px 30px rgba(0, 0, 0, 0.08);
        }

        /* Dark Mode Palette */
        [data-theme="dark"] {
            --bg-primary: #0E0E0F;
            --bg-alt: #161617;
            --text-primary: #F5F5F5;
            --text-secondary: #A0A0A0;
            --text-muted: rgba(255, 255, 255, 0.4);
            --border-subtle: rgba(255, 255, 255, 0.05);
            --border-strong: rgba(255, 255, 255, 0.15);
            --thread-line: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(255, 255, 255, 0.03);
            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            background-image: radial-gradient(var(--border-subtle) 1px, transparent 1px);
            background-size: 24px 24px;
            line-height: 1.6;
            padding-top: 112px; 
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        @media (max-width: 768px) {
            body {
                padding-top: 64px;
                background-size: 16px 16px;
            }
        }

        /* ========================================
           NAVIGATION
           ======================================== */
        .primary-nav {
            position: fixed; top: 0; left: 0; width: 100%; height: 64px;
            background: rgba(26, 26, 26, 0.98); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10000;
        }
        .primary-nav-container {
            max-width: 1400px; margin: 0 auto; padding: 0 2rem;
            height: 64px; display: flex; align-items: center; justify-content: space-between;
        }
        .nav-logo img { height: 55px; width: auto; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-link {
            color: rgba(255, 255, 255, 0.7); text-decoration: none;
            font-size: 13px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.08em; position: relative; transition: color 0.2s ease;
        }
        .nav-link:hover, .nav-link.active { color: #ffffff; }
        
        /* Sub Nav */
        .portfolio-subnav {
            position: fixed; top: 64px; left: 0; width: 100%;
            background: var(--bg-primary); border-bottom: 1px solid var(--border-subtle);
            z-index: 9999; transition: background 0.3s ease;
        }
        .portfolio-subnav-container {
            max-width: 1400px; margin: 0 auto; padding: 0 2rem;
            height: 48px; display: flex; align-items: center; gap: 2rem;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-overflow-scrolling: touch;
        }
        .portfolio-subnav-container::-webkit-scrollbar { display: none; }
        
        .subnav-link {
            color: var(--text-secondary); text-decoration: none;
            font-size: 14px; font-weight: 500; transition: color 0.2s ease;
            padding: 0.5rem 0; white-space: nowrap;
        }
        .subnav-link:hover { color: var(--coral); }
        .subnav-link.active { color: var(--text-primary); font-weight: 700; }

        /* Theme Toggle */
        .theme-toggle {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%; width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; margin-left: 1.5rem; color: #ffffff; transition: all 0.3s ease;
        }
        .sun-icon { display: none; }
        [data-theme="dark"] .sun-icon { display: block; }
        [data-theme="dark"] .moon-icon { display: none; }

        /* Mobile Menu */
        .mobile-menu-toggle { 
            display: none; flex-direction: column; gap: 5px; 
            background: none; border: none; padding: 8px; 
            cursor: pointer; z-index: 10001;
        }
        .mobile-menu-toggle span { 
            width: 24px; height: 2px; background: #ffffff;
            display: block; transition: all 0.3s ease;
        }
        
        .mobile-menu-overlay {
            position: fixed; inset: 0; background: var(--bg-primary);
            z-index: 9998; transform: translateX(100%); transition: transform 0.3s ease;
            padding: 8rem 2rem; display: flex; flex-direction: column; gap: 2rem; overflow-y: auto;
        }
        .mobile-menu-overlay.active { transform: translateX(0); }
        
        .mobile-link-group { display: flex; flex-direction: column; gap: 1rem; }
        .mobile-label { 
            font-size: 0.7rem; text-transform: uppercase; color: var(--text-secondary); 
            letter-spacing: 0.1em; margin-bottom: 0.5rem; font-weight: 700;
        }
        .mobile-link { 
            font-size: 1.5rem; font-family: var(--font-display); color: var(--text-primary); 
            text-decoration: none; font-weight: 700; transition: color 0.2s ease, transform 0.2s ease;
            padding: 0.5rem 0;
        }
        .mobile-link:hover, .mobile-link.active { color: var(--coral); }
        .mobile-link.sub {
            font-size: 1.2rem; font-family: var(--font-sans); font-weight: 500;
            padding-left: 1rem; border-left: 2px solid var(--border-subtle);
        }

        @media (max-width: 1023px) {
            .nav-links, .portfolio-subnav { display: none; }
            .mobile-menu-toggle { display: flex; }
            body { padding-top: 64px; }
            .primary-nav-container { padding: 0 1.5rem; }
        }

        /* ==========================================
           EXECUTIVE LAYOUT
           ========================================== */
        .container { 
            max-width: 1200px; margin: 0 auto; padding: 0 2rem; 
            position: relative; z-index: 1; 
        }
        .cv-layout {
            display: grid; grid-template-columns: 1fr; gap: 3rem; padding: 3rem 0;
        }
        @media (min-width: 1024px) {
            .cv-layout { grid-template-columns: 360px 1fr; align-items: start; }
            .cv-sidebar { position: sticky; top: 140px; }
        }

        /* Sidebar Profile */
        .profile-header h1 {
            font-family: var(--font-display); font-size: clamp(3.5rem, 8vw, 4rem);
            line-height: 0.9; margin-bottom: 0.5rem; color: var(--text-primary);
            text-transform: uppercase;
        }
        .profile-role {
            font-family: var(--font-sans); font-size: 1.1rem; color: var(--coral);
            font-weight: 600; margin-bottom: 1.5rem; letter-spacing: 0.05em;
        }
        .profile-contact {
            display: flex; flex-direction: column; gap: 0.8rem;
            margin-bottom: 2rem; font-size: 0.95rem; color: var(--text-secondary);
        }
        .profile-contact a { color: var(--text-secondary); text-decoration: none; }
        .profile-contact a:hover { color: var(--coral); }

        .cv-cta-group {
            display: flex; flex-direction: column; gap: 1rem;
            padding-top: 2rem; border-top: 1px solid var(--border-strong);
        }
        .btn { 
            display: inline-flex; align-items: center; justify-content: center; 
            padding: 14px 24px; border-radius: 12px; font-weight: 600; 
            font-size: 1rem; text-decoration: none; transition: all 0.3s; 
            border: none; cursor: pointer; width: 100%; text-align: center;
        }
        .btn-primary { background: var(--text-primary); color: var(--bg-primary); }
        .btn-primary:hover { background: var(--coral); color: white; transform: translateY(-2px); }

        /* Job Cards */
        .section-label {
            font-size: 0.85rem; font-weight: 700; letter-spacing: 0.15em;
            text-transform: uppercase; color: var(--text-muted);
            margin: 3rem 0 1.5rem; display: flex; align-items: center; gap: 1rem;
        }
        .section-label::after { content: ""; flex: 1; height: 1px; background: var(--border-strong); }
        
        .job-card {
            background: var(--card-bg); border: 1px solid var(--border-strong);
            border-left: 4px solid var(--text-primary); padding: 2rem; 
            border-radius: 0 16px 16px 0; transition: all 0.3s ease; margin-bottom: 2rem;
        }
        .job-card:hover { transform: translateX(5px); border-left-color: var(--coral); box-shadow: var(--shadow-hover); }
        
        .job-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 0.5rem; }
        .job-title { font-family: var(--font-display); font-size: clamp(1.5rem, 3vw, 1.75rem); font-weight: 700; color: var(--text-primary); }
        .job-meta { font-family: var(--font-sans); font-size: 0.95rem; color: var(--teal); font-weight: 600; margin-bottom: 1.5rem; }
        .job-details li { color: var(--text-secondary); margin-bottom: 0.75rem; font-size: 1rem; padding-left: 1.5rem; position: relative; }
        .job-details li::before { content: "→"; position: absolute; left: 0; color: var(--coral); font-weight: bold; }

        /* Skills Grid */
        .specs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; }
        .spec-card { background: var(--bg-alt); border: 1px solid var(--border-subtle); padding: 1.5rem; border-radius: 12px; }
        .spec-title { color: var(--coral); font-family: var(--font-display); font-size: 1.25rem; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .spec-list { list-style: none; padding: 0; font-size: 0.9rem; color: var(--text-secondary); line-height: 1.8; }
        .spec-list li { border-bottom: 1px dashed var(--border-subtle); padding: 4px 0; }

        /* Parallax */
        .skills-parallax { padding: 40px 0; background: var(--bg-alt); overflow: hidden; margin: 4rem 0; width: 100%; border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); }
        .skills-text { display: flex; gap: 40px; font-family: var(--font-display); font-size: clamp(3rem, 6vw, 4rem); font-weight: 900; color: var(--border-strong); text-transform: uppercase; white-space: nowrap; animation: slideLeft 40s linear infinite; opacity: 0.4; }
        @keyframes slideLeft { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* ==========================================
           FOOTER STYLES (Standardized)
           ========================================== */
        .site-footer {
            background: #0A0A0A;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 0;
            margin-top: auto;
            font-family: var(--font-sans);
            color: #ffffff;
        }

        .footer-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 4rem 2rem 3rem;
        }

        /* 4-Column Grid Desktop */
        .footer-grid-layout {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1.5fr;
            gap: 3rem;
        }

        .footer-brand-name {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .footer-tagline {
            color: rgba(255,255,255,0.5);
            font-size: 0.9375rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            max-width: 320px;
        }

        .footer-social {
            display: flex;
            gap: 0.75rem;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            color: #ffffff;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.1);
            text-decoration: none;
        }

        .social-icon:hover {
            background: var(--coral);
            border-color: var(--coral);
        }

        .footer-nav-heading {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255,255,255,0.4);
            margin-bottom: 1.5rem;
        }

        .footer-nav-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .footer-nav-link {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 0.9375rem;
            transition: color 0.2s;
        }

        .footer-nav-link:hover {
            color: var(--coral);
        }

        .footer-portal-link {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .footer-system-link {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--coral);
            text-decoration: none;
            font-style: italic;
        }

        .footer-nav-divider {
            margin-top: 0.5rem;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(255,255,255,0.15);
        }

        /* Status Card */
        .footer-status-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 1.25rem;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--teal);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(46, 211, 198, 0.5);
        }

        .status-text {
            font-family: var(--font-display);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #ffffff;
            font-size: 0.9rem;
        }

        .status-description {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            margin: 0 0 1rem 0;
            line-height: 1.5;
        }

        .status-cta {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: gap 0.2s ease;
        }

        .status-cta:hover {
            gap: 0.75rem;
            color: var(--coral);
        }

        /* Bottom Bar */
        .footer-bottom-bar {
            border-top: 1px solid rgba(255,255,255,0.05);
            background: #050505;
        }

        .footer-bottom-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .footer-copyright {
            color: rgba(255,255,255,0.3);
            font-size: 0.8rem;
            margin: 0;
        }

        .footer-legal-links {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .footer-legal-link {
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.2s;
        }

        .footer-legal-link:hover {
            color: #ffffff;
        }

        /* Mobile Footer Overrides (Centered Stack) */
        @media (max-width: 1023px) {
            .footer-grid-layout {
                grid-template-columns: 1fr; /* Single column */
                gap: 3rem;
                text-align: center; /* Center everything */
            }

            .footer-brand-col,
            .footer-nav-col,
            .footer-status-col {
                display: flex;
                flex-direction: column;
                align-items: center; /* Center flex items */
                margin: 0 auto;
                max-width: 100%;
            }

            .footer-logo-link {
                justify-content: center;
            }

            .footer-tagline {
                margin-left: auto;
                margin-right: auto;
            }

            .footer-social {
                justify-content: center;
            }

            /* Status Card Specifics */
            .footer-status-card {
                text-align: left; /* Keep card text aligned left */
                max-width: 400px; /* Constrain width */
                width: 100%;
            }

            .footer-bottom-container {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
