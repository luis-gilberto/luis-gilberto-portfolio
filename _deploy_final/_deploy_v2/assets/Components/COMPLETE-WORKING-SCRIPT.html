<script>
document.addEventListener('DOMContentLoaded', () => {
    // ============================================
    // THEME TOGGLE
    // ============================================
    const themeToggle = document.getElementById('themeToggle');
    const htmlElement = document.documentElement;
    
    const savedTheme = localStorage.getItem('theme') || 'light';
    htmlElement.setAttribute('data-theme', savedTheme);
    
    if (themeToggle) {
        themeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    }

    // ============================================
    // INTERSECTION OBSERVER (Fade-in animations)
    // ============================================
    const observerOptions = {
        threshold: 0.15,
        rootMargin: '0px 0px -100px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.style.animationPlayState = 'running';
            }
        });
    }, observerOptions);

    document.querySelectorAll('.fade-in').forEach(el => {
        observer.observe(el);
    });

    // ============================================
    // TAB SWITCHING (Stories/Numbers)
    // ============================================
    const tabButtons = document.querySelectorAll('.tab-button');
    const tabContents = document.querySelectorAll('.tab-content');

    tabButtons.forEach(button => {
        button.addEventListener('click', () => {
            tabButtons.forEach(btn => btn.classList.remove('active'));
            tabContents.forEach(content => content.classList.remove('active'));

            button.classList.add('active');
            const tabId = button.getAttribute('data-tab');
            const targetTab = document.getElementById(`${tabId}-tab`);
            if (targetTab) {
                targetTab.classList.add('active');
            }
        });
    });

    // ============================================
    // SMOOTH SCROLL
    // ============================================
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
            e.preventDefault();
            const target = document.querySelector(this.getAttribute('href'));
            if (target) {
                target.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }
        });
    });

    // ============================================
    // THREAD ANIMATION (Hero Title)
    // ============================================
    (function() {
        'use strict';

        const config = {
            startDelay: 400,
            pathDuration: 2500,
            dotAppearDelay: 2500,
            dotDuration: 500
        };

        function initThreadAnimation() {
            const threadPath = document.querySelector('.thread-path');
            const threadDot = document.querySelector('.thread-dot');
            
            if (!threadPath || !threadDot) {
                console.warn('Thread animation elements not found');
                return;
            }

            // Respect reduced motion preferences
            const prefersReducedMotion = window.matchMedia && 
                window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            
            if (prefersReducedMotion) {
                threadPath.style.opacity = '1';
                threadPath.style.strokeDasharray = 'none';
                threadPath.style.strokeDashoffset = '0';
                threadDot.style.opacity = '1';
                threadDot.style.transform = 'scale(1)';
                return;
            }

            const pathLength = threadPath.getTotalLength();
            
            if (!isFinite(pathLength) || pathLength <= 0) {
                console.warn('Thread animation: invalid path length');
                threadPath.style.opacity = '1';
                threadDot.style.opacity = '1';
                return;
            }
            
            // Set initial state
            threadPath.style.strokeDasharray = pathLength;
            threadPath.style.strokeDashoffset = pathLength;
            threadPath.style.opacity = '0';
            threadDot.style.opacity = '0';
            threadDot.style.transform = 'scale(0)';

            // Animate path
            setTimeout(() => {
                threadPath.style.transition = `
                    stroke-dashoffset ${config.pathDuration}ms cubic-bezier(0.65, 0, 0.35, 1),
                    opacity 200ms ease-out
                `;
                threadPath.style.strokeDashoffset = '0';
                threadPath.style.opacity = '1';

                // Animate dot
                setTimeout(() => {
                    threadDot.style.transition = `
                        opacity ${config.dotDuration}ms ease-out,
                        transform ${config.dotDuration}ms cubic-bezier(0.34, 1.56, 0.64, 1)
                    `;
                    threadDot.style.opacity = '1';
                    threadDot.style.transform = 'scale(1)';
                }, config.dotAppearDelay);
            }, config.startDelay);
        }

        initThreadAnimation();
    })();

    // ============================================
    // STORIES CAROUSEL (Swiper.js)
    // ============================================
    const storiesSwiperContainer = document.querySelector('.stories-swiper');
    
    if (storiesSwiperContainer && typeof Swiper !== 'undefined') {
        try {
            const storiesSwiper = new Swiper('.stories-swiper', {
                effect: 'coverflow',
                grabCursor: true,
                centeredSlides: true,
                slidesPerView: 'auto',
                loop: false,
                coverflowEffect: {
                    rotate: 0,
                    stretch: 0,
                    depth: 110,
                    modifier: 1,
                    slideShadows: false,
                },
                pagination: {
                    el: '.stories-swiper .swiper-pagination',
                    clickable: true,
                },
                navigation: {
                    nextEl: '.stories-swiper .swiper-button-next',
                    prevEl: '.stories-swiper .swiper-button-prev',
                },
                keyboard: { 
                    enabled: true 
                },
                a11y: {
                    enabled: true,
                    prevSlideMessage: 'Previous story',
                    nextSlideMessage: 'Next story',
                },
                breakpoints: {
                    480: { 
                        slidesPerView: 1.1, 
                        spaceBetween: 20 
                    },
                    768: { 
                        slidesPerView: 1.5, 
                        spaceBetween: 30 
                    },
                    968: { 
                        slidesPerView: 2, 
                        spaceBetween: 30 
                    },
                    1200: { 
                        slidesPerView: 2.5, 
                        spaceBetween: 40 
                    }
                }
            });
            
            console.log('Stories carousel initialized successfully');
        } catch (error) {
            console.error('Error initializing Stories carousel:', error);
        }
    } else if (storiesSwiperContainer) {
        console.warn('Swiper library not loaded for Stories carousel');
    }

    // ============================================
    // WORK CAROUSEL (Swiper.js)
    // ============================================
    const workSwiperContainer = document.querySelector('.work-swiper');
    
    if (workSwiperContainer && typeof Swiper !== 'undefined') {
        try {
            const workSwiper = new Swiper('.work-swiper', {
                effect: 'coverflow',
                grabCursor: true,
                centeredSlides: true,
                slidesPerView: 'auto',
                loop: false,
                coverflowEffect: {
                    rotate: 0,
                    stretch: 0,
                    depth: 120,
                    modifier: 1.5,
                    slideShadows: false,
                },
                pagination: {
                    el: '.work-swiper-pagination',
                    clickable: true,
                    dynamicBullets: true,
                },
                navigation: {
                    nextEl: '.work-swiper-next',
                    prevEl: '.work-swiper-prev',
                },
                keyboard: { 
                    enabled: true 
                },
                a11y: {
                    enabled: true,
                    prevSlideMessage: 'Previous work item',
                    nextSlideMessage: 'Next work item',
                },
                breakpoints: {
                    480: { 
                        slidesPerView: 1.1, 
                        spaceBetween: 20 
                    },
                    768: { 
                        slidesPerView: 1.5, 
                        spaceBetween: 30 
                    },
                    968: { 
                        slidesPerView: 2, 
                        spaceBetween: 30 
                    },
                    1200: { 
                        slidesPerView: 2.5, 
                        spaceBetween: 40 
                    }
                }
            });
            
            console.log('Work carousel initialized successfully');
        } catch (error) {
            console.error('Error initializing Work carousel:', error);
        }
    } else if (workSwiperContainer) {
        console.warn('Swiper library not loaded for Work carousel');
    }

    // ============================================
    // CONSOLE LOG (Development)
    // ============================================
    console.log('Insights page JavaScript initialized successfully');
});
</script>
