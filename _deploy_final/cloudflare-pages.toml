[build]
command = "echo 'Static site - no build required'"
publish = "."

[build.environment]
NODE_VERSION = "20"

[[redirects]]
from = "/thehub"
to = "/TheHub/"
status = 301

[[redirects]]
from = "/thehub/*"
to = "/TheHub/:splat"
status = 301

[[redirects]]
from = "/TheHub"
to = "/TheHub/"
status = 200

[[redirects]]
from = "/TheHub/"
to = "/TheHub/index.html"
status = 200

[[redirects]]
from = "/thanks"
to = "/TheHub/thank-you-qualified.html"
status = 301
