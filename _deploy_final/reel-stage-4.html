<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrategyIQ™ Closing Cinematic | Stage 4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-white: #FFFFFF;
            --text-metadata: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: none;
        }

        .cinematic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* HASH METADATA */
        .hash-metadata {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: var(--text-metadata);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0;
            filter: blur(8px);
            transition: opacity 3s ease, filter 3s ease;
        }

        .hash-metadata.reveal {
            opacity: 0.4;
            filter: blur(0);
        }

        /* TAGLINE */
        .tagline {
            margin-top: 40px;
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            color: var(--text-white);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .tagline.reveal {
            opacity: 1;
        }

    </style>
</head>
<body>

    <div class="cinematic-container">
        <div class="hash-metadata" id="hashMetadata">
            STRATEGYIQ V1.0 | AUTH LEVEL: 3 | CID: LG-001 | MOTION: TRIAGE | HASH: 9F3A-VHV32LIT
        </div>
        
        <div class="tagline" id="tagline">
            STRATEGY THAT SHIPS
        </div>
    </div>

    <script>
        const hashEl = document.getElementById('hashMetadata');
        const taglineEl = document.getElementById('tagline');

        async function runClosingSequence() {
            // 1. Initial wait
            await new Promise(resolve => setTimeout(resolve, 1000));

            // 2. Reveal Hash Metadata (Fade + Sharpen)
            hashEl.classList.add('reveal');

            // 3. Wait for hash reveal to complete significantly
            await new Promise(resolve => setTimeout(resolve, 3500));

            // 4. Fade in Tagline
            taglineEl.classList.add('reveal');
        }

        window.onload = runClosingSequence;
    </script>
</body>
</html>
