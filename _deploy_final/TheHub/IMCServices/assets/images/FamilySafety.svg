<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Microsoft Family Safety Logo -->
  <defs>
    <linearGradient id="familyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#01b3a7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="80" height="80" fill="url(#familyGradient)" rx="12"/>
  
  <!-- Shield Shape -->
  <path d="M40 15 L25 25 L25 45 Q25 55 40 65 Q55 55 55 45 L55 25 Z" fill="#ffffff" opacity="0.9"/>
  
  <!-- Family figures inside shield -->
  <!-- Parent 1 -->
  <circle cx="32" cy="35" r="4" fill="url(#familyGradient)"/>
  <rect x="29" y="39" width="6" height="8" fill="url(#familyGradient)" rx="3"/>
  
  <!-- Parent 2 -->
  <circle cx="48" cy="35" r="4" fill="url(#familyGradient)"/>
  <rect x="45" y="39" width="6" height="8" fill="url(#familyGradient)" rx="3"/>
  
  <!-- Child -->
  <circle cx="40" cy="42" r="3" fill="url(#familyGradient)"/>
  <rect x="38" y="45" width="4" height="6" fill="url(#familyGradient)" rx="2"/>
  
  <!-- Heart symbol -->
  <path d="M40 28 Q37 25 34 28 Q34 31 40 34 Q46 31 46 28 Q43 25 40 28 Z" fill="#ff6b6b" opacity="0.8"/>
</svg>