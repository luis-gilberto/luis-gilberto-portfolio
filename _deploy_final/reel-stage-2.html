<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrategyIQ™ Pillar Synthesis | Stage 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --coral: #F96F6E;
            --teal: #2ED3C6;
            --grey-dim: rgba(255, 255, 255, 0.2);
            --border-dim: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: none;
        }

        .stage-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Scanner Line */
        .scanner-line {
            position: absolute;
            top: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--teal);
            box-shadow: 0 0 15px var(--teal), 0 0 30px var(--teal);
            z-index: 100;
            opacity: 0;
        }

        .scanner-line.active {
            animation: scan 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes scan {
            0% { top: -2px; opacity: 1; }
            100% { top: 100%; opacity: 1; }
        }

        /* Pillars Layout */
        .pillars-row {
            display: flex;
            gap: 40px;
            z-index: 10;
        }

        .pillar-card {
            width: 280px;
            height: 380px;
            background: rgba(15, 15, 15, 0.5);
            border: 1px solid var(--border-dim);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0.2;
            position: relative;
            transition: opacity 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .pillar-title {
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            color: #FFF;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* GTM Activation Styles */
        .pillar-card.gtm.activated {
            opacity: 1;
            border-color: var(--coral);
            box-shadow: 0 0 20px rgba(249, 111, 110, 0.2);
        }

        .badge {
            position: absolute;
            bottom: 40px;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--coral);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background: rgba(249, 111, 110, 0.1);
            padding: 8px 16px;
            border-radius: 2px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .pillar-card.gtm.activated .badge {
            opacity: 1;
        }

    </style>
</head>
<body>

    <div class="stage-container">
        <!-- Scanner Line -->
        <div class="scanner-line" id="scanner"></div>

        <div class="pillars-row">
            <div class="pillar-card gtm" id="gtmCard">
                <div class="pillar-title">GTM</div>
                <div class="badge">MOTION: TRIAGE STABILIZATION</div>
            </div>
            
            <div class="pillar-card">
                <div class="pillar-title">BRAND</div>
            </div>
            
            <div class="pillar-card">
                <div class="pillar-title">CAMPAIGN</div>
            </div>
            
            <div class="pillar-card">
                <div class="pillar-title">CREATIVE</div>
            </div>
        </div>
    </div>

    <script>
        const scanner = document.getElementById('scanner');
        const gtmCard = document.getElementById('gtmCard');

        async function runSequence() {
            // Wait 1.5 seconds as requested
            await new Promise(resolve => setTimeout(resolve, 1500));

            // Start Scanner Line
            scanner.classList.add('active');

            // Wait for scanner to reach GTM card area (approx 1s into the 2.5s animation)
            await new Promise(resolve => setTimeout(resolve, 1000));

            // Activate GTM Card
            gtmCard.classList.add('activated');
        }

        window.onload = runSequence;
    </script>
</body>
</html>
