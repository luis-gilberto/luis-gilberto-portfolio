<!-- ====================================================================
     STANDARDIZED HEADER FOR SCOPEIQ PAGE
     This matches The Hub's main page header exactly
     
     INSTRUCTIONS:
     1. Add this CSS in the <head> section (after existing styles)
     2. Add the HTML at the top of <body> (before main content)
     3. Add the JavaScript at the bottom (before </body>)
     ==================================================================== -->

<!-- ============================================
     PART 1: CSS - Add to <head> section
     ============================================ -->
<style>
/* ==========================================
   HUB HEADER NAVIGATION (GOLDEN STANDARD)
   ========================================== */

:root {
  --coral: #F96F6E;
  --teal: #2ED3C6;
  --text-primary: rgba(255, 255, 255, 0.95);
  --text-secondary: rgba(255, 255, 255, 0.6);
}

.hub-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: rgba(8, 8, 10, 0.6);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.header-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0.5rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
}

.header-logo img { 
    height: 36px; 
    width: auto; 
}

.header-nav { 
    display: flex; 
    align-items: center; 
    gap: 0.5rem; 
}

.nav-item {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.75rem;
    border-radius: 12px;
    color: var(--text-secondary);
    text-decoration: none;
    border: 1px solid transparent;
    transition: all 0.2s ease;
    font-size: 0.95rem;
    font-weight: 600;
}

.nav-item:hover { 
    color: var(--teal); 
    background: rgba(255,255,255,0.06); 
    border-color: rgba(255,255,255,0.12); 
}

.nav-item.active { 
    color: var(--text-primary); 
    border-color: rgba(46,211,198,0.5); 
    background: rgba(46,211,198,0.10); 
}

.nav-icon { 
    width: 20px; 
    height: 20px; 
    display: inline-block; 
}

.nav-label { 
    font-weight: 600; 
    font-size: 0.95rem; 
}

.mobile-toggle {
    display: none;
    width: 36px;
    height: 36px;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.mobile-toggle:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.2);
}

.mobile-toggle span { 
    display: block; 
    width: 20px; 
    height: 3px; 
    background: var(--text-secondary); 
    border-radius: 2px; 
    transition: all 0.2s ease;
}

/* Spacing compensation for fixed header */
body { 
    padding-top: 56px; /* Height of header */
}

/* Responsive navigation */
@media (max-width: 1024px) {
    .header-nav { display: none; }
    .mobile-toggle { display: inline-flex; }
    .header-nav.open {
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(8,8,10,0.96);
        backdrop-filter: blur(20px) saturate(120%);
        -webkit-backdrop-filter: blur(20px) saturate(120%);
        z-index: 9999;
        padding: 4rem 2rem 2rem 2rem;
        gap: 0.75rem;
        align-items: center;
        justify-content: flex-start;
        overflow-y: auto;
        animation: slideIn 0.3s ease-out;
    }
    .header-nav.open .nav-icon {
        width: 32px;
        height: 32px;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
        -ms-interpolation-mode: nearest-neighbor;
    }
    .header-nav.open .nav-item {
        font-size: 1.1rem;
        padding: 1rem 1.5rem;
        width: 100%;
        max-width: 400px;
        justify-content: flex-start;
        border-color: rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.04);
    }
    .header-nav.open .nav-item:hover {
        background: rgba(255,255,255,0.08);
    }
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Prevent scroll when mobile menu is open */
body.menu-open {
    overflow: hidden;
    touch-action: none;
}
</style>

<!-- ============================================
     PART 2: HTML - Add at top of <body>
     ============================================ -->
<header class="hub-header">
    <div class="header-container">
        <a href="/TheHub/index.html" class="header-logo">
            <img src="/TheHub/advisory/assets/TheHub_Logo.png" alt="The Hub" width="120" height="40">
        </a>
        <nav class="header-nav" id="headerNav">
            <a href="/TheHub/index.html" class="nav-item">
                <img src="/TheHub/advisory/assets/Home_Simple_100x100.png" alt="Home" class="nav-icon" width="20" height="20">
                <span class="nav-label">Home</span>
            </a>
            <a href="/TheHub/IMCServices/index.html" class="nav-item">
                <img src="/TheHub/advisory/assets/IMC_Services_Simple_100x100.png" alt="Services" class="nav-icon" width="20" height="20">
                <span class="nav-label">Services</span>
            </a>
            <a href="/TheHub/advisory/" class="nav-item">
                <img src="/TheHub/advisory/assets/Advisory_Simple_100x100.png" alt="Advisory" class="nav-icon" width="20" height="20">
                <span class="nav-label">Advisory</span>
            </a>
            <a href="/TheHub/scopeiq/index.html" class="nav-item active">
                <img src="/TheHub/advisory/assets/ScopeIQ_Clean_Telescope_100x100.png" alt="ScopeIQ" class="nav-icon" width="20" height="20">
                <span class="nav-label">ScopeIQ</span>
            </a>
            <a href="/TheHub/strategyiq/index.html" class="nav-item">
                <img src="/TheHub/advisory/assets/StrategyIQ_Simple_100x100.png" alt="StrategyIQ" class="nav-icon" width="20" height="20">
                <span class="nav-label">StrategyIQ</span>
            </a>
        </nav>
        <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle mobile menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>
</header>

<!-- ============================================
     PART 3: JavaScript - Add before </body>
     ============================================ -->
<script>
// Mobile nav toggle (Golden Standard)
(function(){
    const mobileToggle = document.getElementById('mobileToggle');
    const headerNav = document.getElementById('headerNav');
    
    // Placeholder to restore original position after closing
    let placeholder = null;
    if (headerNav) {
        placeholder = document.createElement('div');
        placeholder.style.display = 'none';
        headerNav.parentNode.insertBefore(placeholder, headerNav);
    }
    
    if (mobileToggle && headerNav) {
        mobileToggle.addEventListener('click', function(){
            const isOpen = !headerNav.classList.contains('open');
            
            if (isOpen) {
                // Open menu
                headerNav.classList.add('open');
                mobileToggle.setAttribute('aria-expanded', 'true');
                
                // Reparent to body to avoid clipping
                document.body.appendChild(headerNav);
                document.body.classList.add('menu-open');
                document.body.style.overflow = 'hidden';
                document.body.style.touchAction = 'none';
            } else {
                // Close menu
                headerNav.classList.remove('open');
                mobileToggle.setAttribute('aria-expanded', 'false');
                
                // Restore original position
                if (placeholder && placeholder.parentNode) {
                    placeholder.parentNode.insertBefore(headerNav, placeholder);
                }
                document.body.classList.remove('menu-open');
                document.body.style.overflow = '';
                document.body.style.touchAction = '';
            }
        });
        
        // Close menu when clicking a nav link
        const navItems = headerNav.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.addEventListener('click', function() {
                if (headerNav.classList.contains('open')) {
                    headerNav.classList.remove('open');
                    mobileToggle.setAttribute('aria-expanded', 'false');
                    
                    if (placeholder && placeholder.parentNode) {
                        placeholder.parentNode.insertBefore(headerNav, placeholder);
                    }
                    document.body.classList.remove('menu-open');
                    document.body.style.overflow = '';
                    document.body.style.touchAction = '';
                }
            });
        });
        
        // Close menu on escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && headerNav.classList.contains('open')) {
                headerNav.classList.remove('open');
                mobileToggle.setAttribute('aria-expanded', 'false');
                
                if (placeholder && placeholder.parentNode) {
                    placeholder.parentNode.insertBefore(headerNav, placeholder);
                }
                document.body.classList.remove('menu-open');
                document.body.style.overflow = '';
                document.body.style.touchAction = '';
            }
        });
    }
})();
</script>
