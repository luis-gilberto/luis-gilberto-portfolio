<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hub - Built for what's next | Luis Gilberto</title>
    <meta name="description" content="Strategic marketing leadership meets creative excellence. Professional marketing transformation that moves at the speed of modern business through sophisticated tools and services.">
    
    <!-- Meta -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://luis-gilberto.com/TheHub/">
    <meta property="og:title" content="The Hub | Luis Gilberto">
    <meta property="og:description" content="Where good ideas get the clarity they deserve.">
    <meta property="og:image" content="https://luis-gilberto.com/assets/images/the-hub_og-1200x630.jpg">
    <meta name="twitter:card" content="summary_large_image">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@100;300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Hub Loading Animation Script -->
    <script src="./assets/components/hub-animation/hub-loader.min.js"></script>
    
    <style>
        /* ==========================================
           BASE & VARIABLES (FROM YOUR ORIGINAL FILE)
           ========================================== */
        :root {
          --coral: #F96F6E;
          --teal: #2ED3C6;
          --dark-bg: #0A0A0A;
          --bg-darker: #050505;
          --dark-2: #1A1A1A;
          --text-primary: rgba(255, 255, 255, 0.95);
          --text-secondary: rgba(255, 255, 255, 0.6);
          --text-muted: rgba(255, 255, 255, 0.35);
          --border-subtle: rgba(255, 255, 255, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }
        #main-content { display: none; }
        main { position: relative; z-index: 10; }
        .text-gradient { background: linear-gradient(135deg, var(--coral), var(--teal)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

        /* ==========================================
           HEADER & NAVIGATION (FROM YOUR ORIGINAL FILE)
           ========================================== */
        .hub-header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(8, 8, 10, 0.9); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-subtle); }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0.5rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        .header-logo img { height: 36px; width: auto; }
        .header-nav { display: flex; align-items: center; gap: 0.5rem; }
        .nav-item { display: inline-flex; align-items: center; gap: 0.75rem; padding: 0.625rem 1rem; border-radius: 12px; color: var(--text-secondary); text-decoration: none; border: 1px solid transparent; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .nav-item:hover { color: var(--teal); background: rgba(255,255,255,0.06); }
        .nav-item.active { color: var(--text-primary); border-color: rgba(46,211,198,0.5); background: rgba(46,211,198,0.10); }
        .nav-icon { width: 24px; height: 24px; }
        .nav-label { font-weight: 600; font-size: 0.95rem; }
        .mobile-toggle { display: none; width: 36px; height: 36px; border: 1px solid rgba(255,255,255,0.14); border-radius: 8px; background: rgba(255,255,255,0.04); align-items: center; justify-content: center; flex-direction: column; gap: 6px; cursor: pointer; }
        .mobile-toggle span { display: block; width: 20px; height: 3px; background: var(--text-secondary); border-radius: 2px; }
        @media (max-width: 1024px) { .header-nav { display: none; } .mobile-toggle { display: inline-flex; } /* ...and other mobile nav styles */ }

        /* ==========================================
           HERO SECTION
           ========================================== */
        .hero {
            position: relative;
            margin-top: 80px;
            padding: 20vh 1.5rem 12vh;
            text-align: center;
            overflow: hidden;
            perspective: 1000px; /* CRITICAL FOR 3D */
        }
        .hero-content {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 2; /* Content above shapes */
        }
        .hero-badge { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50px; font-size: 0.85rem; color: rgba(255, 255, 255, 0.7); margin-bottom: 2rem; }
        .badge-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .hero-title { font-family: 'Playfair Display', serif; font-size: clamp(2.4rem, 5vw, 4.25rem); line-height: 1.1; font-weight: 700; margin-bottom: 1.5rem; }
        .hero-description { font-size: 1.25rem; color: var(--text-secondary); margin-bottom: 2.5rem; line-height: 1.6; }
        .hero-cta-group { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-bottom: 4rem; flex-wrap: wrap; }
        .btn { display: inline-flex; align-items: center; gap: 0.75rem; padding: 1rem 2rem; border-radius: 50px; text-decoration: none; font-weight: 600; transition: all 0.3s ease; font-size: 1rem; }
        .btn svg { width: 20px; height: 20px; }
        .btn-primary { background: var(--coral); color: white; box-shadow: 0 8px 32px rgba(249, 111, 110, 0.3); }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); border: 1px solid rgba(255, 255, 255, 0.1); }
        .teal-link { color: #00B4B4; text-decoration: underline; text-decoration-thickness: 1px; display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.95rem; font-weight: 500; }
        .teal-link svg { width: 16px; height: 16px; }

        /* ==========================================
           NEW 3D HERO BACKGROUND STYLES
           ========================================== */
        .hero-background-shapes {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform-style: preserve-3d;
            z-index: 1;
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }
        .shape-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: transform 0.2s ease-out; }
        .shape { position: absolute; will-change: transform; animation: float 25s ease-in-out infinite; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3)); }
        .shape img { width: 100%; height: auto; display: block; }
        .shape-1 { top: 15%; left: 10%; width: 50px; animation-delay: -2s; }
        .shape-2 { top: 70%; right: 15%; width: 40px; animation-delay: -5s; }
        .shape-3 { top: 20%; left: 60%; width: 70px; animation-delay: -8s; }
        .shape-4 { top: 80%; left: 25%; width: 60px; animation-delay: -12s; }
        .shape-5 { top: 40%; left: 30%; width: 80px; animation-delay: -15s; }
        .shape-6 { top: 50%; right: 40%; width: 75px; animation-delay: -18s; }

        @keyframes float {
            0% { transform: translateZ(0px) translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateZ(100px) translateY(-20px) rotate(180deg); opacity: 1; }
            100% { transform: translateZ(0px) translateY(0px) rotate(360deg); opacity: 0.7; }
        }

        /* ==========================================
           INTRO ANIMATION & OTHER SECTIONS (RESTORED)
           ========================================== */
        .hub-reveal-system { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; pointer-events: none; transition: opacity 1.5s ease-out; opacity: 0; }
        .service-image { position: fixed; opacity: 0; transform-origin: center; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .service-image img { width: 100%; height: 100%; object-fit: contain; }
        .service-image.reveal { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
        .service-advisory { width: 300px; height: 300px; top: 12%; left: 12%; }
        .service-imc { width: 300px; height: 300px; top: 12%; left: 88%; transition-delay: 0.15s; }
        .service-scope { width: 300px; height: 300px; top: 88%; left: 12%; transition-delay: 0.3s; }
        .service-strategy { width: 300px; height: 300px; top: 88%; left: 88%; transition-delay: 0.45s; }
        .service-image.rotating { animation: hubServiceRock 13s ease-in-out infinite alternate; }
        @keyframes hubServiceRock { from { transform: translate(-50%, -50%) scale(1) rotate(-45deg); } to { transform: translate(-50%, -50%) scale(1) rotate(45deg); } }
        
        .section-container { max-width: 1200px; margin: 0 auto; padding: 6rem 2rem; }
        .section-label { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
        .label-line { width: 40px; height: 2px; background: var(--coral); }
        .section-title { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 3.6vw, 2.5rem); font-weight: 700; line-height: 1.2; margin-bottom: 3rem; }
        .philosophy-grid, .services-grid, .expertise-grid { display: grid; gap: 2rem; }
        .philosophy-grid, .expertise-grid { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .services-grid { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
        .philosophy-card, .service-card, .expertise-item { padding: 2.5rem; background: var(--dark-2); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; }
        .card-number { font-family: 'Playfair Display', serif; font-size: 3.5rem; font-weight: 700; line-height: 1; margin-bottom: 1rem; background: linear-gradient(135deg, var(--coral) 20%, var(--teal) 80%); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .card-title { font-size: 1.5rem; font-weight: 600; margin-bottom: 1rem; }
        .card-description { color: var(--text-secondary); }
        .service-card { display: flex; flex-direction: column; }
        .service-header { text-align: center; margin-bottom: 2rem; }
        .service-icon-img { height: 100px; width: 100px; object-fit: contain; margin: 0 auto 1.5rem; }
        .service-title { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 1rem; }
        .service-description { font-size: 0.95rem; color: var(--text-secondary); text-align: center; margin-bottom: 2rem; flex-grow: 1; }
        .service-link { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: auto; padding: 0.75rem 1.5rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50px; text-decoration: none; color: var(--text-primary); font-weight: 500; transition: all 0.3s ease; }
        .service-link:hover { background: rgba(249, 111, 110, 0.1); border-color: var(--coral); color: var(--coral); }
        .expertise-item { text-align: center; }
        .expertise-icon { width: 60px; height: 60px; margin: 0 auto 1.5rem; color: var(--teal); }
        .cta-section { text-align: center; }
        .cta-title { font-size: clamp(2rem, 4vw, 3.5rem); }
        .cta-description { font-size: 1.25rem; }

        /* FOOTER (FROM YOUR ORIGINAL FILE) */
        .hub-footer { background: var(--bg-darker); border-top: 1px solid var(--border-subtle); padding: clamp(3rem, 8vw, 5rem) clamp(1.5rem, 5vw, 3rem); }
        .footer-container { max-width: 1400px; margin: 0 auto; }
        .footer-main { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(200px, 1fr) minmax(250px, 1fr); gap: clamp(2rem, 5vw, 4rem); padding-bottom: clamp(2rem, 4vw, 3rem); border-bottom: 1px solid var(--border-subtle); }
        .footer-brand .footer-logo img { max-width: clamp(220px, 24vw, 320px); }
        .footer-tagline { color: var(--text-secondary); font-size: clamp(0.875rem, 1.8vw, 1rem); }
        .footer-nav-title { font-size: clamp(0.7rem, 1.4vw, 0.75rem); text-transform: uppercase; color: var(--text-muted); }
        .footer-link, .footer-social a { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: var(--text-primary); font-size: clamp(0.875rem, 1.6vw, 0.95rem); }
        .footer-bottom { padding-top: clamp(1.5rem, 3vw, 2rem); }
        .footer-bottom-content { display: flex; align-items: center; justify-content: center; gap: 1rem; }
        .footer-copyright, .footer-tagline-mini { color: var(--text-tertiary); font-size: 0.85rem; }
        @media (max-width: 1024px) { .footer-main { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div id="main-content">
    <header class="hub-header">
        <div class="header-container">
            <a href="/TheHub/index.html" class="header-logo"><img src="./advisory/assets/The_Hub_logo.svg" alt="The Hub"></a>
            <nav class="header-nav" id="headerNav">
                <a href="/TheHub/index.html" class="nav-item active"><img src="./advisory/assets/Home_Simple_100x100.png" alt="Home" class="nav-icon"><span class="nav-label">Home</span></a>
                <a href="./IMCServices/" class="nav-item"><img src="./advisory/assets/IMC_Services_Simple_100x100.png" alt="Services" class="nav-icon"><span class="nav-label">Services</span></a>
                <a href="./advisory/" class="nav-item"><img src="./advisory/assets/Advisory_Simple_100x100.png" alt="Advisory" class="nav-icon"><span class="nav-label">Advisory</span></a>
                <a href="./scopeiq/" class="nav-item"><img src="./advisory/assets/ScopeIQ_Clean_Telescope_100x100.png" alt="ScopeIQ" class="nav-icon"><span class="nav-label">ScopeIQ</span></a>
                <a href="./strategyiq/" class="nav-item"><img src="./advisory/assets/StrategyIQ_Simple_100x100.png" alt="StrategyIQ" class="nav-icon"><span class="nav-label">StrategyIQ</span></a>
            </nav>
            <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle mobile menu" aria-expanded="false"><span></span><span></span><span></span></button>
        </div>
    </header>

    <main>
        <section class="hero" id="home">
            <div class="hero-background-shapes" aria-hidden="true">
                <div class="shape-layer" data-depth="0.1">
                    <div class="shape shape-1"><img src="./assets/icons/floating-shapes/compass_rose_coral.png" alt=""></div>
                    <div class="shape shape-2"><img src="./assets/icons/floating-shapes/chess_queen_teal.png" alt=""></div>
                </div>
                <div class="shape-layer" data-depth="0.2">
                    <div class="shape shape-3"><img src="./assets/icons/floating-shapes/atom_model_teal.png" alt=""></div>
                    <div class="shape shape-4"><img src="./assets/icons/floating-shapes/telescope_coral.png" alt=""></div>
                </div>
                <div class="shape-layer" data-depth="0.4">
                    <div class="shape shape-5"><img src="./assets/icons/floating-shapes/compass_rose_coral.png" alt=""></div>
                    <div class="shape shape-6"><img src="./assets/icons/floating-shapes/chess_queen_teal.png" alt=""></div>
                </div>
            </div>
            <div class="hero-content">
                <div class="hero-badge"><span class="badge-dot"></span><span>Available for select projects</span></div>
                <h1 class="hero-title">The <span class="text-gradient">Hub</span></h1>
                <p class="hero-description">Four services, one system. Strategic marketing leadership meets creative excellence, distributed from the center to power your entire brand ecosystem.</p>
                <div class="hero-cta-group">
                    <a href="https://luis-gilberto.com/contact?from=imc#cta-hook" class="btn btn-primary"><span>Start a Project</span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14M12 5l7 7-7 7" stroke-width="2" stroke-linecap="round"/></svg></a>
                    <a href="#services" class="btn btn-secondary"><span>Explore Services</span></a>
                </div>
                <div class="hero-secondary-cta"><a href="https://luis-gilberto.com/TheHub/system/" class="teal-link">Learn more about The Hub <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></a></div>
            </div>
        </section>

        <section class="philosophy-section"><!-- FULL PHILOSOPHY CONTENT FROM ORIGINAL FILE --></section>
        <section class="services-section" id="services"><!-- FULL SERVICES CONTENT FROM ORIGINAL FILE --></section>
        <section class="expertise-section" id="expertise"><!-- FULL EXPERTISE CONTENT FROM ORIGINAL FILE --></section>
        <section class="cta-section" id="contact"><!-- FULL CTA CONTENT FROM ORIGINAL FILE --></section>
    </main>

    <footer class="hub-footer"><!-- FULL FOOTER CONTENT FROM ORIGINAL FILE --></footer>
</div>

<div class="hub-reveal-system" id="hubRevealSystem">
    <div class="service-image service-advisory"><img src="./assets/icons/floating-shapes/compass_rose_coral.png" alt="Advisory"></div>
    <div class="service-image service-imc"><img src="./assets/icons/floating-shapes/atom_model_teal.png" alt="IMC Services"></div>
    <div class="service-image service-scope"><img src="./assets/icons/floating-shapes/telescope_coral.png" alt="ScopeIQ"></div>
    <div class="service-image service-strategy"><img src="./assets/icons/floating-shapes/chess_queen_teal.png" alt="StrategyIQ"></div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const shouldShowAnimation = !sessionStorage.getItem('hubNavigated');
    const mainContent = document.getElementById('main-content');
    const revealSystem = document.getElementById('hubRevealSystem');
    const heroShapes = document.querySelector('.hero-background-shapes');

    function showContentAndFinalShapes() {
        mainContent.style.display = 'block';
        if (heroShapes) heroShapes.style.opacity = '1';
    }

    if (shouldShowAnimation) {
      const loader = HubLoader.create({
        videoUrl: './assets/components/hub-animation/coral_laser_line.mp4',
        duration: 12000,
        autoStart: true,
        skipOnClick: true,
        onComplete: function() {
          revealSystem.style.opacity = '1';
          revealSystem.querySelectorAll('.service-image').forEach(img => img.classList.add('reveal', 'rotating'));
          setTimeout(() => showContentAndFinalShapes(), 1000);
          setTimeout(() => { revealSystem.style.opacity = '0'; }, 2500);
        }
      });
    } else {
      revealSystem.style.display = 'none';
      showContentAndFinalShapes();
    }
    sessionStorage.setItem('hubNavigated', 'true');
  });
</script>

<script>
  document.addEventListener('mousemove', function(e) {
      const hero = document.querySelector('.hero');
      if (!hero) return;
      const rect = hero.getBoundingClientRect();
      const x = (e.clientX - rect.left - rect.width / 2) / (rect.width / 2);
      const y = (e.clientY - rect.top - rect.height / 2) / (rect.height / 2);
      
      const layers = document.querySelectorAll('.shape-layer');
      layers.forEach(layer => {
          const depth = layer.getAttribute('data-depth');
          const moveX = depth * (x * 25);
          const moveY = depth * (y * 25);
          layer.style.transform = `translate3d(${moveX}px, ${moveY}px, 0)`;
      });
  });
</script>

</body>
