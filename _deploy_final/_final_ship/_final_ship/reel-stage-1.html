<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrategyIQ™ Signal Intake | Stage 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --coral: #F96F6E;
            --teal: #2ED3C6;
            --text-muted: rgba(255, 255, 255, 0.4);
            --card-border: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: none; /* Hide cursor for recording */
        }

        .stage-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .briefing-card {
            width: 800px;
            padding: 80px;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 60px;
            transition: border-color 0.6s ease;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .label {
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .value-container {
            height: 60px;
            display: flex;
            align-items: center;
        }

        .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3rem;
            color: var(--coral);
            letter-spacing: -0.02em;
        }

        /* Typing cursor effect */
        .cursor {
            display: inline-block;
            width: 12px;
            height: 48px;
            background-color: var(--coral);
            margin-left: 8px;
            animation: blink 0.8s infinite;
            opacity: 0;
        }

        .cursor.active {
            opacity: 1;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Pulse animation */
        .briefing-card.pulse {
            animation: teal-pulse 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes teal-pulse {
            0% { border-color: var(--card-border); box-shadow: 0 0 0 rgba(46, 211, 198, 0); }
            50% { border-color: var(--teal); box-shadow: 0 0 40px rgba(46, 211, 198, 0.2); }
            100% { border-color: var(--card-border); box-shadow: 0 0 0 rgba(46, 211, 198, 0); }
        }

    </style>
</head>
<body>

    <div class="stage-container">
        <div class="briefing-card" id="mainCard">
            <div class="input-group">
                <div class="label">BUDGET REALITY</div>
                <div class="value-container">
                    <span class="value" id="budgetVal"></span>
                    <span class="cursor" id="budgetCursor"></span>
                </div>
            </div>

            <div class="input-group">
                <div class="label">TIME PRESSURE</div>
                <div class="value-container">
                    <span class="value" id="timeVal"></span>
                    <span class="cursor" id="timeCursor"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const budgetText = "$15K (B1)";
        const timeText = "<30 DAYS (P1)";
        
        const budgetEl = document.getElementById('budgetVal');
        const timeEl = document.getElementById('timeVal');
        const budgetCursor = document.getElementById('budgetCursor');
        const timeCursor = document.getElementById('timeCursor');
        const card = document.getElementById('mainCard');

        async function typeText(text, element, cursor) {
            cursor.classList.add('active');
            for (let i = 0; i < text.length; i++) {
                element.textContent += text.charAt(i);
                // Random typing speed for "human" data entry feel
                await new Promise(resolve => setTimeout(resolve, 80 + Math.random() * 100));
            }
            cursor.classList.remove('active');
        }

        async function runSequence() {
            // Wait 2 seconds as requested
            await new Promise(resolve => setTimeout(resolve, 2000));

            // Type Field 1
            await typeText(budgetText, budgetEl, budgetCursor);

            // Brief pause between fields
            await new Promise(resolve => setTimeout(resolve, 800));

            // Type Field 2
            await typeText(timeText, timeEl, timeCursor);

            // Final wait before pulse
            await new Promise(resolve => setTimeout(resolve, 1000));

            // Pulse Teal border
            card.classList.add('pulse');
        }

        window.onload = runSequence;
    </script>
</body>
</html>
