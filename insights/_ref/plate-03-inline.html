    <p class="ev-prov">This plate makes one claim: the four-part logic was already present in Nari Fateha&rsquo;s teaching before anyone named it. It did not cause the engagement&rsquo;s strategic turn, which came a week earlier and for a different reason. The language below was in use from 2023, spread across workshops, live classes, audio lessons and social posts, never presented as a model and never gathered in one place. Where an original file no longer exists, the fragment is set here as an editorial reconstruction of her wording, reviewed and approved by her before publication. Underlines are the studio&rsquo;s, added to mark what recurred.</p>
    <p class="ev-stamp">Editorial reconstruction<span>Not original documents</span><span>Reviewed with N. Fateha &middot; 15 Apr 2026</span></p>

    <div class="ev-quads">
      <div class="ev-q">
        <div class="ev-qh"><span class="ev-qn">01</span><span class="ev-qm">Aceptar</span></div>
        <p class="ev-qg">Acknowledge what is happening.</p>
        <div class="ev-f"><q>Antes de hacer algo, <b>valida la emoci&oacute;n</b>. No minimizar lo que siente.</q><span class="ev-src">Taller: Rabietas sin culpa &middot; Feb 2023</span></div>
        <div class="ev-f"><q>Est&aacute; bien sentir lo que sienten. No tenemos que arreglarlo, <b>tenemos que reconocerlo</b>.</q><span class="ev-src">Clase en vivo, IG &middot; Mar 2023</span></div>
      </div>
      <div class="ev-q">
        <div class="ev-qh"><span class="ev-qn">02</span><span class="ev-qm">Estabilizar</span></div>
        <p class="ev-qg">Lower the intensity first.</p>
        <div class="ev-f"><q>Primero calmamos el cuerpo. <b>Regular antes de corregir</b>.</q><span class="ev-src">Taller: Regulaci&oacute;n para acompa&ntilde;ar &middot; Abr 2023</span></div>
        <div class="ev-f"><q><b>Co-regulaci&oacute;n</b>: respirar juntos, bajar la intensidad para poder conectar.</q><span class="ev-src">Audioclase, Padres &middot; May 2023</span></div>
      </div>
      <div class="ev-q">
        <div class="ev-qh"><span class="ev-qn">03</span><span class="ev-qm">Conectar</span></div>
        <p class="ev-qg">Restore connection before instruction.</p>
        <div class="ev-f"><q><b>Conexi&oacute;n antes que correcci&oacute;n</b>. Siempre.</q><span class="ev-src">Post, Instagram &middot; Jun 2023</span></div>
        <div class="ev-f"><q>Ponte a su altura. M&iacute;ralo a los ojos. Escucha lo que hay detr&aacute;s de la conducta.</q><span class="ev-src">Taller: Comunicaci&oacute;n que conecta &middot; Jul 2023</span></div>
      </div>

      </div>
