<!-- ============================================================
     FIGURE A — drop-in replacement
     1. CSS  → paste before the "section break" comment in your <style>
     2. HTML → replaces the existing <figure> in section 3
     3. JS   → paste before </body>
     Static state is complete. JS only adds the reveal.
     ============================================================ -->

<!-- ---------- 1. CSS ---------- -->
<style>
.figure-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1px;
  background:var(--mist);
  border-top:1px solid var(--mist);
}
.figure-cell{
  background:var(--panel);
  padding:1.15rem 1rem 1.35rem;
  position:relative;
  border:0;
  text-align:left;
  font:inherit;
  color:inherit;
  width:100%;
  cursor:default;
}
.figure-cell .tick{
  position:absolute;top:0;left:0;height:4px;width:0;
  background:repeating-linear-gradient(90deg,
    var(--chroma) 0 3px, var(--basalt) 3px 5px,
    var(--vermilion) 5px 8px, var(--moss) 8px 10px, transparent 10px 14px);
  transition:width .18s cubic-bezier(.2,.6,.2,1);
}
.figure-cell .num{
  display:block;font-family:var(--display);font-size:1.45rem;line-height:1;
  color:var(--vermilion);margin-bottom:.55rem;
}
.figure-cell .name{
  display:block;font-family:var(--util);font-size:.68rem;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;color:var(--chroma);margin-bottom:.4rem;
}
.figure-cell .role{
  display:block;font-family:var(--util);font-size:.74rem;line-height:1.5;color:var(--basalt);
}
.figure-cell .q{
  display:block;font-family:var(--display);font-style:italic;
  font-size:.92rem;line-height:1.3;color:var(--moss);
  margin-top:.85rem;padding-top:.7rem;border-top:1px solid var(--mist);
}

/* Reveal is opt-in: only applies once JS confirms it can run. */
html.js .figure-cell .q{opacity:0;transform:translateY(4px);
  transition:opacity .18s cubic-bezier(.2,.6,.2,1),transform .18s cubic-bezier(.2,.6,.2,1);}
html.js .figure-cell:hover .q,
html.js .figure-cell:focus-visible .q,
html.js .figure-cell.is-open .q{opacity:1;transform:none;}
html.js .figure-cell:hover .tick,
html.js .figure-cell:focus-visible .tick,
html.js .figure-cell.is-open .tick{width:56px;}

@media (max-width:820px){
  .figure-grid{grid-template-columns:repeat(2,1fr);}
  html.js .figure-cell .q{opacity:1;transform:none;}
  html.js .figure-cell .tick{width:56px;}
}
@media (prefers-reduced-motion:reduce){
  html.js .figure-cell .q{opacity:1;transform:none;transition:none;}
  html.js .figure-cell .tick{width:56px;transition:none;}
}
@media print{
  .figure-cell .q{opacity:1!important;transform:none!important;}
  .figure-cell .tick{width:56px!important;}
  .fade{opacity:1!important;transform:none!important;}
}
</style>

<!-- ---------- 2. HTML ---------- -->
<figure class="plate plate--span">
  <div class="plate-window">
    <span class="plate-tag">Figure A</span>
    <span class="plate-ratio">Four parts, four questions</span>
  </div>
  <div class="figure-grid">
    <button class="figure-cell" type="button">
      <span class="tick" aria-hidden="true"></span>
      <span class="num">01</span><span class="name">Insights</span>
      <span class="role">Where the thinking happens, in public.</span>
      <span class="q">The same four shapes keep appearing. Can they be described?</span>
    </button>
    <button class="figure-cell" type="button">
      <span class="tick" aria-hidden="true"></span>
      <span class="num">02</span><span class="name">StrategyIQ</span>
      <span class="role">Where recurring thinking becomes a method.</span>
      <span class="q">Does the method hold when the work isn't mine?</span>
    </button>
    <button class="figure-cell" type="button">
      <span class="tick" aria-hidden="true"></span>
      <span class="num">03</span><span class="name">Studio</span>
      <span class="role">Where the method meets real work.</span>
      <span class="q">Where do the client and the work actually live?</span>
    </button>
    <button class="figure-cell" type="button">
      <span class="tick" aria-hidden="true"></span>
      <span class="num">04</span><span class="name">Portal</span>
      <span class="role">Where the work and the relationships live.</span>
      <span class="q">Still open.</span>
    </button>
  </div>
  <figcaption class="plate-caption"><b>Figure A &middot; The architecture.</b> Nobody planned this. Each part exists because the one before it raised a question it could not answer.</figcaption>
</figure>

<!-- ---------- 3. JS ---------- -->
<script>
document.documentElement.classList.add('js');
document.querySelectorAll('.figure-cell').forEach(function(c){
  c.addEventListener('click',function(){
    var open=c.classList.contains('is-open');
    document.querySelectorAll('.figure-cell').forEach(function(o){o.classList.remove('is-open');});
    if(!open) c.classList.add('is-open');
  });
});
</script>
