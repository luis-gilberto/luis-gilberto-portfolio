                      immediately BEFORE the print block

<!-- ---------- BLOCK A: CSS ---------- -->
<style>
/* --- badge as a normal editorial inset inside a text column --- */
.plate--incol{
  width:100%;
  margin:.3rem 0 1.15rem;
  break-inside:avoid;
  page-break-inside:avoid;
}
.plate--incol .plate-window{aspect-ratio:4/5;}

/* --- diptych: era rail below the image, not on it --- */
.era-seam{
  position:absolute;top:0;bottom:0;left:50%;width:1px;
  background:var(--panel);opacity:.7;z-index:3;pointer-events:none;
}
.era-rail{
  display:grid;grid-template-columns:1fr 1fr;
  border-top:1px solid var(--basalt);
}
.era-rail > div{padding:.75rem 1.25rem .9rem 0;}
.era-rail > div:last-child{
  padding-left:1.25rem;padding-right:0;
  border-left:1px solid var(--mist);
}
.era-yr{
  font-family:var(--util);font-size:.62rem;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:var(--moss);
  display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem;
}
.era-yr::before{content:"";width:22px;height:2px;background:var(--chroma);flex:0 0 auto;}
.era-rail > div:last-child .era-yr::before{background:var(--vermilion);}
.era-yr b{font-family:var(--display);font-size:.94rem;letter-spacing:.06em;color:var(--basalt);}
.era-rl{
  font-family:var(--util);font-size:.72rem;line-height:1.55;
  color:var(--moss);max-width:40ch;
}
@media (max-width:640px){
  .era-rail{grid-template-columns:1fr;}
  .era-rail > div{padding:.7rem 0 .8rem;}
  .era-rail > div:last-child{padding-left:0;border-left:0;border-top:1px solid var(--mist);}
}
@media print{
  .era-rail{grid-template-columns:1fr 1fr;}
}
</style>
