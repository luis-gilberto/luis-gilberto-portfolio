<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG · What I Built After Microsoft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=EB+Garamond:ital,wght@0,400;1,400&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #E7E9E4;
  }
  .card {
    width: 1200px;
    height: 630px;
    display: grid;
    grid-template-columns: 7px 1fr 420px;
    background: #E7E9E4;
    color: #15181A;
    position: relative;
  }
  .spine {
    background: repeating-linear-gradient(
      180deg,
      #2438C8 0 14px,
      #15181A 14px 22px,
      #D8402A 22px 36px,
      #4C6155 36px 44px
    );
  }
  .main {
    padding: 44px 52px 40px 44px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-width: 0;
    border-right: 1px solid #C6CCC4;
  }
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid #15181A;
    padding-bottom: 10px;
    margin-bottom: 28px;
  }
  .wordmark {
    font-family: "Bodoni Moda", Georgia, serif;
    font-size: 28px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    line-height: 1;
  }
  .issue {
    font-family: "Archivo", Arial, sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #4C6155;
    text-align: right;
    line-height: 1.5;
  }
  .eyebrow {
    font-family: "Archivo", Arial, sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #2438C8;
    margin-bottom: 14px;
  }
  h1 {
    font-family: "Bodoni Moda", Georgia, serif;
    font-weight: 400;
    font-size: 72px;
    line-height: 0.9;
    letter-spacing: -0.03em;
    max-width: 11ch;
    margin-bottom: 22px;
  }
  h1 em {
    font-style: italic;
    color: #2438C8;
  }
  .deck {
    font-family: "EB Garamond", Georgia, serif;
    font-style: italic;
    font-size: 22px;
    line-height: 1.42;
    max-width: 34ch;
    margin-bottom: 24px;
  }
  .kinetic {
    width: 118px;
    height: 7px;
    background: repeating-linear-gradient(
      90deg,
      #2438C8 0 3px,
      #15181A 3px 5px,
      #D8402A 5px 8px,
      #4C6155 8px 10px,
      transparent 10px 14px
    );
    margin-bottom: 16px;
  }
  .byline {
    font-family: "Archivo", Arial, sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: #4C6155;
  }
  .byline b { color: #15181A; font-weight: 600; }
  .photo {
    position: relative;
    overflow: hidden;
    background: #15181A;
  }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 42%;
    display: block;
  }
  .photo::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(231,233,228,0.92) 0%, rgba(231,233,228,0.08) 22%, transparent 42%);
    pointer-events: none;
  }
  .folio {
    position: absolute;
    bottom: 28px;
    right: 36px;
    font-family: "Bodoni Moda", Georgia, serif;
    font-size: 18px;
    color: #D8402A;
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="spine" aria-hidden="true"></div>
    <div class="main">
      <div>
        <div class="masthead">
          <div class="wordmark">Insights</div>
          <div class="issue">The Building Series<br>No. 01 &middot; Seattle &middot; 2026</div>
        </div>
        <div class="eyebrow">A Personal Essay</div>
        <h1>What I Built <em>After</em> Microsoft</h1>
        <p class="deck">I thought I was building a website. It turned into a practice, a product, and a late education in what I am actually for.</p>
      </div>
      <div>
        <div class="kinetic" aria-hidden="true"></div>
        <p class="byline"><b>Luis Gilberto S&aacute;nchez</b> &nbsp;&middot;&nbsp; Plates by LG Studio</p>
      </div>
    </div>
    <div class="photo">
      <img
        src="https://res.cloudinary.com/dogtoagya/image/upload/f_auto,q_auto,c_fill,g_auto,w_840,h_1260/v1787620115/ots_EL_Estudio_screen_LS_wr9i8o.png"
        width="840"
        height="1260"
        alt="">
      <span class="folio">01</span>
    </div>
  </div>
</body>
</html>
