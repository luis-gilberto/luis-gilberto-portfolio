<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} | Luis Gilberto</title>
    <meta name="description" content="{{description}}">
    <meta name="author" content="Luis Gilberto">
    <meta name="robots" content="index,follow">
    <meta name="googlebot" content="index,follow">
    <meta name="article:published_time" content="{{published_date}}">
    <meta name="article:author" content="Luis Gilberto">
    <meta name="article:section" content="Insights">
    <meta name="keywords" content="{{keywords}}">
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Article",
        "headline": "{{title}}",
        "description": "{{description}}",
        "author": {
            "@type": "Person",
            "name": "Luis Gilberto",
            "url": "https://luis-gilberto.com"
        },
        "publisher": {
            "@type": "Person",
            "name": "Luis Gilberto",
            "url": "https://luis-gilberto.com"
        },
        "datePublished": "{{published_date}}",
        "dateModified": "{{modified_date}}",
        "url": "https://luis-gilberto.com/insights/{{slug}}/",
        "image": "{{og_image}}",
        "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": "https://luis-gilberto.com/insights/{{slug}}/"
        },
        "articleSection": "Insights",
        "keywords": {{keywords_array}}
    }
    </script>
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://luisgilberto.com/insights/{{slug}}/">
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:image" content="{{og_image}}">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://luisgilberto.com/insights/{{slug}}/">
    <meta property="twitter:title" content="{{title}}">
    <meta property="twitter:description" content="{{description}}">
    <meta property="twitter:image" content="{{og_image}}">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/insights/assets/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/insights/assets/icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/insights/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/insights/assets/icons/favicon-64x64.png">
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    
    <!-- Theme Styles -->
    <link rel="stylesheet" href="/insights/assets/css/theme.css">
    
    <!-- Article Styles -->
    <link rel="stylesheet" href="/insights/assets/css/article.css">
    
    <!-- Custom Styles -->
    {{custom_styles}}
</head>
<body>
    <!-- Theme Toggle Button -->
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Switch theme">
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M12 3a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V4a1 1 0 0 1 1-1zm0 15a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0v-1a1 1 0 0 1 1-1zm9-9a1 1 0 0 1-1 1h-1a1 1 0 1 1 0-2h1a1 1 0 0 1 1 1zM4 12a1 1 0 0 1-1 1H2a1 1 0 1 1 0-2h1a1 1 0 0 1 1 1zm15.7-7.3a1 1 0 0 1 0 1.4l-.7.7a1 1 0 1 1-1.4-1.4l.7-.7a1 1 0 0 1 1.4 0zM5.3 19.7a1 1 0 0 1 0-1.4l.7-.7a1 1 0 1 1 1.4 1.4l-.7.7a1 1 0 0 1-1.4 0zm14.4 0a1 1 0 0 1-1.4 0l-.7-.7a1 1 0 1 1 1.4-1.4l.7.7a1 1 0 0 1 0 1.4zM5.3 4.3a1 1 0 0 1 1.4 0l.7.7a1 1 0 1 1-1.4 1.4l-.7-.7a1 1 0 0 1 0-1.4zM12 6a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/>
        </svg>
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446A9 9 0 1 1 12 2.992z"/>
        </svg>
        <span class="theme-label">Theme</span>
    </button>

    <!-- Brand Header -->
    <a href="/insights" class="brand-header">
        <img src="/insights/assets/icons/favicon-64x64.png" alt="Luis Gilberto Logo" class="brand-logo">
    </a>

    <!-- Article Content -->
    {{content}}

    <!-- Theme Script -->
    <script src="/insights/assets/js/theme.js"></script>
    
    <!-- Custom Scripts -->
    {{custom_scripts}}
</body>
</html>
