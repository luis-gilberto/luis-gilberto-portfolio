ative;transition:color 0.2s ease}.lg-nav-link:hover,.lg-main-nav a:hover{color:var(--coral-accent)}.lg-nav-link::after,.lg-main-nav a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;border-radius:999px;background:var(--coral-accent);transform:scaleX(0);transform-origin:left;transition:transform 0.2s ease}.lg-nav-link:hover::after,.lg-nav-link.is-active::after,.lg-main-nav a:hover::after,.lg-main-nav a.is-active::after{transform:scaleX(1)}.lg-nav-toggle,.lg-nav-close,.lg-nav-overlay{display:none}.lg-site-header.is-scrolled{box-shadow:0 2px 6px var(--shadow-color)}@media (max-width:1024px){.lg-site-header-inner{padding:0 1.5rem;height:56px}.lg-main-nav{position:fixed;inset:0;padding-top:88px;padding-left:48px;padding-right:24px;background:#111111;display:none;flex-direction:column;gap:28px;z-index:200;opacity:0;transform:translateY(-2%);transition:opacity 0.25s ease,transform 0.25s ease;text-align:left}.lg-site-header.is-open .lg-main-nav{display:flex;opacity:1;transform:translateY(0)}.lg-nav-link,.lg-main-nav a{color:#FFFFFF;font-family:'Big Shoulders Display',sans-serif;font-size:32px;font-weight:800;letter-spacing:0.02em;text-decoration:none;min-height:48px;line-height:1.2;padding:4px 0;transition:color 0.2s ease}.lg-nav-link:hover,.lg-main-nav a:hover{color:#EDEDED}.lg-nav-toggle{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:12px;border:1px solid var(--border-color);background:var(--card-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:relative;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);box-shadow:0 1px 3px var(--shadow-color)}.lg-nav-toggle:hover{background:var(--coral-light);border-color:var(--coral-accent);transform:translateY(-1px)}.lg-nav-toggle:focus-visible{outline:3px solid var(--coral-accent);outline-offset:2px}.lg-nav-toggle-bar{position:absolute;left:50%;width:20px;height:2px;background:#1a1a1a!important;border-radius:2px;transform:translateX(-50%);transition:all 0.3s cubic-bezier(0.4,0,0.2,1)}.lg-nav-toggle-bar:nth-child(1){top:calc(50% - 7px)}.lg-nav-toggle-bar:nth-child(2){top:calc(50% - 1px)}.lg-nav-toggle-bar:nth-child(3){top:calc(50% + 5px)}.lg-site-header.is-open .lg-nav-toggle{background:var(--coral-light);border-color:var(--coral-accent)}.lg-site-header.is-open .lg-nav-toggle-bar{background:var(--coral-accent)}.lg-site-header.is-open .lg-nav-toggle-bar:nth-child(1){top:50%;transform:translate(-50%,-50%) rotate(45deg)}.lg-site-header.is-open .lg-nav-toggle-bar:nth-child(2){opacity:0;transform:translateX(-50%) scaleX(0)}.lg-site-header.is-open .lg-nav-toggle-bar:nth-child(3){top:50%;transform:translate(-50%,-50%) rotate(-45deg)}.lg-nav-close{position:absolute;top:32px;right:32px;width:44px;height:44px;border:none;background:transparent;cursor:pointer;display:none;align-items:center;justify-content:center;border-radius:50%;transition:background 0.2s ease;z-index:10}.lg-site-header.is-open .lg-nav-close{display:inline-flex}.lg-nav-close-bar{position:absolute;width:20px;height:2px;background:#FFFFFF;border-radius:2px}.lg-nav-close-bar:nth-child(1){transform:rotate(45deg)}.lg-nav-close-bar:nth-child(2){transform:rotate(-45deg)}.lg-nav-close:hover{background:rgba(255,255,255,0.1)}.lg-nav-close:hover .lg-nav-close-bar{background:var(--coral-accent)}.lg-nav-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity 0.3s ease;z-index:199}.lg-site-header.is-open .lg-nav-overlay{display:block;opacity:1;pointer-events:auto}}footer{padding:3rem 0;border-top:1px solid var(--border-gray);background:var(--bg-secondary)}.footer-text{text-align:center;color:var(--text-secondary);margin-bottom:1.5rem}.footer-links{display:flex;justify-content:center;gap:2rem}.footer-link{color:var(--text-secondary);text-decoration:none;font-size:0.9rem;transition:color 0.3s ease}.footer-link:hover{color:var(--coral-accent)}.page-header{text-align:center;padding:4rem 0 2rem 0;border-bottom:2px solid var(--text-primary);margin-bottom:3rem}.page-title{font-family:var(--font-display);font-size:clamp(2rem,5vw,3rem);font-weight:700;color:var(--text-primary);margin-bottom:1rem}.page-subtitle{font-size:1.2rem;color:var(--text-secondary);max-width:600px;margin:0 auto}.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2rem;margin-top:2rem;padding:2rem 0}.topic-card{background:var(--card-bg);border-radius:16px;padding:2rem;box-shadow:var(--shadow-standard);transition:all 0.3s ease}.topic-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-coral)}.topic-title{font-family:var(--font-display);font-size:1.5rem;font-weight:700;margin-bottom:1rem;color:var(--text-primary)}.topic-links{display:flex;flex-direction:column;gap:0.75rem}.topic-links a{text-decoration:none;color:var(--text-secondary);font-size:0.95rem;transition:all 0.2s ease;padding-left:1rem;position:relative}.topic-links a::before{content:'→';position:absolute;left:0;color:var(--coral-accent);opacity:0;transition:opacity 0.2s ease}.topic-links a:hover{color:var(--coral-accent);padding-left:1.5rem}.topic-links a:hover::before{opacity:1}
    </style>

</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">

    <style>
      .insights-subnav{display:flex;gap:16px;align-items:center;justify-content:center;height:48px;background:var(--nav-bg);border-bottom:1px solid var(--border-gray);position:sticky;top:64px;z-index:999}

    <main class="container" style="padding:4rem 1rem;max-width:1200px;margin:0 auto;">
        <header class="page-header">
            <h1 class="page-title">Browse by Topic</h1>
            <p class="page-subtitle">Explore insights organized by theme and subject matter</p>
        </header>
        <div class="topic-grid" id="topics-page-content"></div>

            <p class="footer-text">© 2025 Luis Gilberto. All rights reserved.</p>
            <div class="footer-links">
                <a href=" `https://luis-gilberto.com/` " class="footer-link">Home</a>
                <a href=" `https://luis-gilberto.com/about` " class="footer-link">About</a>
                <a href=" `https://luis-gilberto.com/contact` " class="footer-link">Contact</a>
            </div>
        </div>
    </footer>
    <script>
(function(){var target=document.getElementById('topics-page-content');fetch('/insights/data/articles-metadata.json').then(r=>r.json()).then(function(items){var map=new Map();items.forEach(function(a){(a.topics||[]).forEach(function(t){if(!map.has(t))map.set(t,[]);map.get(t).push(a)})});var keys=Array.from(map.keys()).sort();var html='';keys.forEach(function(t){var links=(map.get(t)||[]).sort(function(a,b){return new Date(b.publishDate)-new Date(a.publishDate)}).map(function(a){return '<a href="'+a.url+'">'+a.title+'</a>'}).join('');html+='<div class="topic-card"><div class="topic-title">'+t+'</div><div class="topic-links">'+links+'</div></div>'});target.innerHTML=html})})();
const themeToggle=document.getElementById('themeToggle');const html=document.documentElement;const currentTheme=localStorage.getItem('theme')||'light';html.setAttribute('data-theme',currentTheme);if(themeToggle){themeToggle.addEventListener('click',()=>{const newTheme=html.getAttribute('data-theme')==='light'?'dark':'light';html.setAttribute('data-theme',newTheme);localStorage.setItem('theme',newTheme)})}
    </script>

    <!-- Strict nav script for drawer -->
    <script>
document.addEventListener('DOMContentLoaded', function() {
  const toggle = document.getElementById('mobileToggle');
  const drawer = document.getElementById('insightsDrawer');
  const overlay = document.getElementById('drawerOverlay');
  const closeBtn = document.getElementById('drawerClose');

  function openMenu() {
    if(!drawer || !overlay) return;
    drawer.classList.add('is-open');
    overlay.classList.add('is-visible');
    if(toggle) toggle.setAttribute('aria-expanded', 'true');
    drawer.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeMenu() {
    if(!drawer || !overlay) return;
    drawer.classList.remove('is-open');
    overlay.classList.remove('is-visible');
    if(toggle) toggle.setAttribute('aria-expanded', 'false');
    drawer.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  if(toggle) toggle.addEventListener('click', openMenu);
  if(closeBtn) closeBtn.addEventListener('click', closeMenu);
  if(overlay) overlay.addEventListener('click', closeMenu);

  const currentPath = window.location.pathname.replace(/\/$/, "");
  const drawerLinks = document.querySelectorAll('.drawer-content .nav-link');
  drawerLinks.forEach(link => {
    const linkHref = (link.getAttribute('href') || '').replace(/\/$/, "");
    if (linkHref === currentPath) {
      link.classList.add('is-active');
    } else if (linkHref.length > 10 && currentPath.startsWith(linkHref)) {
      link.classList.add('is-active');
    }
  });
});
    </script>
</body>
