<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Series | Insights by Luis Gilberto</title>
  <link rel="icon" type="image/png" href="/insights/assets/icons/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/insights/assets/css/insights-navigation.css">
  
  <style>
    /* VARIABLES */
    :root{--primary-black:#000000;--accent-gray:#1a1a1a;--light-gray:#f5f5f5;--border-gray:#e5e5e5;--text-secondary:#666666;--coral-accent:#F96F6E;--coral-light:rgba(249,111,110,0.1);--coral-medium:rgba(249,111,110,0.3);--teal-accent:#2ED3C6;--font-base:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,'Inter',sans-serif;--font-display:'Playfair Display',serif;--font-serif:'Playfair Display',Georgia,'Times New Roman',serif;--transition-base:.3s ease;--shadow-coral:0 10px 30px rgba(249,111,110,0.2);--shadow-standard:0 8px 25px rgba(26,26,26,0.1);--bg-primary:#F4F1ED;--bg-secondary:#EAE6E1;--bg-gradient:linear-gradient(135deg,#F4F1ED 0%,#EAE6E1 100%);--text-primary:#1a1a1a;--text-muted:rgba(26,26,26,0.6);--border-color:rgba(249,111,110,0.2);--nav-bg:rgba(255,255,255,0.9)}[data-theme="dark"]{--bg-primary:#1a1a1a;--bg-secondary:#2a2a2a;--bg-gradient:linear-gradient(135deg,#1a1a1a 0%,#2a2a2a 100%);--text-primary:#ffffff;--text-secondary:rgba(255,255,255,0.8);--text-muted:rgba(255,255,255,0.6);--border-color:rgba(249,111,110,0.2);--shadow-coral:0 10px 30px rgba(0,0,0,0.25);--nav-bg:rgba(26,26,26,0.9)}*{margin:0;padding:0;box-sizing:border-box}body{font-family:var(--font-base);line-height:1.7;color:var(--text-primary);background:var(--bg-gradient);font-size:16px;overflow-x:hidden}h1{font-family:var(--font-display);font-size:clamp(2rem,8vw,4rem);font-weight:700;line-height:1.1;letter-spacing:-0.02em;margin-bottom:.5rem}h2{font-family:var(--font-display);font-size:clamp(1.5rem,6vw,2rem);font-weight:600;margin:2rem 0 1rem}p{font-size:1rem;color:var(--text-secondary)}.top-accent{height:6px;background:var(--coral-accent)}.lg-site-header{height:64px;background:#fff;border-bottom:1px solid var(--border-gray);position:sticky;top:0;z-index:1000}.lg-site-header-inner{max-width:1400px;margin:0 auto;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px}.insights-subnav{display:flex;gap:16px;align-items:center;justify-content:center;height:48px;background:var(--nav-bg);border-bottom:1px solid var(--border-gray);position:sticky;top:64px;z-index:999}.insights-subnav .subnav-link{display:inline-block;text-decoration:none;color:var(--text-secondary);padding:8px 12px;border-radius:8px;border:1px solid transparent;transition:color .2s ease,border-color .2s ease}.insights-subnav .subnav-link:hover,.insights-subnav .subnav-link.is-active{color:var(--coral-accent);border-color:var(--coral-accent)}@media (max-width:1024px){.insights-subnav{display:none}}.page-header{text-align:center;padding:4rem 0 2rem;border-bottom:2px solid var(--text-primary);margin-bottom:2rem}.page-title{font-family:var(--font-display);font-size:clamp(2rem,5vw,3rem)}.page-subtitle{font-size:1.1rem;color:var(--text-secondary);max-width:600px;margin:0 auto}.series-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2rem;padding:2rem 0}.series-card{background:var(--nav-bg);border-radius:16px;padding:1.5rem;box-shadow:var(--shadow-standard);transition:transform .2s ease, box-shadow .2s ease;border:1px solid var(--border-color)}.series-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-coral)}.series-title{font-family:var(--font-display);font-size:1.4rem;font-weight:700;margin-bottom:.75rem}.series-links{display:flex;flex-direction:column;gap:.5rem}.series-links a{text-decoration:none;color:var(--text-secondary);padding-left:1rem;position:relative;transition:color .2s ease, padding-left .2s ease}.series-links a::before{content:'→';position:absolute;left:0;color:var(--coral-accent);opacity:0;transition:opacity .2s ease}.series-links a:hover{color:var(--coral-accent);padding-left:1.5rem}.series-links a:hover::before{opacity:1}.loading{text-align:center;color:var(--text-secondary);padding:2rem}.empty{color:var(--text-secondary);font-style:italic}
    
    .lg-main-nav{display:inline-flex;align-items:center;gap:32px}
    .lg-nav-link{color:#1a1a1a!important;text-decoration:none;font-size:14px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;position:relative;transition:color .2s ease}
    .lg-nav-link:hover{color:var(--coral-accent)}
    .lg-nav-link::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;border-radius:999px;background:var(--coral-accent);transform:scaleX(0);transform-origin:left;transition:transform .2s ease}
    .lg-nav-link:hover::after,.lg-nav-link.is-active::after{transform:scaleX(1)}
    
    .lg-logo-img{width:120px;height:auto;display:block}

    /* BURGER BUTTON STYLES */
    .lg-nav-toggle{display:none;}
    @media (max-width:1024px){
      .lg-main-nav{display:none!important}
      .lg-nav-toggle{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:12px;border:1px solid var(--border-color);background:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:relative;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:0 1px 3px var(--shadow-standard);z-index:1001}
      .lg-nav-toggle:hover{background:var(--coral-light);border-color:var(--coral-accent);transform:translateY(-1px)}
      .lg-nav-toggle:focus-visible{outline:3px solid var(--coral-accent);outline-offset:2px}
      .lg-nav-toggle-bar{position:absolute;left:50%;width:20px;height:2px;background:#1a1a1a;border-radius:2px;transform:translateX(-50%);transition:all .3s cubic-bezier(.4,0,.2,1)}
      .lg-nav-toggle-bar:nth-child(1){top:calc(50% - 7px)}
      .lg-nav-toggle-bar:nth-child(2){top:calc(50% - 1px)}
      .lg-nav-toggle-bar:nth-child(3){top:calc(50% + 5px)}
    }

    /* DRAWER STYLES */
    .insights-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 300px;
      max-width: 80vw;
      background: #ffffff;
      z-index: 2000;
      box-shadow: -5px 0 25px rgba(0,0,0,0.15);
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }
    .insights-drawer.is-open { transform: translateX(0); }
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1999;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .drawer-overlay.is-visible { opacity: 1; pointer-events: auto; }
    .drawer-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border-gray);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer-brand { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; }
    .drawer-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 0.5rem;
    }
    .drawer-close:hover { color: var(--coral-accent); }
    .drawer-content { padding: 1.5rem; overflow-y: auto; }
    .drawer-section { margin-bottom: 2rem; }
    .section-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      margin-bottom: 1rem;
      font-weight: 600;
    }
    .drawer-section .nav-link {
      display: block;
      padding: 0.5rem 0;
      text-decoration: none;
      color: var(--text-primary);
      font-size: 1.1rem;
      border-bottom: 1px solid transparent;
      transition: color 0.2s;
    }
    .drawer-section .nav-link:hover { color: var(--coral-accent); }
    /* Active state for drawer links */
    .drawer-section .nav-link.is-active { color: var(--coral-accent); font-weight: 600; }
  </style>
</head>
<body>
  <div class="top-accent"></div>
  <header class="lg-site-header" role="banner">
    <div class="lg-site-header-inner">
      <a href="/insights" class="lg-logo" aria-label="Insights">
        <img src="/insights/assets/images/insights_logo_light.svg" alt="Insights" class="lg-logo-img">
      </a>
      <nav class="lg-main-nav" id="lgMainNav" aria-label="Main navigation">
        <a href="/" class="lg-nav-link">Portfolio</a>
        <a href="/insights" class="lg-nav-link is-active">Insights</a>
        <a href="/TheHub/" class="lg-nav-link">The Hub</a>
      </nav>
      <button class="lg-nav-toggle" id="mobileToggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="insightsDrawer">
        <span class="lg-nav-toggle-bar"></span><span class="lg-nav-toggle-bar"></span><span class="lg-nav-toggle-bar"></span>
      </button>
    </div>
  </header>
  <nav class="insights-subnav" id="insightsSubnav" aria-label="Insights subnavigation">
    <a href="/insights/" class="subnav-link">Latest</a>
    <a href="/insights/series/" class="subnav-link is-active">Series</a>
    <a href="/insights/topics/" class="subnav-link">Topics</a>
  </nav>

  <div id="drawerOverlay" class="drawer-overlay"></div>
  
  <aside id="insightsDrawer" class="insights-drawer" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="drawer-header">
      <div class="drawer-brand">Insights</div>
      <button id="drawerClose" class="drawer-close" aria-label="Close">✕</button>
    </div>
    <div class="drawer-content">
      <!-- 1. GLOBAL NAVIGATION -->
      <nav class="drawer-section">
        <div class="section-label">Global</div>
        <a class="nav-link" href="/">Portfolio</a>
        <a class="nav-link" href="/insights/">Insights</a>
        <a class="nav-link" href="/TheHub/">The Hub</a>
      </nav>

      <!-- 2. INSIGHTS NAVIGATION (The part that was missing/broken) -->
      <nav class="drawer-section">
        <div class="section-label">Browse Insights</div>
        <a class="nav-link" href="/insights/">Latest</a>
        <a class="nav-link" href="/insights/series/">Series</a>
        <a class="nav-link" href="/insights/topics/">Topics</a>
      </nav>
    </div>
  </aside>

  <main class="container" style="padding:4rem 1rem;max-width:1200px;margin:0 auto;">
    <header class="page-header">
      <h1 class="page-title">Browse by Series</h1>
      <p class="page-subtitle">Explore the Building Series (by sub-group), Use Cases, and Reflections</p>
    </header>
    <div class="series-grid" id="series-page-content">
      <div class="loading" id="seriesLoading">Loading series…</div>
    </div>
  </main>

  <!-- CONTENT LOADER SCRIPT (Kept as is) -->
  <script>
    (function(){
      var target=document.getElementById('series-page-content');
      var loader=document.getElementById('seriesLoading');
      function group(items){var g={Building:{Hub:[],Insights:[],Portfolio:[]},UseCases:[],Reflections:[]};items.forEach(function(a){if(a.series==='Building Series'){var key=a.seriesSlug==='building-the-hub'?'Hub':a.seriesSlug==='building-insights'?'Insights':a.seriesSlug==='building-portfolio'?'Portfolio':null;if(key)g.Building[key].push(a)}else if(a.series==='Use Cases'){g.UseCases.push(a)}else if(a.series==='Reflections'){g.Reflections.push(a)}});function sort(arr){arr.sort(function(a,b){return new Date(b.publishDate)-new Date(a.publishDate)})}Object.keys(g.Building).forEach(function(k){sort(g.Building[k])});sort(g.UseCases);sort(g.Reflections);return g}
      function card(label,arr){if(!arr.length)return '<div class="series-card empty">No articles in '+label+'</div>';var links=arr.map(function(a){return '<a href="'+a.url+'">'+a.title+'</a>'}).join('');return '<div class="series-card"><div class="series-title">'+label+'</div><div class="series-links">'+links+'</div></div>'}
      fetch('/insights/data/articles-metadata.json').then(function(r){return r.json()}).then(function(items){var g=group(items);var html='';html+=card('Building • The Hub',g.Building.Hub);html+=card('Building • Insights',g.Building.Insights);html+=card('Building • Portfolio',g.Building.Portfolio);html+=card('Use Cases',g.UseCases);html+=card('Reflections',g.Reflections);if(loader) loader.remove();target.innerHTML=html;}).catch(function(){if(loader) loader.textContent='Unable to load series at the moment.'});
    })();
  </script>

  <!-- NAVIGATION & DRAWER SCRIPT (strict matching) -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const toggle = document.getElementById('mobileToggle');
      const drawer = document.getElementById('insightsDrawer');
      const overlay = document.getElementById('drawerOverlay');
      const closeBtn = document.getElementById('drawerClose');

      function openMenu() {
        if(!drawer || !overlay) return;
        drawer.classList.add('is-open');
        overlay.classList.add('is-visible');
        if(toggle) toggle.setAttribute('aria-expanded', 'true');
        drawer.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }

      function closeMenu() {
        if(!drawer || !overlay) return;
        drawer.classList.remove('is-open');
        overlay.classList.remove('is-visible');
        if(toggle) toggle.setAttribute('aria-expanded', 'false');
        drawer.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      if(toggle) toggle.addEventListener('click', openMenu);
      if(closeBtn) closeBtn.addEventListener('click', closeMenu);
      if(overlay) overlay.addEventListener('click', closeMenu);

      const currentPath = window.location.pathname.replace(/\/$/, "");
      const drawerLinks = document.querySelectorAll('.drawer-content .nav-link');
      drawerLinks.forEach(link => {
        const linkHref = (link.getAttribute('href') || '').replace(/\/$/, "");
        if (linkHref === currentPath) {
          link.classList.add('is-active');
        } else if (linkHref.length > 10 && currentPath.startsWith(linkHref)) {
          link.classList.add('is-active');
        }
      });
    });
  </script>
</body>
</html>
