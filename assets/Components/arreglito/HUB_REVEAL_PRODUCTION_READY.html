     ✅ No blur overlay

     INSTRUCTIONS:

     2. DELETE everything from <!-- Hub Reveal System --> to </div>
     3. PASTE this entire block in its place
     4. Make sure there are NO other Hub Reveal System blocks in the HTML
     5. Save and test

<!-- Hub Reveal System -->
<div class="hub-reveal-system" id="hubRevealSystem">
    <!-- Energy burst from rectangles -->
    <div class="energy-burst">
        <div class="energy-rect energy-rect-outer"></div>
        <div class="energy-rect energy-rect-inner"></div>
    </div>
    
    <!-- Service images - CORRECT MAPPINGS -->
    <!-- Advisory = Compass (coral) -->
    <div class="service-image service-advisory">
        <img src="/TheHub/assets/icons/floating-shapes/compass_rose_coral.png" alt="Advisory - Compass">
    </div>
    
    <!-- IMC Services = Atom (teal) -->
    <div class="service-image service-imc">
        <img src="/TheHub/assets/icons/floating-shapes/atom_model_teal.png" alt="IMC Services - Atom">
    </div>
    
    <!-- ScopeIQ = Telescope (coral) -->
    <div class="service-image service-scope">
        <img src="/TheHub/assets/icons/floating-shapes/telescope_coral.png" alt="ScopeIQ - Telescope">
    </div>
    
    <!-- StrategyIQ = Chess Queen (teal) -->
    <div class="service-image service-strategy">
        <img src="/TheHub/assets/icons/floating-shapes/chess_queen_teal.png" alt="StrategyIQ - Chess Queen">
    </div>
</div>

<style>
/* ============================================================================
   HUB REVEAL SYSTEM CSS - PRODUCTION READY
   
   Place this in the <style> section or replace existing Hub Reveal CSS
   ============================================================================ */

.hub-reveal-system {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    background: transparent;        /* NO BLUR BACKGROUND */
    backdrop-filter: none;          /* NO BLUR FILTER */
    transition: opacity 0.3s ease-out;
}

.hub-reveal-system.active {
    opacity: 1;
}

/* Energy Burst Container */
.energy-burst {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 450px;
}

/* Two Rectangles for Energy Release */
.energy-rect {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border: 3px solid #F96F6E;
    border-radius: 4px;
    box-shadow: 
        0 0 30px rgba(249, 111, 110, 0.5),
        inset 0 0 30px rgba(249, 111, 110, 0.3);
    opacity: 0;
    transition: all 1.2s cubic-bezier(0.4, 0.0, 0.2, 1);
}

.energy-rect-outer {
    width: 100%;
    height: 100%;
}

.energy-rect-inner {
    width: 70%;
    height: 70%;
}

/* Expand animation - Rectangles burst outward */
.hub-reveal-system.bursting .energy-rect-outer {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.5);
    box-shadow: 
        0 0 60px rgba(249, 111, 110, 0.2),
        inset 0 0 60px rgba(249, 111, 110, 0.1);
}

.hub-reveal-system.bursting .energy-rect-inner {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.8);
    box-shadow: 
        0 0 60px rgba(249, 111, 110, 0.2),
        inset 0 0 60px rgba(249, 111, 110, 0.1);
}

/* Fade animation - Rectangles dissolve */
.hub-reveal-system.fading .energy-rect {
    opacity: 0;
    transform: translate(-50%, -50%) scale(2.2);
}

/* Service Images */
.service-image {
    position: fixed;
    width: 300px;
    height: 300px;
    opacity: 0;
    transform-origin: center;
    pointer-events: none;
    z-index: 0;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0) rotate(0deg);
    transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.service-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* Coral images get coral glow (Advisory, ScopeIQ) */
.service-advisory img,
.service-scope img {
    filter: drop-shadow(0 0 30px rgba(249, 111, 110, 0.4));
}

/* Teal images get teal glow (IMC Services, StrategyIQ) */
.service-imc img,
.service-strategy img {
    filter: drop-shadow(0 0 30px rgba(46, 211, 198, 0.4));
}

/* Reveal to corners - Staggered timing for elegant cascade */
/* Advisory (Compass) - Top Left */
.service-advisory.reveal {
    top: 12%;
    left: 12%;
    opacity: 0.15;
    transform: translate(-50%, -50%) scale(1) rotate(0deg);
    transition-delay: 0s;
}

/* IMC Services (Atom) - Top Right */
.service-imc.reveal {
    top: 12%;
    left: 88%;
    opacity: 0.15;
    transform: translate(-50%, -50%) scale(1) rotate(0deg);
    transition-delay: 0.15s;
}

/* ScopeIQ (Telescope) - Bottom Left */
.service-scope.reveal {
    top: 88%;
    left: 12%;
    opacity: 0.15;
    transform: translate(-50%, -50%) scale(1) rotate(0deg);
    transition-delay: 0.3s;
}

/* StrategyIQ (Chess Queen) - Bottom Right */
.service-strategy.reveal {
    top: 88%;
    left: 88%;
    opacity: 0.15;
    transform: translate(-50%, -50%) scale(1) rotate(0deg);
    transition-delay: 0.45s;
}

/* Gentle rotation - 360° every 20 seconds */
.service-image.rotating {
    animation: hubServiceRotate 20s linear infinite;
}

@keyframes hubServiceRotate {
    0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    100% { transform: translate(-50%, -50%) scale(1) rotate(360deg); }
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .service-image {
        width: 200px;
        height: 200px;
    }
    
    .energy-burst {
        width: 90%;
        height: 350px;
    }
}

/* Respect reduced motion preferences */
@media (prefers-reduced-motion: reduce) {
    .service-image.rotating {
        animation: none;
    }
    
    .energy-rect,
    .service-image {
        transition-duration: 0.01ms;
    }
}
</style>

<!-- ============================================================================
     JAVASCRIPT - Hub Reveal Animation Trigger
     
     This should already exist in your HTML. If not, add it.
     Make sure it's inside the DOMContentLoaded event listener.
     ============================================================================ -->
<script>
// This code should already be in your HTML
// Included here for reference only - DO NOT DUPLICATE

// Inside the onComplete function of HubLoader.create():
// Trigger Hub reveal animation
const revealSystem = document.getElementById('hubRevealSystem');
const serviceImages = document.querySelectorAll('.service-image');

if (revealSystem) {
    // Phase 1: Activate system & burst rectangles (0.2s)
    setTimeout(() => {
        revealSystem.classList.add('active');
        revealSystem.classList.add('bursting');
    }, 200);
    
    // Phase 2: Reveal service images (0.5s)
    setTimeout(() => {
        serviceImages.forEach(img => {
            img.classList.add('reveal');
        });
    }, 500);
    
    // Phase 3: Fade rectangles (1.2s)
    setTimeout(() => {
        revealSystem.classList.add('fading');
    }, 1200);
    
    // Phase 4: Start rotation (2.0s)
    setTimeout(() => {
        serviceImages.forEach(img => {
            img.classList.add('rotating');
        });
    }, 2000);
}
</script>
