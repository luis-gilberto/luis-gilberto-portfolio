<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thesis Section - Final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Anton&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #050506; }
  [data-theme="light"] body { background: #F5F3EE; }

  .dev-toggle {
    position: fixed; top: 1rem; right: 1rem; z-index: 9999;
    padding: 8px 16px; background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px; cursor: pointer; font-family: system-ui, sans-serif;
    font-size: 12px; letter-spacing: 0.04em; backdrop-filter: blur(8px);
    transition: all 0.3s ease;
  }
  .dev-toggle:hover { background: rgba(255,255,255,0.12); }
  [data-theme="light"] .dev-toggle {
    color: #333; background: rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.12);
  }

  :root {
    --tm-base:        #0A0A0C;
    --tm-text:        #FAFAFA;
    --tm-ghost:       rgba(255, 255, 255, 0.042);
    --tm-teal:        #2ED3C6;
    --tm-teal-glow:   rgba(46, 211, 198, 0.4);
    --tm-grad-start:  #FFFFFF;
    --tm-grad-end:    #CCCCCC;
    --tm-serif-glow:  0 0 60px rgba(255, 255, 255, 0.05);
  }

  [data-theme="light"] {
    --tm-base:        #F5F3EE;
    --tm-text:        #0A0A0A;
    --tm-ghost:       rgba(0, 0, 0, 0.032);
    --tm-teal:        #22B8AD;
    --tm-teal-glow:   rgba(34, 184, 173, 0.45);
    --tm-grad-start:  #0A0A0A;
    --tm-grad-end:    #333333;
    --tm-serif-glow:  none;
  }

  .tm-section {
    position: relative;
    min-height: 70vh;
    padding: 8rem 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--tm-base);
    overflow: hidden;
    box-sizing: border-box;
  }

  .tm-vignette {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(
      ellipse 130% 100% at 50% 48%,
      transparent 0%,
      rgba(0, 0, 0, 0.28) 58%,
      rgba(0, 0, 0, 0.58) 100%
    );
  }

  [data-theme="light"] .tm-vignette {
    background: radial-gradient(
      ellipse 130% 100% at 50% 48%,
      rgba(255,255,255,0.4) 0%,
      transparent 50%,
      rgba(0, 0, 0, 0.04) 100%
    );
  }

  .tm-satin {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      radial-gradient(
        ellipse 85% 75% at 20% 15%,
        rgba(255, 255, 255, 0.05) 0%,
        rgba(255, 255, 255, 0.018) 40%,
        transparent 70%
      ),
      radial-gradient(
        ellipse 60% 50% at 50% 50%,
        rgba(255, 248, 240, 0.025) 0%,
        transparent 55%
      ),
      linear-gradient(
        145deg,
        transparent 0%,
        rgba(255, 255, 255, 0.012) 25%,
        transparent 45%,
        rgba(255, 255, 255, 0.008) 65%,
        transparent 100%
      );
  }

  [data-theme="light"] .tm-satin {
    background:
      radial-gradient(
        ellipse 85% 75% at 20% 15%,
        rgba(255, 255, 255, 0.9) 0%,
        rgba(255, 255, 255, 0.5) 40%,
        transparent 70%
      ),
      radial-gradient(
        ellipse 60% 50% at 50% 50%,
        rgba(255, 255, 255, 0.6) 0%,
        transparent 55%
      ),
      linear-gradient(
        145deg,
        transparent 0%,
        rgba(255, 255, 255, 0.25) 25%,
        transparent 45%,
        rgba(255, 255, 255, 0.15) 65%,
        transparent 100%
      );
  }

  .tm-grain {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    opacity: 0.038;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 180px 180px;
  }

  [data-theme="light"] .tm-grain {
    opacity: 0.025;
  }

  .tm-ghost {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 4;
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
    font-family: 'Anton', 'Bebas Neue', 'Helvetica Neue Condensed', sans-serif;
    font-weight: 400;
    font-size: clamp(90px, 19vw, 250px);
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: var(--tm-ghost);
    line-height: 1;
    -webkit-mask-image: linear-gradient(
      180deg,
      rgba(255,255,255,0.3)  0%,
      rgba(255,255,255,1)   25%,
      rgba(255,255,255,1)   75%,
      rgba(255,255,255,0.3) 100%
    );
    mask-image: linear-gradient(
      180deg,
      rgba(255,255,255,0.3)  0%,
      rgba(255,255,255,1)   25%,
      rgba(255,255,255,1)   75%,
      rgba(255,255,255,0.3) 100%
    );
  }

  .tm-content {
    position: relative;
    z-index: 5;
    max-width: 1200px;
    margin: 0 auto;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .tm-line {
    font-family: 'Playfair Display', 'Didot', 'Bodoni MT', 'Georgia', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(1.3rem, 2.3vw, 2.2rem);
    color: var(--tm-text);
    line-height: 1.4;
    letter-spacing: 0.012em;
    text-shadow: var(--tm-serif-glow);
  }

  .tm-line-top {
    margin: 0 0 3rem 0;
  }

  .tm-line-bottom {
    margin: 0;
  }

  .tm-word-wrap {
    position: relative;
    display: inline-flex;
    flex-direction: column;
    align-items: stretch;
    margin-bottom: 3rem;
  }

  .tm-word-wrap::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--tm-teal);
    border-radius: 2px;
    box-shadow:
      0 0 8px  var(--tm-teal-glow),
      0 0 20px var(--tm-teal-glow),
      0 0 45px rgba(46, 211, 198, 0.15);
  }

  .tm-word {
    font-family: 'Anton', 'Bebas Neue', 'Helvetica Neue Condensed', sans-serif;
    font-weight: 400;
    font-size: clamp(4rem, 12vw, 11rem);
    letter-spacing: -0.018em;
    text-transform: uppercase;
    line-height: 0.88;
    padding-bottom: 0.6rem;
    display: block;
    background: linear-gradient(
      180deg,
      var(--tm-grad-start) 0%,
      var(--tm-grad-end) 100%
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  @media (max-width: 1024px) {
    .tm-word {
      font-size: clamp(3.5rem, 13vw, 9rem);
    }
    .tm-ghost {
      font-size: clamp(70px, 18vw, 180px);
    }
  }

  @media (max-width: 768px) {
    .tm-section {
      padding: 5rem 1.5rem;
      min-height: 55vh;
    }
    .tm-ghost {
      font-size: clamp(48px, 22vw, 85px);
    }
    .tm-word {
      font-size: clamp(2.8rem, 14vw, 5rem);
    }
    .tm-line {
      font-size: clamp(1.05rem, 3.8vw, 1.25rem);
    }
    .tm-line-top {
      margin-bottom: 2.25rem;
    }
    .tm-word-wrap {
      margin-bottom: 2.25rem;
    }
  }

  @media (max-width: 480px) {
    .tm-section {
      padding: 4rem 1.25rem;
      min-height: 50vh;
    }
    .tm-ghost {
      font-size: clamp(40px, 20vw, 65px);
    }
    .tm-word {
      font-size: clamp(2.2rem, 13vw, 3.5rem);
    }
    .tm-line {
      font-size: 1rem;
    }
    .tm-line-top,
    .tm-word-wrap {
      margin-bottom: 1.75rem;
    }
  }
</style>
</head>
<body>

<button class="dev-toggle" onclick="toggle()">Toggle light / dark</button>

<section class="tm-section">
  <div class="tm-vignette" aria-hidden="true"></div>
  <div class="tm-satin" aria-hidden="true"></div>
  <div class="tm-grain" aria-hidden="true"></div>
  <div class="tm-ghost" aria-hidden="true">STRATEGY</div>

  <div class="tm-content">
    <p class="tm-line tm-line-top">You don't have a strategy problem.</p>
    <div class="tm-word-wrap">
      <span class="tm-word">TRANSLATION</span>
    </div>
    <p class="tm-line tm-line-bottom">You have a&nbsp;problem.</p>
  </div>
</section>

<script>
  function toggle() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
  }
</script>
</body>
</html>
