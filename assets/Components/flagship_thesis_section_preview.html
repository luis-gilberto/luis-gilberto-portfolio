<!DOCTYPE html>
<html lang="en" data-theme="dark" data-audience="partner">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thesis Section - Final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Anton&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #050506; }
  [data-theme="light"] body { background: #F5F3EE; }

  .dev-toggle {
    position: fixed; top: 1rem; right: 1rem; z-index: 9999;
    padding: 8px 16px; background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px; cursor: pointer; font-family: system-ui, sans-serif;
    font-size: 12px; letter-spacing: 0.04em; backdrop-filter: blur(8px);
    transition: all 0.3s ease;
  }
  .dev-toggle:hover { background: rgba(255,255,255,0.12); }
  [data-theme="light"] .dev-toggle {
    color: #333; background: rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.12);
  }

  :root {
    --tm-base:        #0A0A0C;
    --tm-text:        #FAFAFA;
    --tm-ghost:       rgba(255, 255, 255, 0.024);
    --tm-grad-start:  #FFFFFF;
    --tm-grad-end:    #CFCFCF;
    --tm-serif-glow:  0 0 60px rgba(255, 255, 255, 0.05);

    /* 🎯 Audience accent defaults */
    --tm-accent:      #2ED3C6;
    --tm-accent-2:    #2ED3C6;
    --tm-accent-glow: rgba(46, 211, 198, 0.42);
    --tm-accent-solid: #2ED3C6;
  }

  [data-theme="light"] {
    --tm-base:        #F3EFE6;
    --tm-text:        #0A0A0A;
    --tm-ghost:       rgba(0, 0, 0, 0.07);
    --tm-grad-start:  #0A0A0A;
    --tm-grad-end:    #2A2A2A;
    --tm-serif-glow:  none;
  }

  /* 🎨 Audience-driven accents */
  [data-audience="partner"] {
    --tm-accent: #2ED3C6;
    --tm-accent-2: #2ED3C6;
    --tm-accent-glow: rgba(46, 211, 198, 0.42);
    --tm-accent-solid: #2ED3C6;
  }

  [data-audience="hire"] {
    --tm-accent: #F96F6E;
    --tm-accent-2: #F96F6E;
    --tm-accent-glow: rgba(249, 111, 110, 0.38);
    --tm-accent-solid: #F96F6E;
  }

  [data-audience="explore"] {
    --tm-accent: #F96F6E;
    --tm-accent-2: #2ED3C6;
    --tm-accent-glow: rgba(120, 190, 180, 0.30);
    --tm-accent-solid: #FAF7F4;
  }

  .tm-section {
    position: relative;
    min-height: 72vh;
    padding: 6rem 2rem 5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--tm-base);
    overflow: hidden;
    box-sizing: border-box;
    isolation: isolate;
  }

  /* 📖 Visible center seam for luxe book-spread energy */
  .tm-section::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(14px, 1.6vw, 24px);
    z-index: 2;
    pointer-events: none;
    background: linear-gradient(
      90deg,
      rgba(0, 0, 0, 0.22) 0%,
      rgba(255, 255, 255, 0.035) 18%,
      rgba(255, 255, 255, 0.05) 50%,
      rgba(0, 0, 0, 0.18) 82%,
      rgba(0, 0, 0, 0.24) 100%
    );
    mix-blend-mode: soft-light;
    opacity: 0.9;
  }

  [data-theme="light"] .tm-section::before {
    background: linear-gradient(
      90deg,
      rgba(0, 0, 0, 0.06) 0%,
      rgba(255, 255, 255, 0.55) 18%,
      rgba(255, 255, 255, 0.75) 50%,
      rgba(0, 0, 0, 0.05) 82%,
      rgba(0, 0, 0, 0.08) 100%
    );
    mix-blend-mode: multiply;
    opacity: 0.62;
  }

  .tm-vignette {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(
      ellipse 130% 100% at 50% 48%,
      transparent 0%,
      rgba(0, 0, 0, 0.28) 58%,
      rgba(0, 0, 0, 0.58) 100%
    );
  }

  [data-theme="light"] .tm-vignette {
    background: radial-gradient(
      ellipse 130% 100% at 50% 48%,
      rgba(255,255,255,0.4) 0%,
      transparent 50%,
      rgba(0, 0, 0, 0.04) 100%
    );
  }

  .tm-satin {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      radial-gradient(
        ellipse 90% 80% at 20% 16%,
        rgba(255, 255, 255, 0.065) 0%,
        rgba(255, 255, 255, 0.02) 38%,
        transparent 72%
      ),
      radial-gradient(
        ellipse 65% 55% at 50% 48%,
        rgba(255, 248, 240, 0.03) 0%,
        transparent 56%
      ),
      linear-gradient(
        145deg,
        transparent 0%,
        rgba(255, 255, 255, 0.018) 22%,
        transparent 42%,
        rgba(255, 255, 255, 0.012) 62%,
        transparent 100%
      ),
      linear-gradient(
        180deg,
        rgba(255,255,255,0.012) 0%,
        transparent 16%,
        transparent 84%,
        rgba(0,0,0,0.08) 100%
      );
  }

  [data-theme="light"] .tm-satin {
    background:
      radial-gradient(
        ellipse 88% 76% at 20% 15%,
        rgba(255, 255, 255, 0.92) 0%,
        rgba(255, 255, 255, 0.48) 38%,
        transparent 72%
      ),
      radial-gradient(
        ellipse 64% 52% at 50% 48%,
        rgba(255, 255, 255, 0.52) 0%,
        transparent 58%
      ),
      linear-gradient(
        145deg,
        transparent 0%,
        rgba(255, 255, 255, 0.2) 22%,
        transparent 44%,
        rgba(255, 255, 255, 0.13) 62%,
        transparent 100%
      ),
      linear-gradient(
        180deg,
        rgba(255,255,255,0.2) 0%,
        transparent 18%,
        transparent 84%,
        rgba(0,0,0,0.03) 100%
      );
  }

  .tm-grain {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    opacity: 0.038;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 180px 180px;
  }

  [data-theme="light"] .tm-grain {
    opacity: 0.025;
  }

  .tm-ghost {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 4;
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
    font-family: 'Anton', 'Bebas Neue', 'Helvetica Neue Condensed', sans-serif;
    font-weight: 400;
    font-size: clamp(112px, 22vw, 300px);
    letter-spacing: -0.028em;
    text-transform: uppercase;
    color: var(--tm-ghost);
    line-height: 1;
    text-shadow: 0 0 1px rgba(255,255,255,0.018), 0 0 24px rgba(255,255,255,0.02);
    -webkit-mask-image: linear-gradient(
      180deg,
      rgba(255,255,255,0.25) 0%,
      rgba(255,255,255,1) 25%,
      rgba(255,255,255,1) 75%,
      rgba(255,255,255,0.25) 100%
    );
    mask-image: linear-gradient(
      180deg,
      rgba(255,255,255,0.25) 0%,
      rgba(255,255,255,1) 25%,
      rgba(255,255,255,1) 75%,
      rgba(255,255,255,0.25) 100%
    );
  }

  [data-theme="light"] .tm-ghost {
    text-shadow: none;
    -webkit-mask-image: none;
    mask-image: none;
  }

  .tm-content {
    position: relative;
    z-index: 5;
    max-width: 1200px;
    margin: 0 auto;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .tm-line {
    font-family: 'Playfair Display', 'Didot', 'Bodoni MT', 'Georgia', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(1.3rem, 2.3vw, 2.2rem);
    color: var(--tm-text);
    line-height: 1.4;
    letter-spacing: 0.012em;
    text-shadow: var(--tm-serif-glow);
  }

  .tm-line-top {
    margin: 0 0 1.8rem 0; /* tighter spacing */
  }

  .tm-line-bottom {
    margin: 1.8rem 0 0 0; /* added breathing room so the STRATEGY reflection can breathe */
  }

  .tm-word-wrap {
    position: relative;
    display: inline-flex;
    flex-direction: column;
    align-items: stretch;
    margin-bottom: 1.8rem; /* tighter composition */
  }

  .tm-word-wrap::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--tm-accent), var(--tm-accent-2));
    border-radius: 2px;
    box-shadow:
      0 0 8px var(--tm-accent-glow),
      0 0 20px var(--tm-accent-glow),
      0 0 45px color-mix(in srgb, var(--tm-accent) 25%, transparent);
  }

  .tm-word {
    font-family: 'Anton', 'Bebas Neue', 'Helvetica Neue Condensed', sans-serif;
    font-weight: 400;
    font-size: clamp(4rem, 11.2vw, 10.4rem);
    letter-spacing: -0.018em;
    text-transform: uppercase;
    line-height: 0.88;
    padding-bottom: 0.55rem;
    display: block;
    background: linear-gradient(
      180deg,
      var(--tm-grad-start) 0%,
      var(--tm-grad-end) 100%
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  @media (max-width: 1024px) {
    .tm-word {
      font-size: clamp(3.7rem, 12vw, 8.6rem);
    }
    .tm-ghost {
      font-size: clamp(96px, 21vw, 220px);
    }
  }
    .tm-ghost {
      font-size: clamp(70px, 18vw, 180px);
    }
  }

  @media (max-width: 768px) {
    .tm-section {
      padding: 3.5rem 1.4rem 3rem;
      min-height: 48vh;
    }
    .tm-ghost {
      font-size: clamp(56px, 24vw, 98px);
      color: rgba(255,255,255,0.02);
    }
    .tm-content {
      max-width: 92vw;
    }
    .tm-word {
      font-size: clamp(2.9rem, 15vw, 5.1rem);
    }
    .tm-line {
      font-size: clamp(1.03rem, 3.7vw, 1.2rem);
      line-height: 1.18;
    }
    .tm-eyebrow {
      margin-bottom: 1.15rem !important;
      font-size: 0.68rem !important;
      letter-spacing: 0.17em !important;
    }
    .tm-line-top {
      margin-bottom: 1.1rem;
    }
    .tm-word-wrap {
      margin-bottom: 1.1rem;
    }
    .tm-description {
      margin-top: 1.2rem !important;
      font-size: 0.92rem !important;
      line-height: 1.5 !important;
    }
    .tm-cta {
      margin-top: 1rem !important;
      font-size: 1.12rem !important;
    }
  }
    .tm-ghost {
      font-size: clamp(48px, 22vw, 85px);
    }
    .tm-word {
      font-size: clamp(2.8rem, 14vw, 5rem);
    }
    .tm-line {
      font-size: clamp(1.05rem, 3.8vw, 1.25rem);
    }
    .tm-line-top {
      margin-bottom: 2.25rem;
    }
    .tm-word-wrap {
      margin-bottom: 2.25rem;
    }
  }

  @media (max-width: 480px) {
    .tm-section {
      padding: 3rem 1.15rem 2.5rem;
      min-height: 44vh;
    }
    .tm-ghost {
      font-size: clamp(44px, 21vw, 76px);
    }
    .tm-word {
      font-size: clamp(2.45rem, 13.5vw, 3.7rem);
    }
    .tm-line {
      font-size: 0.98rem;
    }
    .tm-line-top,
    .tm-word-wrap {
      margin-bottom: 0.95rem;
    }
    .tm-description {
      margin-top: 1rem !important;
    }
  }
    .tm-ghost {
      font-size: clamp(40px, 20vw, 65px);
    }
    .tm-word {
      font-size: clamp(2.2rem, 13vw, 3.5rem);
    }
    .tm-line {
      font-size: 1rem;
    }
    .tm-line-top,
    .tm-word-wrap {
      margin-bottom: 1.75rem;
    }
  }
</style>
</head>
<body>

<button class="dev-toggle" onclick="toggle()">Toggle light / dark</button>

<section class="tm-section">
  <div class="tm-vignette" aria-hidden="true"></div>
  <div class="tm-satin" aria-hidden="true"></div>
  <div class="tm-grain" aria-hidden="true"></div>
  <div class="tm-ghost" aria-hidden="true">STRATEGY</div>

  <div class="tm-content">

    <div class="tm-eyebrow" style="font-family:system-ui, sans-serif;font-size:0.72rem;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:1.55rem;">
      Insights | Flagship Editorial
    </div>
    <p class="tm-line tm-line-top">You don't have a strategy problem.</p>

    <div class="tm-word-wrap">
      <span class="tm-word">TRANSLATION</span>
    </div>

    <p class="tm-line tm-line-bottom">You have a translation gap.</p>

    <p class="tm-description" style="margin-top:1.45rem;max-width:640px;color:rgba(255,255,255,0.65);font-family:system-ui, sans-serif;font-size:0.98rem;line-height:1.55;">
      The editorial thesis behind how I lead, build, and close the gap between strategy and execution.
    </p>

    <a class="tm-cta" href="#" style="margin-top:1.15rem;font-family:system-ui, sans-serif;font-weight:600;font-size:1.24rem;color:var(--tm-accent-solid);text-decoration:none;border-bottom:1px solid color-mix(in srgb, var(--tm-accent-solid) 35%, transparent);padding-bottom:6px;transition:all .25s ease;">
      Read the flagship insight (7 min) →
    </a>
  </div>
  </div>
</section>

<script>
  function toggle() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
  }
</script>
</body>
</html>
