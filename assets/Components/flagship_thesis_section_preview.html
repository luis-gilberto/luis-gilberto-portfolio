<!DOCTYPE html>
<html lang="en" data-theme="dark" data-audience="partner">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flagship Thesis Section Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Anton&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --tm-base: #0a0a0c;
    --tm-body: #050506;
    --tm-text: #fafafa;
    --tm-text-muted: rgba(255, 255, 255, 0.66);
    --tm-eyebrow: rgba(255, 255, 255, 0.46);
    --tm-ghost: rgba(255, 255, 255, 0.03);
    --tm-grad-start: #ffffff;
    --tm-grad-end: #cfcfcf;
    --tm-serif-glow: 0 0 48px rgba(255, 255, 255, 0.05);

    --tm-accent: #2ed3c6;
    --tm-accent-2: #2ed3c6;
    --tm-accent-solid: #2ed3c6;
    --tm-accent-glow: rgba(46, 211, 198, 0.38);
  }

  html, body {
    min-height: 100%;
    background: var(--tm-body);
  }

  body {
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--tm-text);
  }

  [data-theme="light"] {
    --tm-base: #f3efe6;
    --tm-body: #f3efe6;
    --tm-text: #0a0a0a;
    --tm-text-muted: rgba(10, 10, 10, 0.64);
    --tm-eyebrow: rgba(10, 10, 10, 0.46);
    --tm-ghost: rgba(0, 0, 0, 0.08);
    --tm-grad-start: #111111;
    --tm-grad-end: #333333;
    --tm-serif-glow: none;
  }

  [data-audience="partner"] {
    --tm-accent: #2ed3c6;
    --tm-accent-2: #2ed3c6;
    --tm-accent-solid: #2ed3c6;
    --tm-accent-glow: rgba(46, 211, 198, 0.38);
  }

  [data-audience="hire"] {
    --tm-accent: #f96f6e;
    --tm-accent-2: #f96f6e;
    --tm-accent-solid: #f96f6e;
    --tm-accent-glow: rgba(249, 111, 110, 0.34);
  }

  [data-audience="explore"] {
    --tm-accent: #f96f6e;
    --tm-accent-2: #2ed3c6;
    --tm-accent-solid: #faf7f4;
    --tm-accent-glow: rgba(120, 190, 180, 0.30);
  }

  .dev-toggle {
    position: fixed;
    top: 1rem;
    right: 1rem;
    z-index: 9999;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.8);
    padding: 0.8rem 1rem;
    font-size: 0.95rem;
    cursor: pointer;
    backdrop-filter: blur(8px);
  }

  [data-theme="light"] .dev-toggle {
    border-color: rgba(0, 0, 0, 0.12);
    background: rgba(0, 0, 0, 0.05);
    color: rgba(0, 0, 0, 0.76);
  }

  .tm-shell {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 0;
  }

  .tm-section {
    position: relative;
    width: 100%;
    min-height: 72vh;
    padding: 5.5rem 2rem 4.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    isolation: isolate;
    background: var(--tm-base);
  }

  .tm-section::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.015) 0%, transparent 14%, transparent 82%, rgba(0,0,0,0.08) 100%);
    z-index: 1;
    pointer-events: none;
  }

  .tm-section::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(14px, 1.6vw, 24px);
    z-index: 3;
    pointer-events: none;
    background: linear-gradient(
      90deg,
      rgba(0, 0, 0, 0.22) 0%,
      rgba(255, 255, 255, 0.035) 18%,
      rgba(255, 255, 255, 0.05) 50%,
      rgba(0, 0, 0, 0.18) 82%,
      rgba(0, 0, 0, 0.24) 100%
    );
    mix-blend-mode: soft-light;
    opacity: 0.88;
  }

  [data-theme="light"] .tm-section::after {
    background: linear-gradient(
      90deg,
      rgba(0, 0, 0, 0.06) 0%,
      rgba(255, 255, 255, 0.55) 18%,
      rgba(255, 255, 255, 0.75) 50%,
      rgba(0, 0, 0, 0.05) 82%,
      rgba(0, 0, 0, 0.08) 100%
    );
    mix-blend-mode: multiply;
    opacity: 0.62;
  }

  .tm-vignette,
  .tm-satin,
  .tm-grain,
  .tm-ghost {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .tm-vignette {
    z-index: 1;
    background: radial-gradient(
      ellipse 130% 100% at 50% 48%,
      transparent 0%,
      rgba(0, 0, 0, 0.26) 58%,
      rgba(0, 0, 0, 0.56) 100%
    );
  }

  [data-theme="light"] .tm-vignette {
    background: radial-gradient(
      ellipse 130% 100% at 50% 48%,
      rgba(255,255,255,0.38) 0%,
      transparent 50%,
      rgba(0, 0, 0, 0.04) 100%
    );
  }

  .tm-satin {
    z-index: 2;
    background:
      radial-gradient(
        ellipse 90% 80% at 20% 16%,
        rgba(255, 255, 255, 0.065) 0%,
        rgba(255, 255, 255, 0.02) 38%,
        transparent 72%
      ),
      radial-gradient(
        ellipse 65% 55% at 50% 48%,
        rgba(255, 248, 240, 0.03) 0%,
        transparent 56%
      ),
      linear-gradient(
        145deg,
        transparent 0%,
        rgba(255, 255, 255, 0.018) 22%,
        transparent 42%,
        rgba(255, 255, 255, 0.012) 62%,
        transparent 100%
      ),
      linear-gradient(
        180deg,
        rgba(255,255,255,0.012) 0%,
        transparent 16%,
        transparent 84%,
        rgba(0,0,0,0.08) 100%
      );
  }

  [data-theme="light"] .tm-satin {
    background:
      radial-gradient(
        ellipse 88% 76% at 20% 15%,
        rgba(255, 255, 255, 0.92) 0%,
        rgba(255, 255, 255, 0.48) 38%,
        transparent 72%
      ),
      radial-gradient(
        ellipse 64% 52% at 50% 48%,
        rgba(255, 255, 255, 0.52) 0%,
        transparent 58%
      ),
      linear-gradient(
        145deg,
        transparent 0%,
        rgba(255, 255, 255, 0.2) 22%,
        transparent 44%,
        rgba(255, 255, 255, 0.13) 62%,
        transparent 100%
      ),
      linear-gradient(
        180deg,
        rgba(255,255,255,0.2) 0%,
        transparent 18%,
        transparent 84%,
        rgba(0,0,0,0.03) 100%
      );
  }

  .tm-grain {
    z-index: 4;
    opacity: 0.036;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 180px 180px;
  }

  [data-theme="light"] .tm-grain {
    opacity: 0.022;
  }

  .tm-ghost {
    z-index: 5;
    inset: 50% auto auto 50%;
    transform: translate(-50%, -50%);
    width: auto;
    height: auto;
    white-space: nowrap;
    user-select: none;
    font-family: 'Anton', 'Bebas Neue', 'Helvetica Neue Condensed', sans-serif;
    font-weight: 400;
    font-size: clamp(120px, 23vw, 320px);
    letter-spacing: -0.03em;
    line-height: 1;
    text-transform: uppercase;
    color: var(--tm-ghost);
    text-shadow: 0 0 1px rgba(255,255,255,0.018), 0 0 22px rgba(255,255,255,0.02);
    -webkit-mask-image: linear-gradient(
      180deg,
      rgba(255,255,255,0.24) 0%,
      rgba(255,255,255,1) 25%,
      rgba(255,255,255,1) 75%,
      rgba(255,255,255,0.24) 100%
    );
    mask-image: linear-gradient(
      180deg,
      rgba(255,255,255,0.24) 0%,
      rgba(255,255,255,1) 25%,
      rgba(255,255,255,1) 75%,
      rgba(255,255,255,0.24) 100%
    );
  }

  [data-theme="light"] .tm-ghost {
    text-shadow: none;
    -webkit-mask-image: none;
    mask-image: none;
  }

  .tm-content {
    position: relative;
    z-index: 6;
    width: min(92vw, 1320px);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .tm-eyebrow {
    margin-bottom: 1.5rem;
    color: var(--tm-eyebrow);
    font-size: 0.74rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .tm-line {
    font-family: 'Playfair Display', 'Didot', 'Bodoni MT', Georgia, serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(1.45rem, 2.4vw, 2.5rem); 
    line-height: 1.24; 
    letter-spacing: 0.012em; 
    color: var(--tm-text); 
    text-shadow: var(--tm-serif-glow); 
  }

  .tm-line-top {
    margin-bottom: 2.3rem;
  }

  .tm-word-wrap {
    position: relative;
    display: inline-flex;
    flex-direction: column;
    align-items: stretch;
    margin-bottom: 1.8rem;
  }

  .tm-word-wrap::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--tm-accent), var(--tm-accent-2));
    box-shadow:
      0 0 8px var(--tm-accent-glow),
      0 0 20px var(--tm-accent-glow),
      0 0 45px color-mix(in srgb, var(--tm-accent) 25%, transparent);
  }

  .tm-word {
    display: block;
    padding-bottom: 0.55rem;
    font-family: 'Anton', 'Bebas Neue', 'Helvetica Neue Condensed', sans-serif;
    font-weight: 400;
    font-size: clamp(4.2rem, 11.4vw, 10.8rem);
    line-height: 0.88;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    background: linear-gradient(180deg, var(--tm-grad-start) 0%, var(--tm-grad-end) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tm-line-bottom {
    margin-top: 2.3rem;
  }

  .tm-description {
    max-width: 680px;
    margin-top: 1.45rem;
    color: var(--tm-text-muted);
    font-size: 0.98rem;
    line-height: 1.55;
  }

  .tm-cta {
    display: inline-flex; 
    flex-direction: column; 
    align-items: center; 
    gap: 0.28rem; 
    margin-top: 1.15rem;
    color: var(--tm-accent-solid);
    font-size: 1.24rem;
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid color-mix(in srgb, var(--tm-accent-solid) 35%, transparent);
    padding-bottom: 6px;
    transition: opacity 0.25s ease, border-color 0.25s ease, color 0.25s ease;
  }

  .tm-cta-main { 
    display: inline-block; 
  } 
  
  .tm-cta-meta { 
    font-size: 0.78rem; 
    font-weight: 500; 
    letter-spacing: 0.08em; 
    text-transform: uppercase; 
    color: color-mix(in srgb, var(--tm-accent-solid) 72%, white 28%); 
    opacity: 0.88; 
  } 

  .tm-cta:hover {
    opacity: 0.82;
    border-bottom-color: color-mix(in srgb, var(--tm-accent-solid) 55%, transparent);
  }

  @media (max-width: 1024px) {
    .tm-word {
      font-size: clamp(3.8rem, 12vw, 8.8rem);
    }

    .tm-ghost {
      font-size: clamp(98px, 21vw, 230px);
    }
  }

  @media (max-width: 768px) {
    .tm-section {
      min-height: 50vh;
      padding: 3.5rem 1.4rem 3rem;
    }

    .tm-content {
      width: min(92vw, 560px);
    }

    .tm-eyebrow {
      margin-bottom: 1.1rem;
      font-size: 0.68rem;
      letter-spacing: 0.17em;
    }

    .tm-line {
      font-size: clamp(1.15rem, 4.4vw, 1.38rem); 
      line-height: 1.22; 
    }

    .tm-line-top {
      margin-bottom: 1.1rem;
    }

    .tm-word-wrap {
      margin-bottom: 1.1rem;
    }

    .tm-word {
      font-size: clamp(2.9rem, 15vw, 5.1rem);
    }

    .tm-ghost {
      font-size: clamp(56px, 24vw, 98px);
      color: rgba(255, 255, 255, 0.02);
    }

    [data-theme="light"] .tm-ghost {
      color: rgba(0, 0, 0, 0.06);
    }

    .tm-line-bottom {
      margin-top: 1.1rem;
    }

    .tm-description {
      margin-top: 1rem;
      font-size: 0.9rem;
      line-height: 1.48;
    }

    .tm-cta {
      margin-top: 1.45rem;
      font-size: 1.02rem;
      line-height: 1.25;
    }

    .tm-cta-meta {
      font-size: 0.74rem;
    }
  }

  @media (max-width: 480px) {
    .tm-section {
      min-height: 44vh;
      padding: 3rem 1.15rem 2.5rem;
    }

    .tm-word {
      font-size: clamp(2.45rem, 13.5vw, 3.7rem);
    }

    .tm-ghost {
      font-size: clamp(44px, 21vw, 76px);
    }

    .tm-line {
      font-size: 0.98rem;
    }

    .tm-line-top,
    .tm-word-wrap {
      margin-bottom: 0.95rem;
    }

    .tm-line-bottom {
      margin-top: 0.95rem;
    }

    .tm-description {
      margin-top: 1rem;
    }
  }
</style>
</head>
<body>
<button class="dev-toggle" onclick="toggleTheme()">Toggle light / dark</button>

<main class="tm-shell">
  <section class="tm-section" aria-labelledby="flagship-thesis-heading">
    <div class="tm-vignette" aria-hidden="true"></div>
    <div class="tm-satin" aria-hidden="true"></div>
    <div class="tm-grain" aria-hidden="true"></div>
    <div class="tm-ghost" aria-hidden="true">STRATEGY</div>

    <div class="tm-content">
      <div class="tm-eyebrow">Insights | Flagship Editorial</div>
      <p class="tm-line tm-line-top">You don't have a strategy problem.</p>

      <div class="tm-word-wrap">
        <h1 id="flagship-thesis-heading" class="tm-word">TRANSLATION</h1>
      </div>

      <p class="tm-line tm-line-bottom">You have a translation gap.</p>

      <p class="tm-description">
        The editorial thesis behind how I lead, build, and close the gap between strategy and execution.
      </p>

      <a class="tm-cta" href="/insights/translation-problem/">
        <span class="tm-cta-main">Read the flagship insight →</span>
        <span class="tm-cta-meta">7 min read</span>
      </a>
    </div>
  </section>
</main>

<script>
  function toggleTheme() {
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
  }
</script>
</body>
</html>
