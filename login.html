<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrategyIQ | Private Access</title>
    
    <!-- ─── FONTS ─── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- ─── STYLES ─── -->
    <link rel="stylesheet" href="assets/css/login.css">
    
    <!-- No-index meta for private workspace -->
    <meta name="robots" content="noindex, nofollow">
</head>
<body>

    <!-- ─── DARIA FLASH LAYER (EASTER EGG) ─── -->
    <div id="dariaBackground" class="daria-success-bg">
        <div class="daria-overlay"></div>
    </div>

    <!-- ─── LOGIN CARD ─── -->
    <main class="login-card-compact">
        <!-- Branding -->
        <div class="brand-wordmark">StrategyIQ</div>
        
        <div class="login-header">
            <h1>Private Access.</h1>
            <p>Your work, notes, and files are ready.</p>
        </div>

        <!-- Auth Form -->
        <form id="loginForm">
            <div class="input-group">
                <label for="passcode" class="input-label">Access code</label>
                <input 
                    type="password" 
                    id="passcode" 
                    class="login-input" 
                    placeholder="Enter your access code" 
                    autocomplete="current-password" 
                    required
                >
            </div>

            <button type="submit" id="submitBtn" class="login-btn">
                Continue →
            </button>
        </form>

        <!-- Footer -->
        <div class="login-footer">
            Sovereign Stack v18.9 · Obsidian Dark
        </div>
    </main>

    <!-- ─── SCRIPTS ─── -->
    <script src="assets/js/login.js" defer></script>
</body>
</html>
