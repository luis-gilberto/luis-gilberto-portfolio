<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Microsoft 365 Logo -->
  <rect width="80" height="80" fill="#0078d4" rx="8"/>
  
  <!-- Office Grid Pattern -->
  <rect x="12" y="12" width="16" height="16" fill="#ffffff" rx="2"/>
  <rect x="32" y="12" width="16" height="16" fill="#ffffff" rx="2"/>
  <rect x="52" y="12" width="16" height="16" fill="#ffffff" rx="2"/>
  
  <rect x="12" y="32" width="16" height="16" fill="#ffffff" rx="2"/>
  <rect x="32" y="32" width="16" height="16" fill="#ffffff" rx="2"/>
  <rect x="52" y="32" width="16" height="16" fill="#ffffff" rx="2"/>
  
  <rect x="12" y="52" width="16" height="16" fill="#ffffff" rx="2"/>
  <rect x="32" y="52" width="16" height="16" fill="#ffffff" rx="2"/>
  <rect x="52" y="52" width="16" height="16" fill="#ffffff" rx="2"/>
  
  <!-- 365 Text -->
  <text x="40" y="75" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="600">365</text>
</svg>