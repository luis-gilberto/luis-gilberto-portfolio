<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hub - Loading Animation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #laser-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
        
        .logo-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            opacity: 0;
            animation: logoReveal 2s ease-out 5s forwards;
        }
        
        .hub-title {
            font-size: clamp(3rem, 8vw, 8rem);
            font-weight: 800;
            color: #FF6B6B;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            transform: translateY(20px);
            animation: slideUp 1.5s ease-out 5.2s forwards;
        }
        
        .hub-subtitle {
            font-size: clamp(1rem, 2.5vw, 2rem);
            font-weight: 400;
            color: #888;
            letter-spacing: 0.02em;
            transform: translateY(20px);
            animation: slideUp 1.5s ease-out 5.5s forwards;
        }
        
        .progress-bar {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 4px;
            background: rgba(255, 107, 107, 0.2);
            border-radius: 2px;
            overflow: hidden;
            opacity: 0;
            animation: progressShow 0.5s ease-out 1s forwards;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FF6B6B, #FF8E8E);
            border-radius: 2px;
            width: 0%;
            animation: progressFill 7s ease-out forwards;
        }
        
        .loading-text {
            position: absolute;
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
            color: #666;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0;
            animation: textShow 0.5s ease-out 1.5s forwards;
        }
        
        /* Pulsing effect for the logo */
        .logo-pulse {
            animation: pulse 2s ease-in-out infinite;
        }
        
        /* Fade out animation for the entire loading screen */
        .fade-out {
            animation: fadeOut 1s ease-out forwards;
        }
        
        @keyframes logoReveal {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        
        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes progressShow {
            to {
                opacity: 1;
            }
        }
        
        @keyframes progressFill {
            0% {
                width: 0%;
            }
            70% {
                width: 70%;
            }
            100% {
                width: 100%;
            }
        }
        
        @keyframes textShow {
            to {
                opacity: 1;
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.05);
            }
        }
        
        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .progress-bar {
                width: 250px;
            }
            
            .hub-title {
                font-size: clamp(2.5rem, 10vw, 6rem);
            }
            
            .hub-subtitle {
                font-size: clamp(0.9rem, 3vw, 1.5rem);
            }
        }
        
        @media (max-width: 480px) {
            .progress-bar {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="loading-container" id="loadingContainer">
        <div class="video-container">
            <video id="laser-video" autoplay muted playsinline>
                <source src="https://page.gensparksite.com/get_upload_url/03cf1e155444051d5b6745a87dc476730711f4eefcd17b4ce3ee6fcf984aaf6f/default/35eadf2e-37c8-4b92-b526-ee292b61e1de" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            
            <div class="logo-overlay" id="logoOverlay">
                <div class="hub-title">The Hub.</div>
                <div class="hub-subtitle">Built for what's next</div>
            </div>
            
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            
            <div class="loading-text">Loading Experience</div>
        </div>
    </div>

    <script>
        class HubLoadingAnimation {
            constructor() {
                this.video = document.getElementById('laser-video');
                this.logoOverlay = document.getElementById('logoOverlay');
                this.loadingContainer = document.getElementById('loadingContainer');
                this.isComplete = false;
                
                this.init();
            }
            
            init() {
                // Ensure video is ready
                this.video.addEventListener('loadedmetadata', () => {
                    console.log('Video loaded, duration:', this.video.duration);
                });
                
                // Handle video end
                this.video.addEventListener('ended', () => {
                    this.onVideoEnd();
                });
                
                // Add pulse effect to logo after it appears
                setTimeout(() => {
                    if (this.logoOverlay) {
                        this.logoOverlay.classList.add('logo-pulse');
                    }
                }, 6500);
                
                // Auto-complete after 8 seconds (video + logo display time)
                setTimeout(() => {
                    this.completeLoading();
                }, 8000);
            }
            
            onVideoEnd() {
                console.log('Video ended');
                // Video has ended, logo should be visible now
            }
            
            completeLoading() {
                if (this.isComplete) return;
                
                this.isComplete = true;
                this.loadingContainer.classList.add('fade-out');
                
                // Remove the loading container after fade out
                setTimeout(() => {
                    this.loadingContainer.style.display = 'none';
                    // Trigger custom event for when loading is complete
                    document.dispatchEvent(new CustomEvent('hubLoadingComplete'));
                }, 1000);
            }
            
            // Public method to manually complete loading
            forceComplete() {
                this.completeLoading();
            }
        }
        
        // Initialize the loading animation
        const hubLoader = new HubLoadingAnimation();
        
        // Listen for loading completion
        document.addEventListener('hubLoadingComplete', () => {
            console.log('Hub loading animation complete');
            // Here you can initialize your main website content
        });
        
        // Optional: Skip loading on click (for development/testing)
        document.addEventListener('click', () => {
            hubLoader.forceComplete();
        });
    </script>
</body>
</html>
