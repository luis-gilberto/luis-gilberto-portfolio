<!-- ================================================================

<style>
/* ===================================================
   HERO SECTION - OPTIMIZED LAYOUT
   =================================================== */

.hero {
    /* Tighter vertical space - content moves UP */
    min-height: 60svh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start; /* Changed from center */
    align-items: center;
    text-align: center;
    padding: clamp(80px, 10vh, 120px) clamp(20px, 4vw, 32px) clamp(20px, 4vw, 32px);
    position: relative;
    overflow: hidden;
    background: #0E0F10;
}

/* Services hero specific styles */
#services-hero.hero {
    position: relative;
    background:
        radial-gradient(circle at 30% 20%, rgba(249,111,110,0.08) 0%, transparent 50%),
        radial-gradient(circle at 70% 80%, rgba(46,211,198,0.06) 0%, transparent 50%),
        linear-gradient(180deg, #0B0B0B 0%, #0D0D0D 70%, #0B0B0B 100%);
}

/* CRITICAL: Suppress any default orbital decorations */
#services-hero.hero::before,
#services-hero.hero::after {
    content: none !important;
    display: none !important;
}

/* ===================================================
   ATOMIC ORBITAL SHAPE - ELEGANT BACKGROUND ACCENT
   =================================================== */

.hero-icon-wrapper {
    position: absolute;
    right: -8%; /* Extends beyond viewport for asymmetry */
    top: 50%; /* Vertical centering */
    transform: translateY(-50%); /* Perfect center */
    width: 720px;
    height: 720px;
    opacity: 0.09; /* Subtle presence */
    pointer-events: none;
    z-index: 0; /* Behind content */
}

.hero-icon {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: brightness(1.15) saturate(1.05) drop-shadow(0 0 60px rgba(249, 111, 110, 0.35));
    mix-blend-mode: screen;
    animation: float-hero-icon 12s ease-in-out infinite;
}

@keyframes float-hero-icon {
    0%, 100% {
        transform: translateY(0px) rotate(0deg);
        filter: brightness(1.15) saturate(1.05) drop-shadow(0 0 60px rgba(249, 111, 110, 0.35));
    }
    50% {
        transform: translateY(-20px) rotate(3deg);
        filter: brightness(1.25) saturate(1.15) drop-shadow(0 0 80px rgba(249, 111, 110, 0.45));
    }
}

/* ===================================================
   HERO CONTENT - ELEVATED WITH CLEAR HIERARCHY
   =================================================== */

.hero > * {
    position: relative;
    z-index: 10; /* Above atom shape */
}

.hero h1,
.hero .hero-title {
    text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
}

/* ===================================================
   RESPONSIVE REFINEMENTS
   =================================================== */

@media (max-width: 1400px) {
    .hero-icon-wrapper {
        width: 650px;
        height: 650px;
        right: -10%;
        opacity: 0.08;
    }
}

@media (max-width: 1024px) {
    .hero {
        min-height: 55svh;
        padding-top: clamp(60px, 8vh, 100px);
    }
    
    .hero-icon-wrapper {
        width: 550px;
        height: 550px;
        right: -15%;
        opacity: 0.07;
    }
}

@media (max-width: 768px) {
    .hero {
        min-height: 50svh;
        padding-top: clamp(50px, 7vh, 80px);
    }
    
    .hero-icon-wrapper {
        width: 480px;
        height: 480px;
        right: -25%;
        top: 40%;
        opacity: 0.06;
    }
}

@media (max-width: 480px) {
    .hero-icon-wrapper {
        width: 380px;
        height: 380px;
        right: -30%;
        opacity: 0.05;
    }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {
    .hero-icon {
        animation: none !important;
    }
    .hero-icon-wrapper {
        transform: translateY(-50%) !important;
    }
}

@media (prefers-contrast: high) {
    .hero-icon-wrapper {
        opacity: 0.03 !important;
    }
}
</style>
