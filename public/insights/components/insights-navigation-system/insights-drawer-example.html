<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>
/* Mega Menu System (Phase 117+118) */
.desktop-nav .nav-item {
  position: relative; /* Task 1: Positional Anchor */
}

.desktop-nav .mega-panel {
  display: block;
  opacity: 0;
  visibility: hidden;
  transition: all 0.2s ease;
  transition-delay: 100ms; /* Task 3: Hover Intent */
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%) translateY(10px) translateZ(0); /* Task 1: Alignment & GPU */
  backface-visibility: hidden;
  width: 520px; /* Slightly wider for padding */
  background: #0A0A0A; /* Task 2: Always Dark */
  border: 1px solid rgba(255, 255, 255, 0.1); /* Task 2: Subtle Border */
  padding: 1.5rem; /* Task 3: Spacing */
  border-radius: 0.75rem;
  z-index: 50;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  margin-top: 1rem;
}

/* Safe Tunnel */
.desktop-nav .mega-panel::before {
  content: "";
  position: absolute;
  top: -20px;
  left: 0;
  right: 0;
  height: 20px;
  background: transparent;
}

.desktop-nav .nav-item:hover .mega-panel {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(0) translateZ(0);
}

.desktop-nav .group\/item:hover {
  background-color: rgba(255, 255, 255, 0.05);
}

/* Task 3: Icon Colors */
.desktop-nav .group\/item .icon-teal { color: #2ED3C6; }
.desktop-nav .group\/item .icon-coral { color: #F96F6E; }

.desktop-nav .group\/item:hover .icon-teal,
.desktop-nav .group\/item:hover .icon-coral {
  filter: brightness(1.2);
}

/* Task 4: Typography & Case */
.desktop-nav .mega-title-text {
  font-family: 'Big Shoulders Display', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-size: 1.1rem;
  color: #F4F1ED; /* Task 2: White/Paper */
}

.desktop-nav .mega-desc-text {
  font-family: 'Inter', sans-serif;
  font-size: 0.75rem;
  color: #A1A1AA; /* Task 2: Muted Zinc */
  margin-top: 0.25rem;
}

</style>
</head>
