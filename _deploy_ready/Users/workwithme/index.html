<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <!-- Primary Meta -->
  <title>Entering the Hub. Luis Gilberto</title>
  <meta name="description" content="IMC Services Hub. Integrated marketing, creative systems, and growth orchestration.">

  <!-- Open Graph / iMessage / Slack -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://luis-gilberto.com/workwithme">
  <meta property="og:title" content="Entering the Hub. Luis Gilberto">
  <meta property="og:description" content="IMC Services Hub. Integrated marketing, creative systems, and growth orchestration.">
  <meta property="og:image" content="https://luis-gilberto.com/IMCServices/assets/images/og-workwithme.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter (also used by many messengers) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Entering the Hub. Luis Gilberto">
  <meta name="twitter:description" content="IMC Services Hub. Integrated marketing, creative systems, and growth orchestration.">
  <meta name="twitter:image" content="https://luis-gilberto.com/IMCServices/assets/images/og-workwithme.jpg">

  <!-- Preload for snappy start -->
  <link rel="preload" as="video" href="../IMCServices/assets/videos/the_hub_final.mp4" type="video/mp4">

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="../IMCServices/assets/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../IMCServices/assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../IMCServices/assets/images/favicon-16x16.png">
  <link rel="manifest" href="../IMCServices/assets/images/site.webmanifest">
  <link rel="mask-icon" href="../IMCServices/assets/images/safari-pinned-tab.svg" color="#ff6b35">
  <meta name="msapplication-TileColor" content="#ff6b35">
  <meta name="theme-color" content="#ffffff">

  <style>
    :root{
      --coral:#F96F6E;
      --ink:#000;
    }
    html,body{height:100%;margin:0;background:#000}

    /* Fullscreen overlay container */
    #splash{
      position:fixed; inset:0; z-index:9999;
      display:grid; place-items:center; overflow:hidden;
      background: #000;
    }

    /* === Video: full-bleed cinematic === */
    #splash video{
      position: absolute; inset:0;
      width:100vw; height:100vh;
      object-fit:cover;
      object-position:center;
      filter: brightness(.96) contrast(1.08) saturate(1.03);
    }

    /* === Vignette + grain overlay === */
    #splash::after{
      content:""; position:absolute; inset:0; pointer-events:none;
      background:
        radial-gradient(120% 120% at 50% 60%, rgba(0,0,0,0) 40%, rgba(0,0,0,.22) 75%, rgba(0,0,0,.45) 100%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, rgba(0,0,0,0) 1px 2px);
      mix-blend-mode: multiply;
    }

    /* === Coral ambient glow === */
    .coral-glow{
      position:absolute; inset:0; pointer-events:none;
      background: radial-gradient(42% 28% at 62% 54%, rgba(249,111,110,.18), transparent 65%);
      filter: blur(50px);
      opacity:.35; animation: glowPulse 3s ease-in-out infinite alternate;
    }
    @keyframes glowPulse{ from{opacity:.22} to{opacity:.4} }

    /* === Refined watermark (white) === */
    .lg-watermark{
      position:fixed; right:28px; bottom:22px; width:64px; height:auto;
      opacity:.55;
      filter: drop-shadow(0 0 8px rgba(0,0,0,.45));
      mix-blend-mode: screen;
      transition: opacity .3s ease, transform .3s ease;
      animation: markIn .5s ease .8s forwards;
    }
    @keyframes markIn{ from{opacity:0; transform:translateY(4px)} to{opacity:.55; transform:none} }

    /* === Refined Skip button === */
    .skip{
      position:fixed; left:18px; bottom:18px; z-index:10000;
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.25);
      color:#fff; border-radius:999px;
      padding:.48rem .72rem; font:500 12px/1 Inter,system-ui; letter-spacing:.02em;
      backdrop-filter: blur(4px);
      transition: transform .2s ease, background .2s ease, border-color .2s ease, opacity .2s ease;
      opacity:.75;
    }
    .skip:hover{ transform: translateY(-1px); opacity:1; background:rgba(0,0,0,.72); border-color:rgba(255,255,255,.4) }

    /* Fade out overlay */
    .fade-out{ animation: fadeOut .8s ease forwards; }
    @keyframes fadeOut{ to{ opacity:0; visibility:hidden } }



    /* === Reduced motion respect (keep) === */
    @media (prefers-reduced-motion: reduce){
      .coral-glow{ animation:none }
      .lg-watermark{ animation:none; opacity:.55 }
      #splash .neon-sync{ transition:none }
    }
  </style>
</head>
<body>

  <!-- Splash overlay -->
  <div id="splash" aria-label="Intro animation">
    <!-- keep existing helpers (e.g., coral-glow) here if present -->
    <div class="coral-glow"></div>

    <!-- Video -->
    <video id="splash-video" autoplay muted playsinline preload="auto">
      <source src="../IMCServices/assets/videos/the_hub_final.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Watermark: white version -->
  <img class="lg-watermark" src="../IMCServices/assets/images/LG-mark-white.svg" alt="Luis Gilberto mark">

  <!-- Skip -->
  <button class="skip" type="button" aria-label="Skip intro">Skip</button>

  <script>
  (function(){
    const splash = document.getElementById('splash');
    const vid    = document.getElementById('splash-video');
    if(!splash || !vid) return;

    // ===== Route out (keep your existing logic if you have it) =====
    const go = () => {
      splash.classList.add('fade-out');
      setTimeout(()=> window.location.href = "../IMCServices/", 700);
    };
    vid.addEventListener('ended', go);

    // Duration-aware fallback in case 'ended' doesn't fire
    let fallbackTimer;
    const setFallback = () => {
      const ms = Math.max( (vid.duration || 8) * 1000 + 200, 2000);
      clearTimeout(fallbackTimer);
      fallbackTimer = setTimeout(go, ms);
    };
    if (isFinite(vid.duration) && vid.duration > 0) setFallback();
    else vid.addEventListener('loadedmetadata', setFallback, { once:true });

    // Optional skip button support if present
    document.querySelector('.skip')?.addEventListener('click', () => {
      clearTimeout(fallbackTimer); go();
    });

    // Start playback (ignore promise rejection if autoplay blocks)
    vid.play().catch(()=>{});
  })();
  </script>
</body>
</html>
