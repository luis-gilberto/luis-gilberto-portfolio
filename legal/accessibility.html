<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Accessibility | Luis Gilberto</title>
  <style>
    :root{--bg:#0E0E0F;--text:#f5f5f5;--muted:#a0a0a0;--border:rgba(255,255,255,.12);--coral:#FF6B6B}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.7}
    .wrap{max-width:900px;margin:0 auto;padding:48px 24px}
    h1{font-family: 'Playfair Display', serif; font-size:2rem;margin:0 0 16px}
    p,li{color:var(--muted)}
    a{color:var(--coral);text-decoration:none}
    .card{border:1px solid var(--border);border-radius:12px;padding:24px;background:rgba(255,255,255,.04)}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Accessibility</h1>
    <div class="card">
      <p>We aim to meet WCAG 2.1 AA where feasible. If you encounter accessibility barriers, please reach out via <a href="/contact.html">Contact</a>.</p>
    </div>
  </main>
</body>
</html>
