<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" aria-labelledby="ttl-s-v1">
  <title id="ttl-s-v1">La noche — un niño en cama, un adulto sentado cerca, luna ámbar y estrellas suaves.</title>

  <!-- upper night atmosphere — sereno wash -->
  <path d="M0 0 L 800 0 L 800 260 C 640 250, 480 258, 320 252 C 200 248, 80 254, 0 250 z"
        fill="#8FA8C4" opacity="0.30"/>
  <path d="M0 200 C 200 190, 400 202, 600 194 C 700 190, 780 196, 800 194 L 800 260 L 0 260 z"
        fill="#8FA8C4" opacity="0.18"/>

  <!-- floor / room -->
  <path d="M0 260 L 800 260 L 800 480 L 0 480 z" fill="#FCE7DD" opacity="0.55"/>

  <!-- ambar moon — upper right -->
  <circle cx="640" cy="130" r="42" fill="#E4A85C" opacity="0.9"/>
  <circle cx="640" cy="130" r="42" fill="none" stroke="#1F2E46" stroke-width="1.9"/>
  <path d="M622 100 c -18 12, -22 44, -8 62 c 18 -6, 34 -22, 38 -42 c -8 -14, -20 -22, -30 -20z" fill="#E89BA8" opacity="0.5"/>
  <!-- ambient glow -->
  <circle cx="640" cy="130" r="66" fill="none" stroke="#E4A85C" stroke-width="1.4" opacity="0.4"/>
  <circle cx="640" cy="130" r="90" fill="none" stroke="#E4A85C" stroke-width="1.2" opacity="0.25"/>

  <!-- three stars -->
  <g fill="#E4A85C">
    <circle cx="140" cy="90" r="2.6" opacity="0.9"/>
    <circle cx="240" cy="150" r="1.8" opacity="0.7"/>
    <circle cx="400" cy="72" r="2.2" opacity="0.85"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════
       BED · isometric-ish angle, mid-scene, left-center
       Draws depth so it doesn't read as a flat rectangle
       ═══════════════════════════════════════════════════════════ -->

  <!-- BED shadow on floor (soft ambar spill from moon) -->
  <ellipse cx="330" cy="410" rx="180" ry="14" fill="#1F2E46" opacity="0.06"/>

  <!-- BED — headboard (back) -->
  <path d="M180 300 L 200 290 L 300 290 L 300 340 L 180 340 z" fill="#FFFFFF" opacity="0.95"/>
  <path d="M180 300 L 200 290 L 300 290 L 300 340 L 180 340 z"
        fill="none" stroke="#1F2E46" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- BED — mattress top surface (angled — reads as 3D) -->
  <path d="M180 340 L 300 340 L 460 340 L 480 370 L 180 400 L 180 400 z" fill="#FCE7DD"/>
  <path d="M180 340 L 460 340 L 480 370 L 180 400 z"
        fill="none" stroke="#1F2E46" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- BED — front face -->
  <path d="M180 400 L 480 370 L 480 405 L 180 425 z" fill="#F4A88A" opacity="0.28"/>
  <path d="M180 400 L 480 370 L 480 405 L 180 425 z"
        fill="none" stroke="#1F2E46" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- BED — pillow at head end (left) -->
  <path d="M198 314 L 260 314 L 260 336 L 198 336 z" fill="#FAF6F2"/>
  <path d="M198 314 L 260 314 L 260 336 L 198 336 z"
        fill="none" stroke="#1F2E46" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- CHILD lying — head on pillow, body under covers (bump silhouette) -->
  <!-- child head -->
  <g fill="none" stroke="#1F2E46" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="228" cy="322" rx="15" ry="14"/>
    <path d="M222 322 c 1 -1, 3 -1, 4 0"/>
    <path d="M232 322 c 1 -1, 3 -1, 4 0"/>
    <path d="M225 330 l 6 0"/>
  </g>

  <!-- BLANKET bump — covers over child's body, receding into perspective -->
  <path d="M250 336 C 290 342, 340 344, 400 340 C 430 338, 448 342, 452 348 L 452 358 C 420 362, 340 366, 260 360 C 246 358, 244 348, 250 336 z"
        fill="#F4A88A" opacity="0.55"/>
  <path d="M250 336 C 290 342, 340 344, 400 340 C 430 338, 448 342, 452 348"
        fill="none" stroke="#1F2E46" stroke-width="1.9" stroke-linecap="round"/>

  <!-- Small foot bump at end of blanket -->
  <path d="M448 352 c 6 -3, 12 -4, 16 -2 c 2 4, -2 8, -8 10"
        fill="none" stroke="#1F2E46" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ═══════════════════════════════════════════════════════════
       ADULT · sitting on floor to the right of the bed
       Clearly seated, no ambiguous horizontal lines
       ═══════════════════════════════════════════════════════════ -->
  <g fill="none" stroke="#1F2E46" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <!-- head -->
    <circle cx="590" cy="340" r="17"/>
    <!-- soft face -->
    <path d="M583 340 l 3 0"/>
    <path d="M594 340 l 3 0"/>
    <path d="M585 348 l 8 0"/>
    <!-- torso, seated upright but relaxed -->
    <path d="M590 357 L 592 410"/>
    <!-- arm forward toward bed, resting -->
    <path d="M590 372 C 574 378, 558 384, 546 388"/>
    <!-- hand — small closing curve, not a straight line -->
    <path d="M546 388 c -3 0, -5 2, -5 4"/>
    <!-- other arm at side, bent -->
    <path d="M594 372 C 604 380, 610 392, 608 402"/>
    <!-- legs folded in seated position — clearly angled, not straight -->
    <path d="M592 410 C 610 418, 626 424, 630 432"/>
    <path d="M592 412 C 578 420, 570 428, 574 434"/>
  </g>

  <!-- small ambar heart floating between child and adult -->
  <g transform="translate(490 296) scale(0.24)">
    <path d="M50 32 c -6 -10, -19 -12, -26 -5 c -8 7, -7 21, 3 31 l 23 22 l 24 -22 c 10 -10, 11 -24, 3 -31 c -7 -7, -21 -5, -27 5z"
          fill="#E4A85C" opacity="0.94" stroke="#1F2E46" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Floor line, subtle horizon reference -->
  <path d="M60 452 C 240 448, 500 452, 720 450"
        fill="none" stroke="#1F2E46" stroke-width="1.5" stroke-linecap="round" opacity="0.24"/>
</svg>