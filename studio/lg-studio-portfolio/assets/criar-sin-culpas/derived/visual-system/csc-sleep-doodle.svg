<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" aria-labelledby="ttl-sueno">
  <title id="ttl-sueno">Sueño — un close-up de la noche: la luna ámbar y el niño en cama abajo.</title>

  <!-- upper night — sereno wash -->
  <path d="M0 0 L 250 0 L 250 168 C 200 160, 100 172, 0 160 z"
        fill="#8FA8C4" opacity="0.34"/>

  <!-- horizon band, softer -->
  <path d="M0 130 C 60 122, 140 132, 250 128 L 250 168 L 0 168 z"
        fill="#8FA8C4" opacity="0.16"/>

  <!-- floor / room area — blush -->
  <path d="M0 168 L 250 168 L 250 250 L 0 250 z" fill="#FCE7DD" opacity="0.72"/>

  <!-- ==== THE MOON · dominant, upper right ==== -->
  <!-- outer glow rings -->
  <circle cx="176" cy="72" r="52" fill="none" stroke="#E4A85C" stroke-width="1.4" opacity="0.28"/>
  <circle cx="176" cy="72" r="40" fill="none" stroke="#E4A85C" stroke-width="1.4" opacity="0.42"/>
  <!-- ambar body -->
  <circle cx="176" cy="72" r="30" fill="#E4A85C" opacity="0.92"/>
  <!-- crescent shadow -->
  <path d="M162 52 c -12 8, -14 30, -6 42 c 12 -4, 22 -14, 26 -28 c -6 -10, -14 -16, -20 -14z" fill="#E89BA8" opacity="0.55"/>
  <!-- outline -->
  <circle cx="176" cy="72" r="30" fill="none" stroke="#1F2E46" stroke-width="1.9"/>

  <!-- three stars -->
  <g fill="#E4A85C">
    <circle cx="46" cy="52" r="2.4" opacity="0.9"/>
    <circle cx="80" cy="96" r="1.8" opacity="0.7"/>
    <circle cx="112" cy="42" r="2.2" opacity="0.85"/>
  </g>

  <!-- ==== BED · lower portion, small ==== -->
  <!-- mattress base -->
  <rect x="60" y="184" width="140" height="34" rx="10" fill="#FFFFFF" opacity="0.9"/>
  <path d="M70 190 L 108 190 L 108 212 L 70 212 z" fill="#FAF6F2"/>

  <!-- outline -->
  <g fill="none" stroke="#1F2E46" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <rect x="60" y="184" width="140" height="34" rx="10"/>
    <path d="M70 190 L 108 190 L 108 212 L 70 212 z"/>
  </g>

  <!-- child, sleeping, small -->
  <g fill="none" stroke="#1F2E46" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- head on pillow -->
    <circle cx="89" cy="200" r="10"/>
    <!-- closed eyes -->
    <path d="M84 199 c 1 -1, 3 -1, 4 0"/>
    <path d="M91 199 c 1 -1, 3 -1, 4 0"/>
    <!-- soft mouth -->
    <path d="M87 205 l 4 0"/>
    <!-- body lying — under covers -->
    <path d="M100 200 C 130 198, 160 202, 188 200"/>
    <!-- small foot bump -->
    <path d="M188 200 c 3 -1, 5 -2, 6 -3 c 1 2, 0 4, -2 5"/>
  </g>

  <!-- floor line -->
  <path d="M30 228 L 220 226"
        fill="none" stroke="#1F2E46" stroke-width="1.4" stroke-linecap="round" opacity="0.28"/>
</svg>