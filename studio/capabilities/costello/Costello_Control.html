<!--
  ─────────────────────────────────────────────────────────────
  PRESENTER CONTROL for Costello_Launch_Path.html

  SETUP
  1. Serve the repo root so control + deck share origin:
         npx serve -l 4173 .
     Control: http://localhost:4173/studio/capabilities/costello/Costello_Control.html
     Deck:    http://localhost:4173/studio/capabilities/costello/Costello_Launch_Path.html
     Two local file:// pages cannot control each other in Chrome.
  2. Press "Open deck", drag that window to the second screen,
     press F there for full screen. Keep this one on your laptop.

  The link uses postMessage, which works across windows. If the dot
  stays red, everything here still works as a prompter and you drive
  the deck with arrow keys on the other screen.

  KEYS  → space next · ← back · T timer · + − text size · F fullscreen
  ─────────────────────────────────────────────────────────────

<style>
:root{
  --bg:#0E1013;--panel:#161A1F;--panel2:#1E232A;--line:#272D35;--line2:#39414B;
  --text:#F0F2F4;--text2:#98A1AB;--text3:#5F6873;
  --accent:#C98A92;--oxblood:#8A2F38;--navy:#3D6A93;--warn:#D0606C;--go:#74B683;
  --display:'Fraunces',Georgia,serif;--ui:'IBM Plex Sans',-apple-system,sans-serif;--data:'IBM Plex Mono',ui-monospace,monospace;
  --prompt:27px;
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}

.bar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.bar .id{font-family:var(--data);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:none}
.dot.live{background:var(--go)}
.bar input{width:210px;background:var(--bg);color:var(--text);border:1px solid var(--line2);padding:7px 9px;font-family:var(--data);font-size:11px}
button{background:var(--panel2);color:var(--text2);border:1px solid var(--line2);padding:7px 11px;font-family:var(--data);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
.spacer{flex:1}
.clock{font-family:var(--data);font-size:17px;font-weight:500;min-width:64px;text-align:right}
.clock.over{color:var(--warn)}

.stage{flex:1;display:grid;grid-template-columns:220px minmax(0,1fr);min-height:0}
nav{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:6px 0 40px}
nav button{width:100%;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:baseline;text-align:left;background:none;border:0;border-left:2px solid transparent;padding:8px 12px;color:var(--text2);font-family:var(--ui);font-size:12px;text-transform:none;letter-spacing:0}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.on{background:var(--panel2);color:var(--text);border-left-color:var(--accent)}
nav button .n{font-family:var(--data);font-size:9.5px;color:var(--text3)}
nav button.on .n{color:var(--accent)}

.prompt{overflow-y:auto;padding:24px clamp(20px,3.4vw,52px) 92px}
.meta{font-family:var(--data);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:7px}
.meta b{color:var(--accent);font-weight:500}
h1.title{font-family:var(--display);font-weight:300;font-size:clamp(21px,2.5vw,30px);line-height:1.18;margin:0 0 20px;padding-bottom:16px;border-bottom:1px solid var(--line);max-width:22em}

.lbl{font-family:var(--data);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--text3);margin:0 0 10px;font-weight:500}
.say{font-family:var(--display);font-weight:300;font-size:var(--prompt);line-height:1.45;color:var(--text);max-width:26em;margin:0;padding-left:18px;border-left:2px solid var(--oxblood)}

.beat{margin-top:26px;padding:14px 16px;background:rgba(201,138,146,.10);border-left:2px solid var(--accent);font-size:15px;line-height:1.55;color:var(--text2);max-width:44em}
.beat b{color:var(--text);font-weight:500}
.ifup{margin-top:16px;padding:14px 16px;border-left:2px solid var(--line2);font-size:14px;line-height:1.55;color:var(--text2);max-width:44em}

.foot{position:fixed;left:220px;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 14px;background:var(--panel);border-top:1px solid var(--line)}
.foot .nextup{font-size:12px;color:var(--text3)}
.foot .note{font-family:var(--data);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn)}
@media(max-width:820px){
  html,body{height:auto;min-height:100%;overflow:auto}
  body{display:block;padding-bottom:74px}
  .bar{position:sticky;top:0;z-index:30;padding:10px 12px;gap:8px;flex-wrap:nowrap}
  .bar .id{font-size:9px}
  .dot{width:8px;height:8px}
  .bar input,#openDeck,#minus,#plus,.spacer{display:none}
  #timerBtn{margin-left:auto;padding:8px 10px}
  .clock{font-size:15px;min-width:54px}
  .stage{display:block;min-height:auto}
  nav{display:none}
  .prompt{overflow:visible;padding:22px 18px 30px}
  .meta{font-size:9px;line-height:1.4;margin-bottom:8px}
  h1.title{font-size:23px;line-height:1.15;margin-bottom:18px;padding-bottom:14px;max-width:none}
  .lbl{font-size:9px;margin-bottom:9px}
  .say{font-size:22px;line-height:1.48;max-width:none;padding-left:14px}
  .beat,.ifup{max-width:none;font-size:14px;line-height:1.5;margin-top:20px;padding:13px 14px}
  .foot{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:9px 10px;background:rgba(22,26,31,.97);gap:8px}
  .foot .note{display:none}
  .foot .nextup{font-size:10px;line-height:1.2;max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .foot span:last-child{display:flex;gap:8px;margin-left:auto}
  .foot button{padding:10px 13px;font-size:10px}
}
@media(max-width:430px){
  .prompt{padding:18px 15px 26px}
  h1.title{font-size:21px}
  .say{font-size:20px;line-height:1.5}
  .beat,.ifup{font-size:13px}
  .foot .nextup{max-width:38vw}
}
@media(max-width:820px) and (orientation:landscape){
  .bar{position:relative}
  .prompt{padding-top:16px}
  .say{font-size:19px;line-height:1.42}
}

/* ── Remote. postMessage works across windows, including from file://,
      unlike reaching into the other document directly. ── */
let deck=null, pending=null;
const dot=document.getElementById("dot");
function note(m){document.getElementById("linkNote").textContent=m||""}
function setLinked(v){dot.classList.toggle("live",v); if(v) note("")}
function ensureDeck(){
  if(deck && !deck.closed) return;
  const u=document.getElementById("deckUrl").value.trim();
  if(u) deck=window.open(u,"clfdeck");
}
function send(msg){
  ensureDeck();
  if(!deck||deck.closed){setLinked(false);note("deck window not open");return false}
  try{deck.postMessage(Object.assign({app:"lgdeck"},msg),"*");return true}
  catch(e){setLinked(false);note("cannot reach deck");return false}
}
function expectAck(){
  if(pending)clearTimeout(pending);
  pending=setTimeout(function(){setLinked(false);note("deck not responding \u00b7 drive it yourself")},1200);
}
window.addEventListener("message",function(e){
  const m=e.data;
  if(!m||typeof m!=="object"||m.app!=="lgdeck")return;
  if(m.t==="ready"||m.t==="ack"){setLinked(true); if(pending){clearTimeout(pending);pending=null}}
});
document.getElementById("openDeck").addEventListener("click",function(){
  const u=document.getElementById("deckUrl").value.trim();
  if(!u)return;
  deck=window.open(u,"clfdeck");
  note("connecting\u2026");
  setTimeout(function(){send({t:"goto",i:idx});expectAck()},1400);
});
setInterval(function(){if(deck&&!deck.closed){send({t:"ping"});expectAck()}},8000);

/* ── Render ── */
let idx=0;
const nav=document.getElementById("nav"), prompt=document.getElementById("prompt");

function buildNav(){
  nav.innerHTML=CARDS.map(function(c,i){
    const label=c.eyebrow.replace(/^\d+\s*[·.]\s*/,"")||"Cover";
    const num=(c.eyebrow.match(/^\d+/)||["\u2014"])[0];
    return '<button type="button" data-i="'+i+'"><span class="n">'+num+'</span><span>'+label.toLowerCase().replace(/(^|\s)\S/g,function(t){return t.toUpperCase()})+'</span></button>';
  }).join("");
  nav.querySelectorAll("button").forEach(function(b){
    b.addEventListener("click",function(){go(+b.dataset.i)});
  });
}

function render(){
  const c=CARDS[idx];
  let h='<div class="meta"><b>'+(c.eyebrow||"Cover")+'</b> &nbsp;\u00b7&nbsp; '+(idx+1)+' of '+CARDS.length+'</div>';
  h+='<h1 class="title">'+c.title+'</h1>';
  h+='<p class="lbl">Say</p><p class="say">'+c.say+'</p>';
  if(c.pause) h+='<div class="beat"><b>Pause.</b> '+c.pause+'</div>';
  if(c["if"]) h+='<div class="ifup"><b>If it comes up.</b> '+c["if"]+'</div>';
  prompt.innerHTML=h;
  prompt.scrollTop=0;
  nav.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",+b.dataset.i===idx)});
  const nx=CARDS[idx+1];
  document.getElementById("nextup").textContent=nx?("Next \u00b7 "+(nx.eyebrow||"")):"End";
}

function go(i){
  idx=Math.max(0,Math.min(CARDS.length-1,i));
  render();
  if(send({t:"goto",i:idx})) expectAck();
}
document.getElementById("next").addEventListener("click",function(){go(idx+1)});
document.getElementById("prev").addEventListener("click",function(){go(idx-1)});

/* ── Size, keys ── */
let size=27;
function setSize(v){size=Math.max(16,Math.min(46,v));document.documentElement.style.setProperty("--prompt",size+"px")}
document.getElementById("plus").addEventListener("click",function(){setSize(size+3)});
document.getElementById("minus").addEventListener("click",function(){setSize(size-3)});
document.addEventListener("keydown",function(e){
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();go(idx+1)}
  else if(e.key==="ArrowLeft"){e.preventDefault();go(idx-1)}
  else if(e.key==="t"||e.key==="T")toggleTimer();
  else if(e.key==="+"||e.key==="=")setSize(size+3);
  else if(e.key==="-")setSize(size-3);
  else if(e.key==="f"||e.key==="F"){
    if(!document.fullscreenElement){document.documentElement.requestFullscreen()}
    else{document.exitFullscreen()}
  }
});

/* ── Timer ── */
let t0=null,tick=null;
const clock=document.getElementById("clock"), timerBtn=document.getElementById("timerBtn");
function fmt(x){const m=Math.floor(x/60),s=x%60;return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function elapsed(){return t0?Math.floor((Date.now()-t0)/1000):0}
function toggleTimer(){
  if(t0){t0=null;clearInterval(tick);timerBtn.textContent="Start"}
  else{
    t0=Date.now();timerBtn.textContent="Stop";
    tick=setInterval(function(){
      clock.textContent=fmt(elapsed());
      clock.classList.toggle("over",elapsed()>30*60);
    },1000);
  }
}
timerBtn.addEventListener("click",toggleTimer);

buildNav();setSize(size);render();
</script>
</body>
</html>
