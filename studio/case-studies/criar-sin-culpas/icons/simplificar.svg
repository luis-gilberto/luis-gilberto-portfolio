<!-- 12 · SIMPLIFICAR — vessel/frame with objects being removed.
     Musgo wash. Minuto 2: menos ruido, menos preguntas, menos público.
     Subtraction, not a box. Three tiny shapes fade out at the edges. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- musgo wash under vessel -->
  <path d="M28 40 c 0 -6, 6 -10, 12 -10 h 20 c 6 0, 12 4, 12 10 v 20 c 0 6 -6 10 -12 10 h -20 c -6 0 -12 -4 -12 -10z"
        fill="#8A9E7E" opacity="0.32" transform="translate(2 3) rotate(-3 50 50)"/>

  <g fill="none" stroke="#1F2E46" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <!-- inner vessel — a bounded space -->
    <path d="M32 40 c 0 -4, 4 -8, 8 -8 h 22 c 4 0, 8 4, 8 8 v 20 c 0 4 -4 8 -8 8 h -22 c -4 0 -8 -4 -8 -8z"/>
    <!-- one small object *inside*, calm -->
    <circle cx="50" cy="50" r="4"/>
  </g>

  <!-- three shapes fading OUT (departing) — reduced opacity, at the edges -->
  <g fill="none" stroke="#1F2E46" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- one leaving top-left -->
    <path d="M18 22 l 6 6" opacity="0.4"/>
    <path d="M14 26 l 6 6" opacity="0.25"/>
    <!-- one leaving top-right -->
    <circle cx="82" cy="24" r="2.5" opacity="0.4"/>
    <circle cx="88" cy="18" r="1.8" opacity="0.22"/>
    <!-- one leaving bottom-right -->
    <path d="M78 78 l 6 6" opacity="0.4"/>
    <path d="M84 74 l 6 6" opacity="0.25"/>
  </g>
</svg>
