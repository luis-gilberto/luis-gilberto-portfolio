<!-- 16 · UMBRAL v2 — two rooms side by side, opening between.
     Peach wash (warm room) + sereno wash (calm room).
     Reads as "moving from one world to another". -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- LEFT room (warm — inside the screen) — peach wash -->
  <path d="M14 32 L 44 32 L 44 76 L 14 76 z"
        fill="#F4A88A" opacity="0.42" transform="translate(2 3) rotate(-2 30 54)"/>

  <!-- RIGHT room (calm — after screens) — sereno wash -->
  <path d="M56 32 L 86 32 L 86 76 L 56 76 z"
        fill="#8FA8C4" opacity="0.38" transform="translate(-2 3) rotate(2 70 54)"/>

  <g fill="none" stroke="#1F2E46" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <!-- left room outline -->
    <path d="M14 76 L 14 32 L 44 32"/>
    <!-- right room outline -->
    <path d="M56 32 L 86 32 L 86 76"/>
    <!-- shared floor -->
    <path d="M10 76 L 90 76"/>
    <!-- opening — small arched threshold between rooms -->
    <path d="M44 76 L 44 44 c 0 -4, 3 -6, 6 -6 c 3 0, 6 2, 6 6 L 56 76"/>
  </g>

  <!-- tiny geometric shapes on LEFT (the screen world) -->
  <g fill="#E89BA8" opacity="0.85">
    <circle cx="24" cy="46" r="2.2"/>
    <rect x="30" y="52" width="4" height="4" rx="1"/>
    <circle cx="22" cy="60" r="1.8"/>
  </g>

  <!-- small figure walking THROUGH the opening, mid-passage -->
  <g fill="none" stroke="#1F2E46" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="60" r="4.5"/>
    <path d="M50 64.5 L 50 74"/>
    <path d="M50 68 L 46 72"/>
    <path d="M50 68 L 54 72"/>
  </g>
</svg>
