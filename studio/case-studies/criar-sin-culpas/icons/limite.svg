<!-- 13 · LÍMITE — soft protective perimeter around a small figure.
     Terracota wash, but NOT a shield-crest. Curved hand-drawn arc.
     Minuto 4: sostén el límite sin pelear. Protección, no confrontación. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- terra wash — a soft arc, not a full shield -->
  <path d="M22 40 c 0 -14, 12 -22, 28 -22 c 16 0, 28 8, 28 22 c 0 22 -12 40 -28 42 c -16 -2 -28 -20 -28 -42z"
        fill="#C45A47" opacity="0.28" transform="translate(2 3) rotate(-3 50 52)"/>

  <g fill="none" stroke="#C45A47" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer perimeter — hand-drawn curve, not a symmetric shield -->
    <path d="M24 40 c 0 -13, 12 -22, 26 -22 c 15 0, 26 9, 26 22 c 0 22 -11 40 -26 42 c -15 -2 -26 -20 -26 -42z"/>
  </g>

  <!-- small figure inside — the one being protected -->
  <g fill="none" stroke="#1F2E46" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="48" r="6"/>
    <path d="M50 54 L 50 68"/>
    <path d="M50 60 L 44 66"/>
    <path d="M50 60 L 56 66"/>
  </g>
</svg>
