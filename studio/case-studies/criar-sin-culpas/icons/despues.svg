<!-- 15 · DESPUÉS — cloud parting, three ámbar rays passing through.
     Post-crisis. Ámbar + sereno washes.
     Nube: sereno. Rayos: ámbar. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- sereno wash — the cloud, imperfect -->
  <path d="M20 44 c -4 -8, 4 -18, 14 -16 c 4 -8, 16 -10, 22 -4 c 8 -4, 20 2, 20 12 c 8 2, 12 12, 6 18 c 4 8 -6 16 -14 12 c -6 8 -20 8 -26 0 c -8 4 -20 -2 -22 -12 c -6 -2 -8 -8 0 -10z"
        fill="#8FA8C4" opacity="0.4" transform="translate(2 3) rotate(-3 50 44)"/>

  <!-- ambar rays — three, passing diagonally through the parting cloud -->
  <g stroke="#E4A85C" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M38 60 L 30 84" opacity="0.85"/>
    <path d="M50 62 L 46 88" opacity="0.9"/>
    <path d="M62 60 L 68 84" opacity="0.75"/>
  </g>

  <!-- cloud outline — hand-drawn, opens in the middle -->
  <g fill="none" stroke="#1F2E46" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <!-- left half of cloud -->
    <path d="M20 44 c -4 -8, 4 -18, 14 -16 c 3 -6, 12 -8, 18 -4"/>
    <path d="M20 44 c -4 4 0 12 6 14 c 4 6 12 6 16 2"/>
    <!-- right half of cloud -->
    <path d="M56 24 c 8 -4, 20 2, 20 12 c 8 2, 12 12, 6 18"/>
    <path d="M82 54 c 4 6 -4 14 -12 14 c -4 4 -10 4 -14 0"/>
  </g>
</svg>
