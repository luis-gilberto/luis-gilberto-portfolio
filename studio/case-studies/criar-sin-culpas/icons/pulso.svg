<!-- 09 · PULSO — soft breath ripple, three concentric rings.
     Sereno wash behind, navy line. Apertura del artículo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- sereno wash -->
  <circle cx="50" cy="50" r="34" fill="#8FA8C4" opacity="0.35" transform="translate(2 3) rotate(-4 50 50)"/>
  <g fill="none" stroke="#1F2E46" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer ring, imperfect -->
    <path d="M50 18 c 18 1, 32 15, 32 32 c 0 18 -15 32 -33 32 c -17 0 -31 -15 -31 -33 c 0 -17 15 -31 32 -31z"/>
    <!-- middle ring -->
    <path d="M50 30 c 12 0, 22 10, 22 22 c 0 11 -10 21 -22 21 c -11 0 -21 -11 -21 -22 c 0 -11 10 -21 21 -21z" opacity="0.7"/>
    <!-- inner ring / heartbeat core -->
    <path d="M50 42 c 5 0, 9 4, 9 9 c 0 5 -4 9 -9 9 c -5 0 -9 -4 -9 -9 c 0 -5 4 -9 9 -9z" opacity="0.9"/>
    <!-- center dot -->
    <circle cx="50" cy="51" r="1.8" fill="#1F2E46" stroke="none"/>
  </g>
</svg>
