<!-- 10 · RITMO — five-segment horizontal pulse.
     Heartbeat-monitor pattern. Terracota, urgency without aggression.
     TL;DR crisis: pasos cortos, rápidos. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- terra wash pill behind -->
  <rect x="12" y="38" width="76" height="24" rx="12" fill="#C45A47" opacity="0.28" transform="translate(2 3) rotate(-3 50 50)"/>
  <g fill="none" stroke="#1F2E46" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <!-- baseline entering -->
    <path d="M14 50 L 24 50"/>
    <!-- five short peaks — heartbeat rhythm -->
    <path d="M24 50 L 28 40 L 32 60 L 36 46 L 40 54 L 44 42 L 48 58 L 52 46 L 56 54 L 60 40 L 64 60 L 68 50"/>
    <!-- baseline exiting -->
    <path d="M68 50 L 86 50"/>
    <!-- accent dots — two terra flecks that mark the "start/end" of the crisis window -->
    <circle cx="18" cy="50" r="2.2" fill="#C45A47" stroke="none"/>
    <circle cx="82" cy="50" r="2.2" fill="#C45A47" stroke="none"/>
  </g>
</svg>
