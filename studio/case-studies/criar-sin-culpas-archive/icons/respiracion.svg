<!-- 11 · RESPIRACIÓN — open circle + soft exhale trail.
     Sereno wash. Minuto 1: baja tu propia velocidad. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- sereno wash — offset -->
  <ellipse cx="46" cy="52" rx="24" ry="22" fill="#8FA8C4" opacity="0.42" transform="translate(2 3) rotate(-4 46 52)"/>
  <g fill="none" stroke="#1F2E46" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <!-- main breath circle, imperfect -->
    <path d="M46 30 c 12 0, 22 10, 22 22 c 0 11 -10 22 -22 22 c -12 0 -22 -11 -22 -22 c 0 -12 10 -22 22 -22z"/>
    <!-- exhale trail — three soft curves flowing right -->
    <path d="M70 46 c 4 -2, 8 -2, 12 0" opacity="0.85"/>
    <path d="M72 52 c 6 -2, 12 -1, 18 2" opacity="0.7"/>
    <path d="M70 58 c 4 -1, 8 0, 12 2" opacity="0.55"/>
    <!-- inner dot — the "pause" -->
    <circle cx="46" cy="52" r="2.4" fill="#1F2E46" stroke="none"/>
  </g>
</svg>
