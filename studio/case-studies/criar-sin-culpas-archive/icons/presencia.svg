<!-- 14 · PRESENCIA — two figures close but not touching.
     Ámbar wash connecting them. Reconexión implicada, no forzada.
     Minuto 5: no busques cierre todavía. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- ambar wash — soft field connecting the two -->
  <ellipse cx="50" cy="54" rx="34" ry="18" fill="#E4A85C" opacity="0.32" transform="translate(2 3) rotate(-2 50 54)"/>

  <g fill="none" stroke="#1F2E46" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <!-- left figure — slightly smaller (child) -->
    <circle cx="34" cy="46" r="8"/>
    <path d="M34 54 L 34 74"/>
    <path d="M34 62 L 28 70"/>
    <path d="M34 62 L 40 70"/>

    <!-- right figure — slightly taller (adult) -->
    <circle cx="66" cy="42" r="10"/>
    <path d="M66 52 L 66 76"/>
    <path d="M66 60 L 58 70"/>
    <path d="M66 60 L 74 70"/>
  </g>

  <!-- tiny ambar dot floating between them — the felt presence -->
  <circle cx="50" cy="54" r="2.2" fill="#E4A85C" stroke="#1F2E46" stroke-width="0.6"/>
</svg>
