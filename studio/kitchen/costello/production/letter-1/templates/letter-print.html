<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Costello Letter 1 · Print Ready</title>
<meta name="robots" content="noindex, nofollow, noarchive" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" />
<style>
  @page { size: 8.5in 11in; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #FFFFFF; }
  body {
    width: 8.5in;
    height: 11in;
    overflow: hidden;
    color: #111111;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .sheet {
    width: 8.5in;
    height: 11in;
    display: flex;
    flex-direction: column;
    background: #FDFCFA;
    overflow: hidden;
  }
  .review-banner {
    flex: 0 0 auto;
    font-family: Inter, "Helvetica Neue", Arial, sans-serif;
    font-size: 7px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: #8A847A;
    text-align: center;
    padding: 5px 20px 1px;
  }
  .letterhead { background: #2E4A6B; flex: 0 0 auto; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 16px 1.15in;
  }
  .lh-mark { width: 140px; height: auto; display: block; }
  .contact {
    text-align: right;
    font-family: Inter, "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    color: #FBFAF7;
  }
  .contact .num { font-weight: 500; letter-spacing: .02em; }
  .contact .site { margin-top: 4px; opacity: .9; }
  .accentbar { height: 3px; background: #F37021; }

  /* Correspondence measure ~6.2in: (8.5 - 2×1.15) */
  .body {
    flex: 0 0 auto;
    padding: 0.40in 1.15in 0;
    max-width: none;
  }
  .body p {
    margin: 0 0 11pt 0;
    font-family: Cambria, Constantia, Georgia, serif;
    font-size: 10.75pt;
    line-height: 1.42;
    color: #111111;
  }
  /* Salutation: space below before first body paragraph */
  .body > p:first-child {
    margin: 0 0 11pt 0;
  }
  .body .para {
    margin: 0 0 11pt 0;
    color: #45423D;
  }
  .body .para:last-of-type {
    margin-bottom: 0;
  }

  .signoff {
    margin: 15pt 0 0 0 !important;
    color: #111111 !important;
  }
  .sigspace {
    margin: 13pt 0 0 0;
    line-height: 0;
  }
  .sigmark {
    display: block;
    width: 1.75in;
    max-width: 1.75in;
    height: auto;
    object-fit: contain;
    margin-left: calc(1.75in * -71 / 321);
    mix-blend-mode: darken;
  }
  .signer {
    margin: 3pt 0 0 0 !important;
    font-weight: 600;
    line-height: 1.35 !important;
    color: #111111 !important;
  }
  .signerfirm {
    margin: 5pt 0 0 0 !important;
    color: #45423D !important;
    line-height: 1.35 !important;
  }
  .siglines {
    margin-top: 9pt;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .siglines p {
    margin: 0 !important;
    line-height: 1.36 !important;
    font-size: 10.75pt;
    color: #111111;
  }
  .siglines p:nth-child(3) {
    margin-top: 8pt !important;
  }

  /* Intentional breathing room above footer (footer stays page-bottom) */
  .page-breath {
    flex: 1 1 auto;
    min-height: 0.38in;
  }

  .footband {
    flex: 0 0 auto;
    background: #2E4A6B;
    padding: 11px 1.15in;
    text-align: center;
  }
  .footband span {
    display: block;
    font-family: Inter, "Helvetica Neue", Arial, sans-serif;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: .06em;
    color: #FBFAF7;
  }
</style>
</head>
<body>
  <article class="sheet" aria-label="Costello Letter 1 editorial proof">
    <header class="letterhead">
      <div class="row">
        <svg class="lh-mark" viewBox="0 0 340 120" aria-label="Costello Law Firm PLLC">
          <g fill="none" stroke="#FFFFFF" stroke-width="2.4">
            <rect x="8" y="14" width="20" height="20" />
            <rect x="8" y="50" width="20" height="20" />
            <rect x="8" y="86" width="20" height="20" />
          </g>
          <g fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="300" letter-spacing="1.6">
            <text x="46" y="32" font-size="24">COSTELLO</text>
            <text x="46" y="68" font-size="24">LAW</text>
            <text x="46" y="104" font-size="24">FIRM<tspan font-size="10" dx="4" dy="-8" letter-spacing="0.6">PLLC</tspan></text>
          </g>
        </svg>
        <div class="contact">
          <div class="num">206-775-4381</div>
          <div class="site">www.costellolawfirm.com</div>
        </div>
      </div>
      <div class="accentbar"></div>
    </header>
    <div class="body">
      <!--LETTER_BODY-->
    </div>
    <div class="page-breath" aria-hidden="true"></div>
    <footer class="footband">
      <span>Costello Law Firm PLLC · 315 Fifth Avenue South, Suite 1000, Seattle, WA 98104</span>
    </footer>
  </article>
</body>
</html>
