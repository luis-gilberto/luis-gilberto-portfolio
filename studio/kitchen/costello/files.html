<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Costello Law Firm · Files — LG Studio</title>
<meta name="robots" content="noindex, nofollow, noarchive" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" />
<link rel="stylesheet" href="../_workspace/shell.css" />
<link rel="stylesheet" href="files.css" />
</head>
<body class="lg-page lg-files" data-lg-page="files" data-lg-mode="Documents and assets / Signature copy">
  <div class="lg-grain" aria-hidden="true"></div>
  <main class="lg-wrap lg-main">
    <header class="art-hero">
      <p class="lg-kicker">Files · The permanent record</p>
      <h1 class="lg-read">Download and countersign<br>the Website SOW</h1>
      <p class="lg-lede" id="lede">The current website agreement, Brand System Portal, and working proof are available. Expected files remain listed quietly until they are received.</p>
    </header>

    <div id="priority"></div>

    <section class="art-section" aria-labelledby="cur-title">
      <header class="art-head">
        <h2 id="cur-title" class="art-label">Current shelf</h2>
        <p class="art-count" id="cur-count"></p>
      </header>
      <div class="art-register" id="current-list"></div>
    </section>

    <section class="art-section is-permanent" aria-label="The file shelf">
      <header class="art-head">
        <h2 class="art-label">The file shelf</h2>
      </header>
      <div id="cats"></div>
      <details class="lg-fold is-filing">
        <summary>Filing state<span class="art-count" id="exp-count"></span></summary>
        <div class="lg-fold-body art-register" id="expected"></div>
      </details>
    </section>
  </main>
  <script src="../../capabilities/costello/data/costello-project-state.js"></script>
  <script src="../_workspace/shell.js"></script>
  <script>
  function fileHref(rel) {
    return CostelloState.href(rel);
  }
  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function fileName(href) {
    return decodeURIComponent(String(href || "").split("/").pop() || "");
  }
  function fileKind(href) {
    var name = fileName(href);
    var path = String(href || "");
    if (/\.pdf$/i.test(name)) return "PDF";
    if (/\.docx?$/i.test(name)) return "DOCX";
    if (/\.html?$/i.test(name) || /\/$/.test(path)) return "PAGE";
    return "";
  }
  function fileIcon(kind) {
    var mark = "file-icon" + (kind ? " is-" + kind.toLowerCase() : "");
    var body = "<path d=\"M4.2 1.75h5.1L12 4.6v9.65H4.2z\"/><path d=\"M9.2 1.75V4.7H12\"/>";
    if (kind === "PDF") {
      body += "<rect x=\"5.1\" y=\"10.55\" width=\"5.8\" height=\"2.05\" fill=\"currentColor\" stroke=\"none\"/>";
    } else if (kind === "DOCX") {
      body += "<path d=\"M5.5 7.15h5.1M5.5 8.95h5.1M5.5 10.75h3.4\"/>";
    } else if (kind === "PAGE") {
      body += "<path d=\"M6.1 6.9h3.8M6.1 8.7h3.8\" stroke-opacity=\"0.7\"/>";
    }
    return "<span class=\"" + mark + "\" aria-hidden=\"true\"><svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.25\">" + body + "</svg></span>";
  }
  function statusClass(status) {
    var value = String(status || "").toUpperCase();
    if (/AWAITING|NEED|NOT RECEIVED/.test(value)) return " is-need";
    if (/SIGNED BY LG|PROOF|COPY APPROVED|CERTIFICATE|CANONICAL|SETTLED/.test(value)) return " is-ok";
    return "";
  }
  function fileStrip(item) {
    var kind = fileKind(item.href);
    if (!kind) return "";
    return "<div class=\"art-strip\">" + fileIcon(kind) +
      "<span class=\"file-badge\">" + kind + "</span>" +
      "<span class=\"file-name\">" + escapeHtml(fileName(item.href)) + "</span></div>";
  }
  var signCount = 0;
  function priorityArtifact(item) {
    signCount += 1;
    var titleId = "sign-title-" + signCount;
    var meta = item.version ? "<p class=\"art-meta\">" + escapeHtml(item.version) + "</p>" : "";
    return "<article class=\"art-priority\" aria-labelledby=\"" + titleId + "\">" +
      "<div class=\"art-priority-main\">" +
        "<p class=\"lg-kicker\">" + escapeHtml(item.kicker || "Website SOW · Signature copy") + "</p>" +
        "<h3 id=\"" + titleId + "\">" + escapeHtml(item.title) + "</h3>" +
        meta +
        fileStrip(item) +
        "<ol class=\"file-steps\">" +
          "<li>Download the signed PDF</li>" +
          "<li>Add Costello Law Firm’s signature</li>" +
          "<li>Reply to Luis with the countersigned PDF</li>" +
        "</ol>" +
      "</div>" +
      "<div class=\"art-priority-side\">" +
        "<p class=\"art-support\">" + escapeHtml(item.note || "") + "</p>" +
        "<div class=\"art-cta\">" +
          "<a class=\"lg-go is-teal\" href=\"" + fileHref(item.href) + "\">" +
            escapeHtml(item.cta || "Download signed PDF") + "</a>" +
        "</div>" +
      "</div></article>";
  }
  function artifactActions(item) {
    var links = [];
    if (item.role === "signature-copy" && item.cta) {
      links.push("<a class=\"art-action\" href=\"" + fileHref(item.href) + "\">" + escapeHtml(item.cta) + "</a>");
    }
    (item.actions || []).forEach(function (action) {
      links.push("<a class=\"art-action\" href=\"" + fileHref(action.href) + "\">" + escapeHtml(action.label) + "</a>");
    });
    return links.length ? "<div class=\"art-actions\">" + links.join("") + "</div>" : "<div class=\"art-actions\"></div>";
  }
  function artifactRow(item) {
    if (!item || !item.href) return "";
    var kind = fileKind(item.href);
    var secondary = item.role === "reference" ? " is-secondary" : "";
    if (item.role === "signature-copy") secondary += " is-sign-record";
    var marker = kind
      ? "<span class=\"art-mark\">" + fileIcon(kind) + "</span>"
      : "<span class=\"art-mark\" aria-hidden=\"true\"></span>";
    var identity = "<div class=\"art-identity\"><p class=\"art-title\"><a href=\"" + fileHref(item.href) + "\">" +
      escapeHtml(item.title) + "</a></p>" +
      (kind === "PDF" || kind === "DOCX"
        ? "<p class=\"file-name\">" + escapeHtml(fileName(item.href)) + "</p>"
        : "") +
      "</div>";
    var note = "<p class=\"art-note\">" + escapeHtml(item.note || "") + "</p>";
    var status = item.status
      ? "<p class=\"art-status" + statusClass(item.status) + "\">" + escapeHtml(item.status) + "</p>"
      : "<p class=\"art-status\"></p>";
    return "<div class=\"art-row" + secondary + "\">" + marker + identity + note + status + artifactActions(item) + "</div>";
  }
  function expectedRow(item) {
    return "<div class=\"art-row is-secondary\">" +
      "<span class=\"art-mark\" aria-hidden=\"true\"></span>" +
      "<div class=\"art-identity\"><p class=\"art-title\">" + escapeHtml(item.label) + "</p></div>" +
      "<p class=\"art-note\">" + escapeHtml(item.note || "") + "</p>" +
      "<p class=\"art-status" + statusClass(item.status) + "\">" + escapeHtml(item.status || "") + "</p>" +
      "<div class=\"art-actions\"></div></div>";
  }
  function categoryBody(cat) {
    var html = "";
    var lastGroup = "";
    (cat.items || []).forEach(function (item) {
      if (item.group && item.group !== lastGroup) {
        html += "<p class=\"art-subhead\">" + escapeHtml(item.group) + "</p>";
        lastGroup = item.group;
      }
      html += artifactRow(item);
    });
    return html;
  }
  fetch(CostelloState.href("capabilities/costello/data/costello-files.json"), { cache: "no-store" })
    .then(function (res) { if (!res.ok) throw new Error("files"); return res.json(); })
    .then(function (manifest) {
      var byId = {};
      manifest.categories.forEach(function (cat) {
        (cat.items || []).forEach(function (item) {
          if (item.id) byId[item.id] = item;
        });
      });
      var current = (manifest.currentIds || []).map(function (id) { return byId[id]; }).filter(Boolean);
      var priority = current.filter(function (item) { return item.role === "signature-copy"; });
      var shelf = current.filter(function (item) { return item.role !== "signature-copy"; });
      if (manifest.meta && manifest.meta.note) {
        document.getElementById("lede").textContent = manifest.meta.note;
      }
      document.getElementById("priority").innerHTML = priority.map(priorityArtifact).join("");
      document.getElementById("current-list").innerHTML = shelf.map(artifactRow).join("");
      document.getElementById("cur-count").textContent = shelf.length + " records";
      document.getElementById("cats").innerHTML = manifest.categories.map(function (cat) {
        if (!(cat.items && cat.items.length)) return "";
        var open = cat.id === "agreements" ? " open" : "";
        var tone = cat.id === "archive" ? " is-archive" : "";
        return "<details class=\"lg-fold" + tone + "\"" + open + ">" +
          "<summary>" + escapeHtml(cat.label) +
          "<span class=\"art-count\">" + cat.items.length + "</span></summary>" +
          "<div class=\"lg-fold-body art-register\">" + categoryBody(cat) + "</div></details>";
      }).join("");
      var expected = manifest.expected || [];
      document.getElementById("exp-count").textContent = String(expected.length);
      document.getElementById("expected").innerHTML = expected.map(expectedRow).join("");
    });
  </script>
</body>
</html>
