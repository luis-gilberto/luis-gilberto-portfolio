<!--
  ═══════════════════════════════════════════════════════════════
  HERO VISUAL · v2 · single-frame cartoon illustration + caption
  ═══════════════════════════════════════════════════════════════
  Replaces the old two-sheet paper composition in .er-hero-visual.
  Only the caption toggles with the language switch; the
  illustration itself is static (it's a single asset, not a
  bilingual pair like the demo assets).

  WHAT TO REMOVE from the page's <style>:
  · .er-hero-compose
  · .er-hero-sheet, .er-hero-sheet img
  · .er-hero-sheet--reveal, .er-hero-sheet--reveal img
  · .er-hero-sheet--read, .er-hero-sheet--read img
  · Any .er-hero-compose / .er-hero-sheet-- rules inside the
    1100px, 900px, and 640px media queries.

  WHAT TO REMOVE from the markup:
  · The two <div class="er-hero-sheet ...">...</div> blocks
    currently inside .er-hero-compose (the "reveal" and "read"
    sheets, sourced from data-er-asset="intervention" / "voice").

  WHAT STAYS UNTOUCHED:
  · The EL_RETRATO_ASSETS / EL_RETRATO_ALTS swap script at the
    bottom of the page — those assets (opening, voice, intervention,
    etc.) are still used later, inside the "How it unfolds" movements.
    Don't delete that script; it's unrelated to this hero swap.
  ═══════════════════════════════════════════════════════════════
-->

<style>
  .er-hero-frame {
    position: relative;
    width: min(100%, 620px);
    background: #F3EEE5;
    border: 1px solid rgba(21, 19, 15, 0.08);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
    padding: clamp(1.25rem, 2.4vw, 2rem) clamp(1.25rem, 2.4vw, 2rem) clamp(1.5rem, 2.8vw, 2.25rem);
  }
  .er-hero-frame-art {
    overflow: hidden;
  }
  .er-hero-frame-art img {
    width: 100%;
    height: auto;
    display: block;
  }
  .er-hero-caption {
    margin-top: clamp(1rem, 2vw, 1.5rem);
    text-align: center;
    font-family: var(--editorial);
    font-style: italic;
    font-size: clamp(1rem, .94rem + .25vw, 1.18rem);
    line-height: 1.4;
    color: var(--ink);
  }

  @media (max-width: 900px) {
    .er-hero-frame { width: min(100%, 460px); }
  }
  @media (max-width: 640px) {
    .er-hero-frame { width: 100%; padding: 1.1rem 1.1rem 1.4rem; }
    .er-hero-caption { font-size: 1rem; }
  }
</style>

<!--
  Drop this inside <figure class="er-hero-visual"> in place of the old
  .er-hero-compose block. Keep the parent <figure> and its
  data-aria-en/es attributes as they are.
-->
<div class="er-hero-frame">
  <div class="er-hero-frame-art">
    <img
      src="https://res.cloudinary.com/dogtoagya/image/upload/f_auto,q_auto,w_1000/v1786149678/reflect-on-us_qkkpum.png"
      alt="Editorial cartoon: executives at a boardroom table pointing at a mirror propped in an empty chair"
      data-alt-en="Editorial cartoon: executives at a boardroom table pointing at a mirror propped in an empty chair"
      data-alt-es="Caricatura editorial: ejecutivos en una mesa de juntas señalando un espejo apoyado en una silla vacía"
      width="1000" height="750" loading="eager" fetchpriority="high" decoding="async">
  </div>
  <p class="er-hero-caption" data-i18n-en="&ldquo;We think it captures who we really are.&rdquo;" data-i18n-es="&ldquo;Creemos que captura quiénes somos realmente.&rdquo;">&ldquo;We think it captures who we really are.&rdquo;</p>
</div>
