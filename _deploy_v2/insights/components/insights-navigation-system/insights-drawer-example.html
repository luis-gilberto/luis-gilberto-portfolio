<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/insights/assets/css/insights-navigation.css">
</head>
<body>
  <button id="mobileToggle" aria-controls="insightsDrawer" aria-expanded="false">Menu</button>
  <div id="drawerOverlay" class="drawer-overlay" hidden></div>
  <aside id="insightsDrawer" class="insights-drawer" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="drawer-header">
      <div class="drawer-brand">Insights</div>
      <button id="drawerClose" class="drawer-close" aria-label="Close">✕</button>
    </div>
    <div class="drawer-content">
      <nav class="drawer-section">
        <div class="section-label">Global</div>
        <a class="nav-link" href="/">Portfolio</a>
        <a class="nav-link" href="/insights/">Insights</a>
        <a class="nav-link" href="/TheHub/">The Hub</a>
      </nav>
      <nav class="drawer-section">
        <div class="section-label">Latest</div>
        <div id="nav-latest-content"></div>
      </nav>
      <nav class="drawer-section">
        <div class="section-label">Series</div>
        <div id="nav-series-content"></div>
      </nav>
      <nav class="drawer-section">
        <div class="section-label">Topics</div>
        <div id="nav-topics-content"></div>
      </nav>
    </div>
  </aside>
  <script src="/insights/assets/js/insights-navigation.js"></script>
</body>
</html>
