<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ee5a24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9ff3;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#aiGrad)" rx="20"/>
  
  <!-- AI Brain Icon -->
  <circle cx="200" cy="160" r="50" fill="none" stroke="white" stroke-width="3" opacity="0.8"/>
  <circle cx="180" cy="140" r="8" fill="white" opacity="0.9"/>
  <circle cx="220" cy="140" r="8" fill="white" opacity="0.9"/>
  <circle cx="200" cy="180" r="12" fill="white" opacity="0.7"/>
  
  <!-- Neural Network Lines -->
  <line x1="180" y1="140" x2="200" y2="180" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="220" y1="140" x2="200" y2="180" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="180" y1="140" x2="220" y2="140" stroke="white" stroke-width="2" opacity="0.6"/>
  
  <!-- Browser Window -->
  <rect x="120" y="220" width="160" height="100" fill="rgba(255,255,255,0.2)" rx="8" stroke="white" stroke-width="2"/>
  <rect x="120" y="220" width="160" height="20" fill="rgba(255,255,255,0.3)" rx="8 8 0 0"/>
  <circle cx="135" cy="230" r="3" fill="white" opacity="0.8"/>
  <circle cx="150" cy="230" r="3" fill="white" opacity="0.8"/>
  <circle cx="165" cy="230" r="3" fill="white" opacity="0.8"/>
  
  <text x="200" y="360" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="bold">AI BROWSING</text>
  <text x="200" y="385" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="14">Campaign</text>
</svg>