<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insights | Luis Gilberto</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="insights-navigation.css">
  
  <style>
    /* Base styles for demo */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: #fafafa;
    }
    
    .demo-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: white;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      z-index: 100;
    }
    
    .demo-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: #1a1a1a;
    }
    
    .menu-button {
      width: 40px;
      height: 40px;
      border: none;
      background: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    .menu-button span {
      width: 24px;
      height: 2px;
      background: #1a1a1a;
      transition: all 0.3s ease;
    }
    
    .demo-content {
      margin-top: 80px;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <!-- Demo Header -->
  <header class="demo-header">
    <div class="demo-logo">lg | insights</div>
    <button class="menu-button" id="menuButton">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- Drawer Overlay -->
  <div class="drawer-overlay" id="drawerOverlay"></div>

  <!-- Insights Navigation Drawer -->
  <nav class="insights-drawer" id="insightsDrawer">
    <div class="drawer-header">
      <div class="drawer-logo">lg | insights</div>
      <button class="drawer-close" id="drawerClose">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="drawer-content">
      <!-- Global Navigation -->
      <section class="nav-section">
        <h3 class="nav-section-header">GLOBAL</h3>
        <div class="global-nav">
          <a href="/portfolio" class="nav-main-link">Portfolio</a>
          <a href="/insights" class="nav-main-link active">Insights</a>
          <a href="/the-hub" class="nav-main-link">The Hub</a>
        </div>
      </section>

      <!-- Insights Sub-navigation -->
      <section class="nav-section">
        <h3 class="nav-section-header">INSIGHTS</h3>
        
        <!-- Latest Section -->
        <div class="nav-subsection">
          <div class="nav-subsection-header active">Latest</div>
          <div id="nav-latest-content">
            <!-- Dynamic content injected here -->
          </div>
        </div>

        <!-- Series Section -->
        <div class="nav-subsection">
          <div class="nav-subsection-header">Series</div>
          <div id="nav-series-content">
            <!-- Dynamic content injected here -->
          </div>
        </div>

        <!-- Topics Section -->
        <div class="nav-subsection">
          <div class="nav-subsection-header">Topics</div>
          <div id="nav-topics-content">
            <!-- Dynamic content injected here -->
          </div>
        </div>
      </section>
    </div>
  </nav>

  <!-- Demo Content -->
  <main class="demo-content">
    <h1>Click the menu button to open the drawer</h1>
    <p>This demonstrates the Insights navigation with proper article categorization.</p>
  </main>

  <!-- Scripts -->
  <script src="insights-navigation.js"></script>
  
  <script>
    // Drawer toggle functionality
    const menuButton = document.getElementById('menuButton');
    const drawerClose = document.getElementById('drawerClose');
    const drawer = document.getElementById('insightsDrawer');
    const overlay = document.getElementById('drawerOverlay');

    function openDrawer() {
      drawer.classList.add('open');
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      overlay.classList.remove('active');
      document.body.style.overflow = '';
    }

    menuButton.addEventListener('click', openDrawer);
    drawerClose.addEventListener('click', closeDrawer);
    overlay.addEventListener('click', closeDrawer);

    // Close on escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && drawer.classList.contains('open')) {
        closeDrawer();
      }
    });
  </script>

  <style>
    /* Additional styles for global nav and subsection headers */
    .global-nav {
      display: flex;
      flex-direction: column;
      padding: 0 1.5rem;
    }
    
    .nav-main-link {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 400;
      color: #1a1a1a;
      text-decoration: none;
      padding: 0.75rem 0;
      transition: color 0.2s ease;
    }
    
    .nav-main-link:hover {
      color: #FF6B5A;
    }
    
    .nav-main-link.active {
      color: #FF6B5A;
    }
    
    .nav-subsection {
      margin-top: 1.5rem;
    }
    
    .nav-subsection-header {
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: #1a1a1a;
      padding: 0.75rem 1.5rem;
      border-left: 3px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .nav-subsection-header.active {
      border-left-color: #FF6B5A;
      color: #FF6B5A;
    }
    
    .nav-subsection-header:hover {
      border-left-color: rgba(255, 107, 90, 0.5);
    }
  </style>
</body>
</html>
