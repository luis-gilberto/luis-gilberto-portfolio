<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seal-to-PNG Converter | StrategyIQ™</title>
    <style>
        body {
            background-color: #050505;
            color: #F4F1ED;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #0A0A0A;
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        h1 {
            font-family: 'Big Shoulders Display', sans-serif;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        p {
            color: rgba(255,255,255,0.4);
            font-size: 14px;
            margin-bottom: 32px;
        }
        #preview {
            width: 400px;
            height: 400px;
            background-image: 
                linear-gradient(45deg, #111 25%, transparent 25%), 
                linear-gradient(-45deg, #111 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #111 75%), 
                linear-gradient(-45deg, transparent 75%, #111 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button {
            background-color: #F96F6E;
            color: white;
            border: none;
            padding: 16px 32px;
            font-family: 'Big Shoulders Display', sans-serif;
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(249,111,110,0.3);
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Seal Export Utility</h1>
        <p>Generating high-resolution transparent PNG from StrategyIQ™ DNA</p>
        
        <div id="preview">
            <!-- SVG will be injected here -->
        </div>

        <button id="downloadBtn">Download Transparent PNG</button>
    </div>

    <canvas id="canvas" width="2000" height="2000"></canvas>

    <script>
        const svgUrl = '/lg-certified-seal.svg';
        const downloadBtn = document.getElementById('downloadBtn');
        const preview = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        async function init() {
            const response = await fetch(svgUrl);
            const svgText = await response.text();
            preview.innerHTML = svgText;
            
            const svgElement = preview.querySelector('svg');
            svgElement.style.width = '100%';
            svgElement.style.height = '100%';
        }

        downloadBtn.onclick = () => {
            const svgElement = preview.querySelector('svg');
            const svgData = new XMLSerializer().serializeToString(svgElement);
            const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(svgBlob);
            
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, 2000, 2000);
                
                const pngUrl = canvas.toDataURL('image/png');
                const downloadLink = document.createElement('a');
                downloadLink.href = pngUrl;
                downloadLink.download = 'lg-certified-seal-highres.png';
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
                
                URL.revokeObjectURL(url);
            };
            img.src = url;
        };

        init();
    </script>
</body>
</html>
