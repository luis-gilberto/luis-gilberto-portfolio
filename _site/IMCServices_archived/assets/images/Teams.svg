<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Microsoft Teams Logo -->
  <defs>
    <linearGradient id="teamsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5059c9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b83eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="80" height="80" fill="url(#teamsGradient)" rx="12"/>
  
  <!-- Teams "T" Symbol -->
  <rect x="15" y="20" width="50" height="8" fill="#ffffff" rx="4"/>
  <rect x="36" y="20" width="8" height="40" fill="#ffffff" rx="4"/>
  
  <!-- People icons -->
  <circle cx="25" cy="50" r="6" fill="#ffffff" opacity="0.8"/>
  <circle cx="40" cy="50" r="6" fill="#ffffff"/>
  <circle cx="55" cy="50" r="6" fill="#ffffff" opacity="0.8"/>
  
  <!-- Connection lines -->
  <line x1="31" y1="50" x2="34" y2="50" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <line x1="46" y1="50" x2="49" y2="50" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
</svg>