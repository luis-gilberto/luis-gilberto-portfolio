    <style>
        /* ===== ENHANCED ADVISORY PAGE STYLES ===== */
        
        /* Full-Viewport Snap Scrolling System */
        html {
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            overflow-y: scroll;
        }

        /* Each major section becomes a snap point */
        section {
            scroll-snap-align: start;
            scroll-snap-stop: normal;
        }
        
        /* Enhanced Color System */
        :root {
            --lg-coral: #f96f6e;
            --lg-teal: #2ed3c6;
            --lg-bg: #0f0f0f;
            --lg-fg: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.6);
            --glass-bg: rgba(0, 0, 0, 0.3);
            --glass-border: rgba(255, 255, 255, 0.2);
            --hover-bg: rgba(255, 255, 255, 0.12);
            
            /* Enhanced visual depth variables */
            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.15);
            --shadow-medium: 0 8px 32px rgba(0, 0, 0, 0.25);
            --shadow-strong: 0 16px 48px rgba(0, 0, 0, 0.35);
            --glow-coral: 0 0 20px rgba(249, 111, 110, 0.3);
            --glow-teal: 0 0 20px rgba(46, 211, 198, 0.3);
        }


            height: 30px;

        .nav-item:hover .nav-icon {

            font-size: 0.8rem;

            line-height: 1;
        }

        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--lg-fg);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
        }

        /* Global Reset with Enhanced Typography */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

            color: var(--lg-fg);

            scroll-behavior: smooth;
            position: relative;
            min-height: 100vh;
            font-weight: 400;
            letter-spacing: -0.01em;
        }
        
        /* Fade-in Animation System */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Section Divider Enhancement - Clean minimal style */
        .section-divider {
            padding: 2rem 0;

            justify-content: center;

            overflow: hidden;

        .divider-line {

        .divider-content {

            font-size: 0.85rem;

            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }



        /* Custom gradient backgrounds */
        .gradient-bg {
            background: radial-gradient(1200px 800px at 10% -10%, rgba(249,111,110,0.08), rgba(0,0,0,0) 60%),

        }

        /* Enhanced Typography System */
        h1, h2, h3, h4, h5, h6 {

            line-height: 1.2;

        /* CSS Variables for Design System */

            --gold-primary: #C8A76D;

            --teal: #2ED3C6;
            --slate-dark: #1A1A1A;

        }


        






        /* Main Content */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 2rem 0 2rem;
            position: relative;
            z-index: 1;
        }

        /* Hero Section - Full viewport with centered content */
        .hero {
            min-height: 100vh;
            height: 100vh;
            padding: 0;
            margin: 0;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Hero Section - Elegant Coral-Teal Compass */
        .hero::before {
            content: '';
            position: absolute;
            top: 20%;
            right: -10%;
            width: 600px;
            height: 600px;
            background-image: url('assets/hero-compass.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.08;
            transform: rotate(15deg);
            pointer-events: none;
            z-index: 0;
            animation: gentle-rotate 120s linear infinite;
            mask-image: radial-gradient(
                circle at center,
                rgba(0,0,0,1) 0%,
                rgba(0,0,0,0.8) 40%,
                rgba(0,0,0,0.4) 70%,
                rgba(0,0,0,0.1) 85%,
                transparent 100%
            );
            -webkit-mask-image: radial-gradient(
                circle at center,
                rgba(0,0,0,1) 0%,
                rgba(0,0,0,0.8) 40%,
                rgba(0,0,0,0.4) 70%,
                rgba(0,0,0,0.1) 85%,
                transparent 100%
            );
        }

        /* New Gentle Animations */
        @keyframes gentle-rotate {
            0% { transform: rotate(15deg); }
            100% { transform: rotate(375deg); }
        }

        @keyframes gentle-rotate-reverse {
            0% { transform: rotate(-20deg); }
            100% { transform: rotate(-380deg); }
        }

        @keyframes gentle-float {
            0%, 100% { 
                transform: rotate(30deg) translateY(0px);
                opacity: 0.07;
            }
            50% { 
                transform: rotate(32deg) translateY(-5px);
                opacity: 0.09;
            }
        }
        
        .hero-content {
            position: relative;
            text-align: left;
            padding: 0 1rem;
        }

        .hero-badge {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--lg-coral);
            margin-bottom: 1.5rem;
            display: block;
            font-weight: 700;
            clear: none;
            position: relative;
            z-index: 3;
        }

        .hero-photo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 
                0 0 0 3px rgba(249, 111, 110, 0.15),
                0 0 30px rgba(249, 111, 110, 0.2),
                0 12px 40px rgba(0, 0, 0, 0.3);
            
            /* Enhanced text wrapping */
            float: left;
            margin: 0 2.5rem 1.5rem 0;
            shape-outside: circle(70px at 50% 50%);
            shape-margin: 2rem;
            
            position: relative;
            z-index: 2;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            filter: brightness(1.05) contrast(1.1) saturate(1.1);
        }
        
        .hero-photo::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--lg-coral), var(--lg-teal));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .hero-photo:hover {
            transform: scale(1.08) rotate(2deg);
            box-shadow: 
                0 0 0 4px rgba(249, 111, 110, 0.3),
                0 0 50px rgba(249, 111, 110, 0.4),
                0 20px 60px rgba(0, 0, 0, 0.5);
            filter: brightness(1.1) contrast(1.15) saturate(1.2);
        }
        
        .hero-photo:hover::before {
            opacity: 0.3;
        }

        .hero-typography {
            clear: none;

        .hero-buttons {
            display: flex;

        .hero-cta {
            display: inline-flex;
            align-items: center;
            padding: 18px 36px;

            text-decoration: none;

            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);

            position: relative;
            overflow: hidden;
            margin-right: 1rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-soft);
        }

        .hero-cta::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.8s ease;
        }
        
        .hero-cta::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .hero-cta:hover::before {
            left: 100%;
        }
        
        .hero-cta:hover::after {
            opacity: 1;
        }

        .hero-cta:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 
                var(--shadow-strong),
                var(--glow-coral);
            border-color: rgba(249, 111, 110, 0.8);
        }

        .hero-cta svg {
            margin-right: 10px;
            transition: transform 0.3s ease;
        }

        .hero-cta:hover svg {
            transform: translateX(2px);
        }

        .hero-cta-secondary {

        /* Services Section - Full viewport */

        .service-card:hover {

 }
